# CI — pytest (backend) + tsc/eslint/vitest (frontend) em cada push/PR.
# Baseado no ci.yml do Meu Controle (kit sdd-bootstrap).
#
# GUARDAS TEMPORARIAS: os `if: hashFiles(...)` mantem o CI verde enquanto o
# repositorio so tem docs. Remover as guardas no T-001 (scaffold) — depois
# dele, arquivo ausente deve quebrar o CI, nao pular os checks.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('backend/requirements-dev.txt') != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        if: hashFiles('backend/requirements-dev.txt') != ''
        run: pip install -r requirements-dev.txt
      - name: Run tests
        if: hashFiles('backend/requirements-dev.txt') != ''
        env:
          SECRET_KEY: ci-test-secret
        run: python -m pytest tests/ -v
      - name: pip-audit (informativo — nao bloqueia)
        if: hashFiles('backend/requirements-dev.txt') != ''
        run: python -m pip_audit
        continue-on-error: true

  frontend:
    name: Frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
      - name: TypeScript check
        if: hashFiles('frontend/package-lock.json') != ''
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: ESLint
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run lint
      - name: Unit tests (vitest)
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm test
      - name: npm audit (informativo — nao bloqueia)
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm audit --audit-level=high
        continue-on-error: true
