# CI — pytest + ruff (backend) e tsc + eslint + vitest (frontend) em cada push/PR.
# Baseado no ci.yml do Meu Controle (kit sdd-bootstrap).
name: CI

on:
  push:            # todas as branches: feat/* recebe feedback antes do merge em master
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff + migrations no Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ingestao.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Validar pacotes de provas (data/provas)
        run: python -m ingestao validar --todas
      - name: Migrations no Postgres (upgrade -> downgrade -> upgrade)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: pip-audit (informativo — nao bloqueia)
        run: python -m pip_audit
        continue-on-error: true

  frontend:
    name: Frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: ESLint
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: npm audit (informativo — nao bloqueia)
        run: npm audit --audit-level=high
        continue-on-error: true
