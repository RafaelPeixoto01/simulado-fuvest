# CI — pytest + ruff (backend) e tsc + eslint + vitest (frontend) em cada push/PR.
# Baseado no ci.yml do Meu Controle (kit sdd-bootstrap).
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ingestao.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: pip-audit (informativo — nao bloqueia)
        run: python -m pip_audit
        continue-on-error: true

  frontend:
    name: Frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: ESLint
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: npm audit (informativo — nao bloqueia)
        run: npm audit --audit-level=high
        continue-on-error: true
