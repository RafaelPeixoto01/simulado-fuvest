  enunciado:
  - texto: |-
      A Cúpula da Amazônia, realizada em 2023, na cidade de Belém, foi marcada não apenas pelas prováveis convergências sobre a necessidade de preservação da Amazônia, mas por divergências e uma contradição: o que fazer com as enormes reservas de petróleo já descobertas nos países da região?
      De um lado, há um grupo formado por países como Venezuela e Brasil e os recém-chegados Suriname e Guiana, que têm significativas reservas de petróleo e que não dão demonstrações de que pretendem deixar de explorar os recursos no curto e no médio prazo.
      Do outro lado, está a voz dissonante da Colômbia, que anunciou o fim da liberação de novas licenças para explorar petróleo no início deste ano como uma forma de mover sua economia na direção da chamada transição energética - a passagem de uma matriz energética focada na queima de combustíveis fósseis para uma baseada em fontes renováveis.
      Leandro Prazeres, BBC News Brasil, 4 de agosto de 2023. Adaptado.
      A partir da leitura do texto e de seus conhecimentos, é correto afirmar:
  alternativas:
    A:
      texto: Mesmo com o alto grau de fragilidade da região amazônica e a intensificação da exploração
        de petróleo, os impactos socioambientais na floresta serão reversíveis, uma vez que os países
        citados serão recompensados financeiramente para investir na conservação dos recursos naturais.
    B:
      texto: A necessidade de preservar a Floresta Amazônica não se justifica, pois a principal fonte
        de emissões de gases do efeito estufa do Brasil, país detentor da maior parte da floresta, vem
        da queima de combustíveis fósseis, e não do desmatamento.
    C:
      texto: Do ponto de vista econômico, é necessário preservar as reservas florestais da Amazônia e
        seus ecossistemas para que seja viável continuar explorando reservas de combustíveis fósseis pelo
        mundo, mas em lugares com menor biodiversidade.
    D:
      texto: Apesar de Suriname e Guiana estarem entre as novas fronteiras locais do petróleo, depois
        de terem descoberto novas reservas nas águas de petróleo, esses países não têm interesse em alterar
        os ecossistemas locais e, por isso, defendem uma matriz energética mais sustentável.
    E:
      texto: Os líderes dos países da região amazônica travam embates sobre a exploração do petróleo na
        região; por um lado, há países que apoiam a exploração, de olho nos dividendos, por outro, há
        países que defendem frear a extração de combustíveis fosseis para alterar a matriz energética.
  resposta: E
  anulada: false
  pendencias: []
