        “Ela teve uma morte repentina, quase igual à do seu defunto rei. Foi no oitavo dia da morte do marido que ela se aproximou da figueira para fazer as oferendas. Apareceu a mesma cobra que lançou línguas de fogo, levando consigo a vida da rainha. Ela morreu de joelhos, e de joelhos foi enterrada, com uma faca encravada na palma da mão direita, uma moeda de ouro e grãos de mapira [sorgo; milho-zaburro] na outra, pois se outra coisa se fizesse, não haveria paz para todos os seus descendentes.”
