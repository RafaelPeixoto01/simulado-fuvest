      Pois cumpre notar que o principal efeito de todas as paixões nos homens é que incitam e dispõem a sua alma a querer as coisas para as quais elas lhe preparam os corpos; de sorte que o sentimento de medo incita a fugir, o da audácia a querer e assim por diante.
      Descartes. As paixões da alma .
      Ao longo da História da Filosofia, muito tem sido discutido sobre a relação entre as paixões e a alma.
      Com base no trecho citado, e seguindo a relação nele proposta, qual proposição seria verdadeira e coerente com o pensamento cartesiano?
  alternativas:
    A:
      texto: As paixões são o que incitam a alma à ilusão.
    B:
      texto: As paixões nos ensinam o verdadeiro sentido da alma.
    C:
      texto: A alma permanece escrava de suas paixões.
    D:
      texto: O sentimento de pertencimento incita a alma a cooperar.
    E:
      texto: O sentimento de aversão incita a alma a lembrar.
  resposta: D
  anulada: false
