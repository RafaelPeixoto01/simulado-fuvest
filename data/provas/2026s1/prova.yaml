  alternativas:
    A:
      texto: A ocorrência social das brincadeiras perpassa tempos e espaços distintos, mas os sentidos
        atribuídos ao brincar permanecem os mesmos desde sempre, restringindo essa atividade a poucos
        grupos sociais na contemporaneidade.
    B:
      texto: As brincadeiras ocuparam importante lugar em diferentes sociedades e culturas, sendo vivenciadas
        por adultos que nem sempre atribuíram significativo valor ao aspecto lúdico dessas atividades.
    C:
      texto: No processo de apropriação da brincadeira, o patrimônio cultural exerce papel importante
        na transmissão e perpetuação do universo lúdico, mas o papel fundamental fica a cargo da transmissão
        exercida pelas mídias sociais.
    D:
      texto: As transformações sociais, especialmente a partir da Revolução Industrial, podem ter contribuído
        para ressignificar os brinquedos e, consequentemente, a brincadeira e também quem brinca.
    E:
      texto: Brincar é uma prática corporal livre, que não admite o estabelecimento de regras, objetivos
        ou papéis sociais, razão pela qual essa atividade é atribuída somente à categoria social da infância.
