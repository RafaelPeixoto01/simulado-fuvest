  - texto: |-
      Compostos sintéticos polifluorados (PFAs) são denominados “produtos químicos persistentes”. Os PFAs são compostos altamente estáveis, bioacumulativos e, uma vez dispersos no ambiente, permanecerão inalterados por séculos. Dentre os PFAs, encontram-se os PFAs carboxílicos e os PFAs sulfônicos.
      Visando avaliar a capacidade de um filtro de carvão ativado na remoção desses compostos da água, foi realizado um estudo cujos resultados são apresentados na figura.
  - figura: q085-1.webp
  - texto: Com base nos resultados desse estudo, é correto concluir que
  alternativas:
    A:
      texto: o filtro de carvão ativado, além de não ter sido capaz de remover os PFAs, contribuiu para
        que as suas concentrações na água aumentassem.
    B:
      texto: quanto maior o tamanho da cadeia carbônica do PFA, maior é a sua solubilidade em água em
        razão da presença do flúor.
    C:
      texto: os PFAs sulfônicos são mais solúveis em água do que PFAs carboxílicos com mesmo tamanho de
        cadeia carbônica e, portanto, são menos retidos pelo carvão ativado.
    D:
      texto: uma vez que o carvão ativado é polar, a sua capacidade de reter PFAs independe do tamanho
        da cadeia carbônica desses compostos.
    E:
      texto: o carvão ativado retém melhor os PFAs menos polares e, portanto, menos solúveis em água.
  resposta: E
  anulada: false
