  - texto: 'Brincar: verbo associado ao entretenimento e à diversão. A brincadeira é a ação do brincar.
      Ora entre crianças, ora entre adultos. Seja no Oriente, seja no Ocidente, o que separa a brincadeira
      de outras atividades cotidianas é o seu aspecto pautado pela diversão e pela criatividade, ao se
      opor a uma ação realizada em prol da sobrevivência ou da necessidade.'
