      Há um princípio da dúvida que consiste na máxima de tratar os conhecimentos no intuito de torná-los incertos e mostrar que é impossível alcançar a certeza. Esse método de filosofar é o modo de pensar cético ou ceticismo, que se opõe ao modo de pensar dogmático ou dogmatismo, que é uma confiança cega no poder de a razão sem crítica ampliar-se a priori somente por conceitos, em virtude apenas de um êxito aparente.
      Kant. Manual dos cursos de lógica geral . Campinas: Ed. da Unicamp, 2014.
      Considerando as definições apresentadas no texto, qual alternativa apresenta afirmações que correspondem, respectivamente, a uma tese cética e a uma tese dogmática?
  alternativas:
