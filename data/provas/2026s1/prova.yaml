      texto: 200 nm
    B:
      texto: 300 nm
    C:
      texto: 400 nm
    D:
      texto: 500 nm
    E:
      texto: |-
        600 nm
        Note e adote:
        A precisão relativa é definida como a razão entre o erro intrínseco à medida e o valor da própria medida.
  resposta: E
