        de especiarias orientais e à superfluidade da vida mundana.
    B:
      texto: Os efeitos comportamentais provocados pela Peste Negra dificultaram a disseminação da doença
        pelo continente europeu.
    C:
      texto: A falta de conhecimento preciso sobre as formas de contaminação favoreceu a sua disseminação
        para diversas regiões europeias.
    D:
      texto: A disseminação da morte preservou as práticas e os rituais fúnebres, que mantiveram suas
        características vinculadas às orientações cristãs.
    E:
      texto: A Peste Negra provocou uma ruptura institucional imediata na cristandade medieval, baseada
        nas práticas culturais.
  resposta: C
