      texto: Os fenômenos físico-químicos não esgotam todos os eventos do mundo. O conceito de um Deus
        criador é uma marca das religiões monoteístas.
    B:
      texto: A existência do mundo exterior é algo altamente duvidoso. Do conceito de ser absolutamente
        perfeito derivamos a existência de Deus.
    C:
      texto: É muito difícil estimar com precisão quantos grãos de arroz há neste silo. Nada pode ser
        mais rápido do que a velocidade da luz.
    D:
      texto: Não podemos entender como esse tipo de animal se comporta até estudarmos um exemplar. O conceito
        de cosmos exige que o mundo tenha tido um começo.
    E:
      texto: Previsões sobre eventos podem ter maior ou menor probabilidade de ocorrer. Podemos abstrair
        o conceito de quantidade de coleções diversas de objetos.
  resposta: B
