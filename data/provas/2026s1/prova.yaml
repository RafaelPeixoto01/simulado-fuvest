  - texto: |-
      Aurora polar é um fenômeno conhecido nos hemisférios norte e sul do planeta Terra e caracteriza-se por um brilho observado no céu em decorrência do impacto entre as partículas carregadas lançadas pela erupção solar (predominantemente elétrons) que são canalizadas pelo campo magnético terrestre e os átomos da atmosfera, predominantemente oxigênio e nitrogênio.
      Considerando que os elétrons lançados pela erupção solar possuem energia cinética da ordem de 2×10 J e supondo que eles descrevem órbitas circulares sob ação do campo magnético terrestre da ordem de 10 T (suposto uniforme), a ordem de grandeza do raio da órbita desses elétrons é:
  alternativas:
    A:
      texto: 10 m
    B:
      texto: 10 m
    C:
      texto: 10 m
    D:
      texto: 10 m
    E:
      texto: |-
        10 m
        Note e adote:
        Módulo da força magnética de uma partícula de carga q e velocidade v na presença de um campo magnético uniforme B perpendicular à velocidade: F = q.v.B.
        Módulo da força centrípeta de uma partícula de massa m em movimento circular uniforme de raio R com velocidade escalar v: F = mv /R.
        Massa do elétron: m = 10 kg.
        Carga do elétron e = 1,6×10 C.
  resposta: B
