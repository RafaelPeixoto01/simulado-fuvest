      Em particular, a alteração na dieta dos animais melhorou a proporção de Ômega-6 ( Ω -6) e Ômega-3 ( Ω -3) que, em quantidades adequadas, têm um importante papel na prevenção, por exemplo, de doenças cardiovasculares e inflamatórias crônicas, além de alguns tipos de câncer.
      O estudo mostrou que a suplementação de óleo de linhaça na dieta das vacas diminuiu no leite a proporção Ω -6 / Ω -3 de 7,92 para 2,72. Essa proporção mais baixa no leite pode contribuir para que a proporção desses ácidos graxos na alimentação diária total dos seres humanos esteja dentro da faixa indicada pela OMS, que é de 5 a 10.
      Mauricio X. S. Oliveira et al. (2021). PLoS ONE 16(2): e0246357. Disponível em https://doi.org/10.1371/journal.pone.0246357/.
