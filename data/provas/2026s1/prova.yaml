- numero: 42
  disciplina: null
  assunto: null
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      Um self social deste tipo pode ser chamado de self refletido ou self espelho. Ao ver nossa face, imagem e vestimenta no espelho, e ao estarmos interessados neles por serem nossos, e satisfeitos ou não com eles dependendo de corresponderem ou não ao que gostaríamos que fossem; então, na imaginação, nós percebemos na mente do outro algum pensamento sobre nossa aparência, nosso jeito, nossos objetivos, atos, caráter, amigos etc., e somos afetados por isso. Uma ideia de self deste tipo parece ter três elementos principais: a imaginação da nossa aparência para a outra pessoa; a imaginação do julgamento que o outro faz dessa aparência, e algum tipo de sentimento sobre si, tal como orgulho ou mortificação. O que nos move para o orgulho ou vergonha não é o mero reflexo mecânico de nós, mas um sentimento imputado, o efeito imaginado deste reflexo na mente do outro.
      Charles Horton Cooley. Human nature and public order . ( Revised edition ) . New York: Charles Scribner's Sons, 1922. Adaptado.
      De que maneira é possível compreender os efeitos de redes sociais como o Instagram na saúde mental e vida dos jovens a partir da noção de “ self -refletido” / “ self -espelho” desenvolvida pelo sociólogo Charles Cooley?
  alternativas:
    A:
      texto: Ao compartilhar fotos nas redes sociais, os jovens conseguem acessar os julgamentos objetivos
        dos outros sobre si que definem o seu self e, com isso, tornam-se inseguros.
    B:
      texto: O compartilhamento de fotos nas redes sociais permite que os jovens julguem com maior precisão
        a imagem dos outros e, com isso, tornem-se menos confiantes para apresentar o seu verdadeiro self
        .
    C:
      texto: Nas redes sociais, os jovens criam um self dissociado da avaliação que os outros fazem dele
        e, por isso, tornam-se ansiosos e inseguros com a sua própria imagem.
    D:
