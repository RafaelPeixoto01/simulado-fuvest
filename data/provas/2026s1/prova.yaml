  - texto: |-
      Tenho uma filha crescida que ainda estuda embora já tenha estudado muito. Um dia disse-me (...) Que a terra é a mãe da natureza e tudo suporta para parir a vida. Como a mulher. Os golpes da vida a mulher suporta no silêncio da terra. Na amargura suave segrega um líquido triste e viscoso como o melão. Quem já viajou no mundo da mulher? Quem ainda não foi, que vá. Basta dar um golpe profundo, profundo, que do centro vermelho explodirá um fogo mesmo igual à erupção de um vulcão.
      Paulina Chiziane . Balada de amor ao vento.
      A citação apresentada estabelece argumentos que serão desenvolvidos ao longo do romance de Paulina Chiziane. Considerando a comparação que constitui esse argumento, é correto afirmar:
  alternativas:
    A:
      texto: A comparação da mulher com a terra, força geradora da vida, ecoa em Sarnau. Contudo, apesar
        de experimentar a maternidade e ter de lidar com as tradições, a conclusão da narrativa informa
        que ela não encontra seu lugar na sociedade.
    B:
      texto: A ideia de que a mulher suporta os "golpes da vida no silêncio da terra" reflete apenas as
        experiências de Sarnau. As outras personagens femininas do romance não compartilham do mesmo sofrimento.
    C:
      texto: Ao narrar a vida de Sarnau, o romance convida a "viajar no mundo da mulher", dando voz às
        experiências e complexidades da vida feminina em Moçambique e expondo um universo bem compreendido
        pelos homens.
    D:
      texto: A metáfora do vulcão que explode de um "centro vermelho" ao receber um "golpe profundo" relaciona-se
        aos momentos de ruptura com as tradições e à resistência de Sarnau à pressão social.
    E:
      texto: O trecho sugere haver uma força feminina oculta capaz de explodir em face da violência, mas
        a comparação da mulher com a terra, enfatizando o silêncio e a dor suportada, reflete a atitude
        passiva com que Sarnau reage às adversidades de sua jornada.
  resposta: D
