  enunciado:
  - texto: Em pistas de dança, há dispositivos que convertem energia do movimento dos frequentadores em
      energia elétrica. No arranjo experimental da figura, um ímã, preso a uma mola ideal, pode oscilar
      verticalmente, com resistência do ar desprezível, ao longo de uma linha imaginária que passa pelo
      centro de uma espira metálica conectada a uma lâmpada de filamento. Em certo instante inicial, uma
      estudante transfere energia para o sistema ímã-mola, deformando a mola e abandonando o ímã a partir
      do repouso, fazendo-o oscilar. Ela registra que, após algum tempo, não se observam mais oscilações
      do ímã.
  - figura: q090-1.webp
  - texto: |-
      A respeito dessa situação, considere seguintes afirmações:
      I. A corrente elétrica induzida no anel pelo movimento do ímã tem intensidade variável e percorre o anel sempre no mesmo sentido.
      II. Uma vez iniciadas as oscilações, a intensidade com que a lâmpada brilha atinge um máximo e, em seguida, diminui um pouco, permanecendo constante a partir de então. III. Se a estudante reiniciar o experimento, agora duplicando a deformação inicial da mola, a energia total irradiada pela lâmpada quadruplicará.
      É correto apenas o que se afirma em:
  alternativas:
    A:
      texto: I.
    B:
      texto: II.
    C:
      texto: III.
    D:
      texto: I e II.
    E:
      texto: II e III.
  resposta: C
  anulada: false
  pendencias:
