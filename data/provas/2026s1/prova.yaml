  - texto: |-
      Embora historiadores frequentemente se refiram à chamada “revolução impressa” atribuída a Johannes Gutenberg, em Mogúncia (Mainz), nos meados do século XV, não se pode duvidar do impacto, sobre a leitura, da revolução informatizada que se observa neste século. Tampouco podemos duvidar da velocidade da revolução eletrônica. “Creio que há um mercado mundial para uns cinco computadores”, disse Thomas J. Watson, então presidente da IBM em 1943, demonstrando o nível de astúcia empresarial que costumamos associar a essa grande empresa. Em 1949, a revista Popular Mechanics , prevendo o incansável avanço das descobertas científicas, previu que “computadores, no futuro, pesarão não mais que quinze toneladas”. Essa previsão, no mínimo, teve a virtude de estar correta. Mais recentemente, em 1977, Ken Olsen, então presidente da Digital Corporation, garantiu ao mundo que “não há razão para qualquer indivíduo ter um computador em casa”.
      Martyn Lyons. A palavra impressa : histórias da leitura no século XIX. Rio de Janeiro: Casa da Palavra, 1999.
      A analogia entre a “revolução impressa” e a “revolução técnico-científico-informacional”, às quais o texto se refere, diz respeito
  alternativas:
    A:
      texto: ao diminuto impacto que as revoluções científicotecnológicas trouxeram às relações interpessoais.
    B:
      texto: ao espírito empreendedor e visionário de personagens históricos como Gutenberg e Ken Olsen.
    C:
      texto: à ausência, em ambos os casos, de um mercado amplo de leitores e de informações.
    D:
      texto: à lentidão das inovações tecnológicas, resultado da falta de investimentos estatais.
    E:
      texto: à ampliação do acesso à informação como decorrência de transformações tecnológicas.
  resposta: E
  anulada: false
  pendencias:
  - 'Índice/expoente em fonte pequena na página 21, y≈318: conferir o texto'
