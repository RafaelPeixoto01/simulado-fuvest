      “(...) propor novas formas de sobrevivência aos sujeitos periféricos, posicionando-se ao lado do bandido (sem se confundir com ele) ao mesmo tempo que se define enquanto marginal, ou seja, um sujeito destinado a morrer pelas mãos do Estado, mas que consegue sobreviver no inferno: ‘Permaneço vivo, prossigo a mística/Vinte e sete anos contrariando a estatística’.”
      A partir do excerto, é possível estabelecer uma relação entre o processo de metropolização e as manifestações artísticas. Nesse contexto, é correto afirmar que o rap
  alternativas:
