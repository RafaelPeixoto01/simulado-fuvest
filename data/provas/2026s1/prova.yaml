      Há um fenômeno interessante nas redes sociais, os influenciadores isentões. Talvez não seja novidade para ninguém e eu seja só a tia atrasada do rolê. Talvez todo mundo ache que a vida é assim, mas quando percebi a mutreta, achei muito esperto e, também, bastante desonesto. São celebridades e perfis que ganharam projeção com fofocas do meio artístico, cobertura sobre a programação de TV, que hoje abrange o streaming , alguns com comentários bemhumorados e, muitas vezes, críticas bastante ácidas. Eu passei a seguir algumas dessas páginas, que muitas vezes nem rosto têm, por causa do humor e das sacadas geniais para zombar da vida e de gente famosa. Não foi de cara que percebi a repetição do mesmo padrão, foto ou vídeo postados não vêm mais com uma legenda opinativa, mas com a descrição do episódio — às vezes, nem isso, e uma pergunta: "o que vocês acharam disso?", "qual dos dois está certo?", "fulano tem razão?" Quem está distraído pode até pensar que a boa alma, que quase sempre tem milhões de seguidores, quer dar voz ao seguidor, abrir espaço para que todos deem sua opinião, democratizar o debate. Na prática, é só um jeito de conseguir muito engajamento sem expor a própria opinião, sem fazer nenhum esforço de reflexão, sem correr o risco de ser cancelado por desagradar A ou B. Muitos desses perfis romperam a barreira do assunto entretenimento e possuem também conteúdo político. Quem resiste, não é mesmo? Parece que se você não falar de política nos dias de hoje, você nem existe. Mas como falar do assunto para quem só está ali porque quer ver as tretas sobre o BBB? Posando de isentão.
      Mariliz Pereira Jorge. Os influenciadores isentões . Folha de S. Paulo. 31.05.2022. Adaptado.
