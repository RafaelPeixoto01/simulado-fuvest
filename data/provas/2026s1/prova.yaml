  - texto: |-
      Um aumento no consumo de água e produtos agropecuários pela população humana, direta ou indiretamente, geralmente vem atrelado a um aumento na pressão exercida sobre o meio ambiente. Por outro lado, há uma crescente preocupação com a preservação dos biomas brasileiros, de forma a garantir o suprimento de recursos ambientais e evitar a extinção de espécies.
      Assinale a alternativa que apresenta duas soluções de amplo alcance geográfico e sustentáveis (dos pontos de vista ambiental e econômico) para diminuir o impacto da expansão da lavoura sobre a vegetação nativa (I) e para o melhor aproveitamento de recursos hídricos (II).
      I - Diminuição da produção agrícola.
  alternativas:
    A:
      texto: |-
        II - Instalação de condensadores de umidade do ar nas áreas rurais.
        I - Aumento da produtividade nas lavouras sem aumento da área cultivada.
    B:
      texto: |-
        II - Preservação e recuperação de nascentes e matas ciliares.
        I - Uso extensivo de sementes transgênicas.
    C:
      texto: |-
        II - Instalação de um maior número de poços artesianos nas cidades e no campo.
        I - Diminuição da produção agrícola.
    D:
