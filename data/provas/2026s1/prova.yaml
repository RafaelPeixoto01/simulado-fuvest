  enunciado:
  - texto: No início do século XX, motores conhecidos como “ hot-bulb ” tornaram-se muito populares, sendo
      utilizados em tratores e outros maquinários. Diferentemente dos motores a diesel, em que a compressão
      do combustível causa sua ignição, esses motores funcionam por meio de uma superfície metálica aquecida
      a alta temperatura, que é responsável por vaporizar e permitir a detonação do combustível. Para
      ligar esse motor, portanto, é necessário usar uma chama externa, como ilustrado na figura, até que
      tal superfície esteja quente o suficiente para que o motor entre em operação, momento no qual a
      chama externa deve ser apagada.
  - figura: q083-1.webp
  - texto: Nesses motores, uma das funções da chama externa é
  alternativas:
    A:
      texto: fornecer a energia de ativação necessária para que a combustão se inicie e o motor entre
        em funcionamento.
    B:
      texto: atuar como comburente para o funcionamento do motor, permitindo que a combustão aconteça.
    C:
      texto: evitar o vazamento de combustível, fazendo com que qualquer quantidade que possa entre em
        combustão.
    D:
      texto: fornecer calor ao motor para manter a lubrificação constante e o motor em funcionamento.
    E:
      texto: fornecer calor para aquecer o comburente, de forma que o processo de combustão não cesse.
  resposta: A
  anulada: false
  pendencias: []
