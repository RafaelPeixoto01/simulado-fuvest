      No pós-Segunda Guerra, sociólogos e cientistas políticos elaboraram diferentes teorias sobre a convergência entre países desenvolvidos e em desenvolvimento. Uma delas, a teoria da modernização, pressupunha que os países em desenvolvimento que modernizassem suas economias por meio da industrialização e da urbanização tenderiam a ampliar a participação política dos cidadãos, reforçar o controle democrático sobre os governos e consolidar direitos trabalhistas e sociais.
      Em suma, projetando nos países em desenvolvimento uma trajetória típica trilhada por alguns pioneiros da industrialização,
      essas
      teorias
      consideravam
      o desenvolvimento econômico um caminho seguro para a disseminação de democracias liberais no mundo.
      Todavia, a análise dos contextos de países em desenvolvimento, entre os anos 1960 e 1980, levou à contestação da teoria da modernização, que se mostrou frágil por desconsiderar que
  alternativas:
    A:
      texto: os países em desenvolvimento no período convergiram, mas em torno de democracias populares,
        baseadas na propriedade estatal ou coletiva dos meios de produção, típicas de regimes políticos
        socialistas.
    B:
      texto: o rápido crescimento econômico de países em desenvolvimento, com industrialização e urbanização,
        seguiu trajetórias divergentes e, frequentemente, ocorreu em meio a regimes políticos autoritários
        e com forte restrição de direitos políticos e sociais.
    C:
      texto: o crescimento econômico de países em desenvolvimento ocorreu por meio da modernização e dinamismo
        do setor primário, com crescente incorporação de mão de obra nessas atividades, sem envolver urbanização
        significativa.
    D:
      texto: a ampliação massiva da relação salarial formal e a resultante ampliação de direitos sociais
        e políticos em países em desenvolvimento restringiram as condições de crescimento econômico ao
        aumentar excessivamente os custos de produção.
    E:
      texto: a urbanização e a industrialização diversificaram as atividades econômicas em países em desenvolvimento
        e pulverizaram os interesses dos trabalhadores, o que enfraqueceu sua representação política.
  resposta: B
