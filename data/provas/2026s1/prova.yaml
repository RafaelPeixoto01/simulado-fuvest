  - texto: |-
      Perhaps you’ve noticed that more and more people are “creative” these days: creative directors, creative consultants, content creators. In recent essays, researchers reflect upon how a word once applied to artists was co-opted by the corporate and tech worlds. In the postwar consumer economy, businesses began to prize “creative” thinkers who could figure out how to brand and sell products. The vogue for creativity led to such intense and wacky ideas as Synectics, a kind of group therapy designed to solve problems by accessing the subconscious. Creativity has become a life style, with “coders dressed like bohemians,” and also the paragon of human flourishing: “Uncreative people are rigid and repressed; creative people are authentically themselves, and therefore fully human.” That sounds nice, but reading more about the topic could help to understand how in such cases creativity has always been more about economics than about aesthetics.
      Disponível em https://www.newyorker.com/magazine/. Adaptado.
      De acordo com o texto, o emprego da “criatividade” pelo mundo corporativo tem como objetivo
  alternativas:
    A:
      texto: ampliar o apelo comercial dos produtos criados por meio de recursos estéticos.
    B:
      texto: aprimorar a qualidade de vida dos funcionários das grandes empresas.
    C:
      texto: difundir métodos alternativos de investigação no campo da psicologia aplicada.
    D:
      texto: incentivar a contratação de historiadores da arte pelas companhias de marketing .
    E:
      texto: investir em pesquisas acadêmicas sobre o intercâmbio entre arte e economia.
  resposta: A
  anulada: false
  pendencias: []
