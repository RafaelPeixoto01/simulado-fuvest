      No trecho a seguir, o personagem Quincas Borba pretende criticar uma opinião bastante comum sobre as doenças infecciosas letais. Para tanto, ele apresenta um argumento:
      “Aparentemente, há nada mais contristador que uma dessas terríveis pestes que devastam um ponto do globo? E, todavia, esse suposto mal é um benefício, não só porque elimina os organismos fracos, incapazes de resistência, como porque dá lugar à observação, à descoberta da droga curativa.”
      Machado de Assis. Quincas Borba .
      Qual das sentenças a seguir enfraquece o argumento desenvolvido no texto?
  alternativas:
    A:
