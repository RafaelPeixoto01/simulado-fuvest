    C:
      texto: Não é preciso esperar a disseminação de uma peste para estudar as drogas que a combatem.
    D:
      texto: Os organismos incapazes de resistência dependem da seleção natural para não ser eliminados.
    E:
      texto: A observação cientifica se serve das pestes para progredir.
  resposta: C
