      Um fóton de frequência f transporta energia dada por hf , sendo h a constante de Planck. Considere que a frequência de um fóton de raios-X varia de 5×10 s para 2,5×10 s devido à colisão com um elétron e que a energia perdida pelo fóton é totalmente transferida para o elétron.
