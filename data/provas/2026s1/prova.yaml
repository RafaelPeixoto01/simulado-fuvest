  enunciado:
  - texto: |-
      A Antártica é um ambiente altamente sensível às mudanças climáticas. Por essa razão, cientistas estudam, por meio de imagens de sensoriamento remoto e levantamentos de campo, as consequências dos efeitos da diminuição da camada de ozônio.
      A imagem a seguir representa a camada de ozônio na Antártica, em 2018.
  - figura: q051-1.webp
  - texto: |-
      Espessura da camada de ozônio em 2018. Conforme a legenda, quanto mais vermelha a região, mais fina é a camada; quanto mais azul, mais espessa.
      Disponível em https://earthobservatory.nasa.gov/world-of-change/.
      No esquema a seguir, está representada uma das reações que ocorrem entre espécies químicas presentes no oceano e na atmosfera do continente gelado.
  - figura: q051-2.webp
  - texto: |-
      Sergio J. Gonçalves Jr et al. Photochemical reactions on aerosols at West Antarctica: A molecular case-study of nitrate formation among sea salt aerosols. Science of The Total Environment , 2021.
      A partir das informações apresentadas, considere as seguintes afirmações:
      I. Com a diminuição da espessura da camada de ozônio, aumenta a incidência da radiação solar sobre a atmosfera terrestre e a superfície do planeta, acelerando ou incrementando reações de natureza fotoquímica sobre os mantos de gelo polares.
      II. Em processos químicos envolvendo cloretos, estes podem ser oxidados a C , O pelo O , sob a ação de raios UV. Em razão de sua propriedade anticongelante, os percloratos contribuem para manter a água no estado líquido mesmo a temperaturas abaixo de 0 ºC.
      III. Mesmo em condições extremas de frio, a presença de água líquida no manto congelado flutuante na Antártica é condição suficiente para garantir a sobrevivência do ser humano e de outros mamíferos sobre a camada de gelo. É correto apenas o que se afirma em:
  alternativas:
    A:
      texto: I.
    B:
      texto: III.
    C:
      texto: I e II.
    D:
      texto: I e III.
    E:
      texto: II e III.
  resposta: C
  anulada: false
