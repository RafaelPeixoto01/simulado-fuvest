  enunciado:
  - texto: |-
      Embora sob perspectivas de diferentes, todos os autores referenciados a seguir sublinham o significado e a importância da arte na experiência humana.
      I- “para poder ser criativa, a imaginação necessita identificarse com uma materialidade. Criará em afinidade e empatia com ela, na linguagem específica de cada fazer. Mas sempre conta a visão global de um indivíduo, a perspectiva que ele tenha do amplo fenômeno que é o humano, o seu humanismo. São seus valores de vida que dão a medida para seu pensar e fazer.”
      Fayga Ostrower. Materialidade e imaginação criativa . In: Criatividade e processos de criação. Petrópolis: Vozes, 2014.
      II- “A primeira forma de relação entre imaginação e realidade consiste em que toda obra da imaginação constrói-se sempre de elementos tomados da realidade e presentes na experiência anterior da pessoa.”
      Lev Semionovitch Vygotsky. Imaginação e realidade . In: Imaginação e criação na infância. São Paulo: Expressão Popular, 2018.
      III- “O artista não somente cristaliza na sua criação uma dada realidade social, mas responde ativamente às solicitações de seu meio, às exigências de sua classe, aos problemas morais, sociais e políticos de sua época. Individualmente criada e socialmente condicionada, a obra de arte une, em si mesma, na unidade da forma e do conteúdo que a singulariza, a experiência individual e a social.”
      Benedito Nunes. As condições sociais da Arte . In: Introdução à filosofia da arte. São Paulo: Ática, 1989. IV- “Arte não é apenas básico, mas fundamental na educação de um país que se desenvolve. Arte não é enfeite. Arte é cognição, é profissão, é uma forma diferente da palavra para interpretar o mundo, a realidade, o imaginário, e é conteúdo. Como conteúdo, arte representa o melhor trabalho do ser humano. Arte é qualidade e exercita nossa capacidade de julgar e de formular significados que excedem nossa capacidade de dizer em palavras. E o limite da nossa consciência excede o limite das palavras.”
      Ana Mae Tavares Bastos Barbosa. Situação política do ensino da Arte no Brasil no fim dos anos oitenta . In: A imagem no ensino da arte: anos oitenta e novos tempos. São Paulo: Perspectiva, 2005.
      V- “Falando muito do nosso ambiente, do nosso meio, onde nós estamos trabalhando e vivemos, eu começaria pensando um pouco sobre o que é a arte e a obra de arte. Eu veria a arte como um fenômeno humano e, como tal, uma decorrência natural de uma manifestação poética. Seria também um anseio de totalidade que nos levaria a uma questão que entendo como de um projeto pessoal. Por outro lado, nesse mesmo ato, nesse mesmo acontecimento ou realidade, concentram-se também as energias das civilizações.”
      Evandro Carlos Jardim. Arte como manifestação poética . In: Seminário Ações singulares 2: História do Ensino da Arte: Experiências. São Paulo: Instituto Tomie Ohtake, 2009.
      Com base em sua compreensão dos textos, assinale a alternativa que expressa corretamente a relação entre arte, imaginação e sociedade, conforme o autor referenciado.
  alternativas:
    A:
      texto: Fayga Ostrower defende que a imaginação criativa sempre se origina no abstrato, em conceitos
        que transcendem o tangível, o concreto e a própria existência do artista, o qual concebe a obra
        de arte a partir de uma visão de mundo externa, sem relação com as próprias experiências.
    B:
      texto: Lev Semionovitch Vygotsky afirma que a imaginação emana unicamente da pessoa, não sendo influenciada
        ou construída a partir de elementos da realidade ou de experiências anteriores.
    C:
      texto: Benedito Nunes compreende a obra de arte como uma manifestação solitária e desconectada da
        experiência social, desprovida, portanto, de qualquer influência externa, de modo que forma e
        conteúdo da obra são expressões da pura subjetividade artística.
    D:
      texto: Ana Mae Tavares Bastos Barbosa chama a atenção para o perigo de se considerar a arte como
        uma ferramenta superficial, subestimando seu poder transformador na formação de uma nação e negligenciando
        seu papel crucial no desenvolvimento crítico e intelectual das pessoas.
    E:
      texto: Evandro Carlos Jardim, ao comparar a arte a um “fenômeno humano”, insinua que o “anseio de
        totalidade” se refere à busca incessante da humanidade pelo avanço tecnológico, sempre visando
        à perfeição e à otimização.
  resposta: D
