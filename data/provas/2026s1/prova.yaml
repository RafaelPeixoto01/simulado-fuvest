  enunciado:
  - texto: |-
      Todos davam ao corpo uma variedade de movimentos adaptados às necessidades do novo mundo urbano; mas o esporte não tardou a tomar outros significados, em termos de raça, de nação e de império. Encarnou literalmente as novas virtudes masculinas da era industrial: o culto do esforço e do mérito, o valor da competição por si mesma, a desconfiança em relação a tudo o que era puramente intelectual, a crença absoluta na diferença de gêneros, vista como natural e justa, e uma adesão igualmente forte à ideia de superioridade do homem branco sobre todas as outras raças.
      Georges Vigarello e Richard Holt. O corpo trabalhado: ginastas e esportistas no século XIX . In: Alain Corbin, Jean-Jacques Courtine e Georges Vigarello (orgs.) História do Corpo. Petrópolis: Vozes, 2008. Adaptado.
      No final do século XIX, os esportes
  alternativas:
    A:
      texto: revelavam a persistência das práticas corporais rurais, cujos esforços promoviam a modelagem
        física.
    B:
      texto: colocaram em xeque o eurocentrismo e o imperialismo, com sua capacidade de atrair grupos
        sociais e países distintos.
    C:
      texto: foram marcados pelos pressupostos científicos e culturais de igualdade de raças, gêneros
        e classes sociais.
    D:
      texto: tiveram o seu desenvolvimento dificultado pelo fortalecimento das perspectivas nacionalistas
        no continente europeu.
    E:
      texto: difundiram-se pelos mais diversos continentes, de forma articulada ao poderio e à extensão
        do Império Britânico.
  resposta: E
  anulada: false
  pendencias: []
