      A querela sobre a natureza da escravidão e sobre sua inserção na sociedade moderna tem passado por grandes transformações. A posição dominante até uns 15 anos atrás era a de que o trabalho escravo, comparado ao trabalho livre das sociedades de mercado, era improdutivo. Daí constituir a escravidão um sistema produtivo condenado a desaparecer por obsoleto frente às forças do mercado. Pesquisas mais recentes têm colocado em séria dúvida a posição desses autores. Estudos empíricos, tanto nos Estados Unidos, como no Brasil e no Caribe, têm demonstrado que até seus anos finais o sistema escravista se mostrava lucrativo, que o comportamento dos proprietários de escravos era perfeitamente racional e que certo avanço tecnológico era compatível com o trabalho escravo.
      Conclui-se que o fim da escravidão nos vários países não se deveu apenas ao avanço da sociedade de mercado. O fim da escravidão foi essencialmente um fenômeno político.
      José Murilo Carvalho. Pontos e bordados: escritos de história e política . Belo Horizonte: UFMG, 1998. Adaptado.
      O texto faz um balanço dos debates historiográficos que mudaram a forma de se explicar as razões para o fim da escravidão moderna. A “nova historiografia” defende que a escravidão
  alternativas:
    A:
      texto: revelou-se conflitante com a modernização tecnológica e econômica das nações colonizadoras.
    B:
      texto: era obsoleta diante das demandas do capitalismo por mão de obra qualificada.
    C:
