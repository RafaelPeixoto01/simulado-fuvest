      Creio que a melhor maneira de deduzir as ideias subjacentes às ações fascistas é a partir dessas próprias ações, uma vez que algumas delas permanecem imanifestas e implícitas na linguagem pública deles (dos fascistas). Muitas delas permanecem mais no domínio dos sentimentos viscerais que ao das proposições racionais. Chamei-as de “paixões mobilizadoras”: 1) um senso de crise catastrófica, além do alcance das soluções tradicionais; 2) a primazia do grupo, perante o qual todos têm deveres superiores a qualquer direito, sejam eles individuais ou universais, e a subordinação do indivíduo a esses deveres; 3) a crença de que o próprio grupo é vítima, sentimento esse que justifica qualquer ação, sem limites jurídicos ou morais, contra seus inimigos, tanto internos quanto externos; 4) o pavor à decadência do grupo sob a influência corrosiva do liberalismo individualista, dos conflitos de classe e das influências estrangeiras; 5) a necessidade de uma integração mais estreita no interior de uma comunidade mais pura, por consentimento, se possível, pela violência excludente, se necessário; 6) a necessidade da autoridade de chefes naturais (sempre do sexo masculino), culminando num comandante nacional, o único capaz de encarnar o destino histórico do grupo; 7) a superioridade dos instintos do líder sobre a razão abstrata e universal; 8) a beleza da violência e a eficácia da vontade, sempre que voltadas para o êxito do grupo; 9) o direito do povo eleito de dominar os demais, sem restrições provenientes de qualquer tipo de lei humana ou divina, o direito sendo decidido por meio do critério único das proezas do grupo no interior de uma luta darwiniana. O fascismo, segundo essa definição, ainda é visível nos dias de hoje, como também o são os comportamentos coerentes com esses sentimentos.
      Robert Paxton. A anatomia do fascismo . São Paulo: Paz e Terra, 2007.
      O cientista político e historiador estadunidense Robert Paxton lista nove características do pensamento fascista, denominadas por ele de “paixões mobilizadoras”. Considerando tais características, é correto afirmar:
  alternativas:
    A:
      texto: Fascistas têm o bem comum e as liberdades individuais como valores fundamentais da nação.
    B:
      texto: Para o fascismo, a vitória de um grupo social à frente de uma nação confere direito ao vencedor
        de subjugar outras nações e outros grupos sociais.
    C:
      texto: O uso da violência contra grupos opositores é considerado ilegítimo pelos fascistas e, por
        isso, deve ser condenado.
    D:
      texto: De acordo com o fascismo, um indivíduo proveniente de qualquer grupo social pode ser a principal
        liderança de uma nação.
    E:
      texto: O fascismo é um fenômeno restrito ao início do século XX, e ações de caráter fascista não
        são mais observadas na sociedade contemporânea.
  resposta: B
  anulada: false
