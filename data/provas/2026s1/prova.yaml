  enunciado:
  - texto: |-
      Constituída como um campo de expressão artística e de criação em contexto urbano, fortemente marcado por uma dinâmica de exclusão social, entre os anos de 1960 e 1970 em Nova Iorque, o break , dança da cultura Hip Hop , chegou às Olimpíadas da Era Moderna em Paris 2024.
      O gesto cênico coreografado no break remete a indícios de sentidos e carrega significados, na medida em que o corpo representa uma atitude interior de seus praticantes e, ao mesmo tempo, uma atitude exterior de determinados grupos sociais. A cada tempo-espaço, novos sentidos e novos significados poderão ser vivenciados e manifestados.
      A corporalidade, expressada pelo break ou por qualquer outra prática corporal, abarca um “conceito que se encontra carregado de intencionalidade como toda ação humana o é, em sua dimensão política. Tem, portanto, um conteúdo de denúncia e de anúncio”.
      Ana Marcia Silva. Entre o Corpo e as práticas corporais . In: Rev. ARQUIVOS em MOVIMENTO, Rio de Janeiro, Edição Especial, v.10, n.1, p.5-20, jan/jun 2014. Adaptado.
      A partir das considerações apresentadas, é correto afirmar:
  alternativas:
    A:
      texto: A dança break , ao adentrar o universo olímpico, precisou se despir de sua manifestação cultural
        para se pautar nas normativas e regras da modalidade esportivizada, definindo uma nova estrutura
        do estilo, que deixou de ter características de denúncia social.
    B:
      texto: Os sentidos e significados encenados durante a apresentação do break tendem, a partir de
        sua inserção nos Jogos Olímpicos, a ganhar visibilidade e reconhecimento mundial, possibilitando
        novos contornos sociais para a modalidade.
    C:
      texto: O break , ao adentrar o universo olímpico, passou a ser vivenciado por um grupo seleto de
        praticantes e carregou novas denúncias sociais em sua realidade, como o fato de o esporte de alto
        rendimento ser segregador, impedindo sua manifestação espontânea em contexto urbano.
    D:
      texto: A entrada do break nos Jogos Olímpicos tem como um de seus desafios a manutenção das características
        de sua origem, cristalizando assim os saberes oriundos dos pioneiros dessa forma de manifestação
        cultural.
    E:
      texto: A aprovação da entrada do break nos Jogos Olímpicos foi um equívoco, pois as manifestações
        da cultura do corpo devem ser mantidas em seus espaços originais, de modo que não percam a sua
        essência.
  resposta: B
  anulada: false
  pendencias:
  - 'Índice/expoente em fonte pequena na página 7, y≈795: conferir o texto'
