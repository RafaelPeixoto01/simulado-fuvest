  - texto: |-
      Pessoas havia que julgavam que o viver com moderação e o evitar qualquer superfluidade muito ajudavam para se resistir ao mal.
      Outras pessoas declaravam que, para tão imenso mal, eram remédios eficazes o beber abundantemente, o gozar com intensidade, o divertir-se de todas as maneiras.
      Inúmeras pessoas preferiam o caminho do meio. Usavam todas as coisas, com suficiência e moderação. Vagavam de um lugar a outro.
      Tão grande era o número de mortos que, escasseando os caixões, os cadáveres eram postos em cima de simples tábuas. Não foi um só o caixão a receber dois ou três mortos simultaneamente.
      Giovanni Boccaccio. Decamerão . São Paulo: Abril Cultural, 1970. Adaptado.
      O texto (c. 1350) refere-se à Peste Negra e às suas consequências em Florença no século XIV.
      Acerca dessa epidemia e de seus efeitos, é correto afirmar:
  alternativas:
    A:
