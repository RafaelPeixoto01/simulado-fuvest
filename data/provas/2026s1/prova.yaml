      O filósofo Blaise Pascal apresenta a seguinte reflexão sobre a felicidade:
      “Como a natureza nos torna sempre infelizes em todos os estados, os nossos desejos nos figuram um estado feliz porque juntam ao estado em que estamos os prazeres do estado em que não estamos e, ainda quando chegássemos a esses prazeres, nem por isso seríamos felizes, porque teríamos outros desejos conformes a esse novo estado”.
