  enunciado:
  - texto: No dia 30 de maio de 2020, o foguete “Falcon 9” foi lançado ao espaço levando uma cápsula com
      destino à Estação Espacial Internacional (ISS), que se encontrava em órbita geoestacionária. Em
      menos de 15 minutos após o lançamento, a espaçonave Dragon já se encontrava a quase 200 km de altitude,
      separada do foguete. Porém, teve de seguir orbitando a Terra para ascender à Estação, localizada
      a cerca de 400 km de altitude, conforme figura a seguir.
  - figura: q047-1.webp
  - texto: |-
      Fonte: Nasa.
      O procedimento adotado para o encontro da espaçonave e da Estação Espacial pode ser explicado
  alternativas:
    A:
      texto: pela diferença de momento angular, pois a espaçonave encontrava-se com velocidade maior que
        a da ISS; com a ascensão da espaçonave, as velocidades orbitais igualaram-se, permitindo o acoplamento
        de ambas.
    B:
      texto: pelas condições atmosféricas turbulentas da troposfera, o que obrigou a espaçonave a ascender
        a camadas mais altas da atmosfera, onde as condições de temperatura e pressão seriam mais favoráveis
        ao acoplamento.
    C:
      texto: pelas condições de inércia, pois a ausência de gravidade no vácuo causa incrementos na aceleração
        adquirida durante o lançamento do foguete, fazendo com que a espaçonave ganhe altitude até encontrar
        a ISS.
    D:
      texto: pela maior resistência do ar na camada da atmosfera em que se encontrava a espaçonave, forçando
        sua ascensão a camadas de maior altitude, onde o ar é mais rarefeito e a resistência do ar é menor.
    E:
      texto: pelo torque relacionado à energia rotacional, segundo a qual órbitas menores estão associadas
        a menores acelerações; por isso, a espaçonave teve de ascender para aumentar sua velocidade e
        se encontrar com a ISS.
  resposta: A
  anulada: false
