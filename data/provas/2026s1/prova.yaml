  - texto: O fenômeno da difração constitui uma importante característica do comportamento ondulatório
      da luz. Nesse fenômeno, ondas desviam-se em relação à sua direção de propagação inicial quando encontram
      obstáculos ou atravessam orifícios com aberturas da ordem de seu comprimento de onda. A difração
      é conveniente para estimar distâncias consideradas “pequenas”, em relação às quais os instrumentos
      tradicionais de medição usuais tornam-se imprecisos.
  - figura: q052-1.webp
  - texto: "Disponível em https://commons.wikimedia.org/.\nA figura mostra o padrão de intensidade luminosa
      produzido pela incidência de luz sobre um fio de cabelo, exibindo uma alternância de máximos e mínimos
      de intensidade. No caso de uma detecção distante da fenda, a espessura \U0001D43F do fio de cabelo
      pode ser calculada a partir da largura do máximo central de intensidade, dada por \U0001D466 =2
      \U0001D706\U0001D437 / \U0001D43F , sendo \U0001D706 e \U0001D437 o comprimento de onda da luz incidente
      e a distância entre o fio de cabelo e o anteparo, respectivamente.\nConsidere que luz incida sobre
      um fio de cabelo, de espessura da ordem de 50 \U0001D707 m, e que a imagem seja projetada sobre
      um anteparo a uma distância de 1 m.\nEntre os comprimentos de onda indicados a seguir, qual permitiria
      uma melhor precisão relativa na medida da espessura do fio de cabelo realizada com auxílio de uma
      régua de precisão 1 mm?"
  alternativas:
