      O Retorno do Rei: Queda e Ascensão de Elvis Presley é uma jornada fascinante por trás do icônico especial de retorno de Elvis Presley, que marcou um dos momentos mais decisivos da carreira do lendário cantor. No verão de 1968, Elvis estava em uma encruzilhada. Após uma meteórica ascensão ao estrelato nos anos 1950, dois anos no exército e uma carreira em declínio com filmes de Hollywood sem sucesso, ele estava longe do auge de sua fama.
