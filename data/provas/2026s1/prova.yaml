      Uma pesquisa desenvolvida na Faculdade de Zootecnia e Engenharia de Alimentos da USP mostrou que a suplementação com óleos vegetais na dieta de vacas leiteiras pode alterar o percentual da gordura e a composição do leite por elas produzido, tornando o perfil dos ácidos graxos do leite ainda mais saudável para a alimentação humana.
      Nesse estudo, as vacas foram divididas em 3 grupos:
      - Grupo 1: recebeu alimentação sem suplementação;
      - Grupo 2: recebeu alimentação suplementada com óleo de soja;
      - Grupo 3: recebeu alimentação suplementada com óleo de linhaça.
