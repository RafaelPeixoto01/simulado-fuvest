        e localizam-se em áreas de Terras Pretas de Índio, o que caracteriza a coloração escura exclusiva
        da sub bacia do Rio Negro, diferindo das demais regiões amazônicas.
    B:
      texto: A baixa concentração de SIS e MOD nas águas Claras é resultado dos garimpos ilegais na Amazônia,
        devido à utilização de mercúrio e dos agrotóxicos nos cultivos da soja nas regiões onde há maior
        desmatamento.
    C:
      texto: A classificação intermediária do tipo A tem características hidroquímicas alteradas devido
        ao impacto direto e indireto de mudanças no uso do solo, além de grandes projetos de infraestrutura
        em toda parte norte-oriental da bacia amazônica.
    D:
      texto: As águas intermediárias tipo B, com baixa concentração SIS e MOD, localizadas sobretudo no
        Baixo Amazonas, possuem essas características devido às mudanças no uso do solo nas últimas décadas
        e por ser uma área com muitos igarapés.
    E:
      texto: As águas Brancas, como as do Rio Solimões, com alta concentração de SIS, têm essas características
        hidroquímicas devido aos processos erosivos de regiões a montante, como, por exemplo, as nascentes
        do rio Amazonas na Cordilheira dos Andes.
  resposta: E
