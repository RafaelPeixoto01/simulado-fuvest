  - texto: |-
      Mwando está embasbacado com a descoberta do insólito do mundo. Como o Adão no Paraíso, a voz da serpente sugeriu-lhe a maçã, que lhe arrancou brutalmente a venda de todos os mistérios. Sim, escutou os lábios de uma mulher pronunciando em sussurros o seu nome, despertando-o do ventre fecundo da inocência. Mwando nasceu. Sente o coração a bater com força, mesmo à maneira do primeiro amor.
      (…)
      Procurou o refúgio do quarto e fechou-se. Estava transtornado. Sentia a sua devoção abalada pela paixão. Não conseguia fugir às tramas da serpente, a Sarnau arrastava-o cada vez mais para o abismo.
      Paulina Chiziane. Balada de amor ao vento.
      Considerando a intertextualidade bíblica presente no excerto de Balada de amor ao vento, a experiência de Mwando é caracterizada
  alternativas:
    A:
      texto: por uma decepção com o mundo, causada pela perda da fé e pela compreensão da fragilidade
        das relações humanas, o que o levou a um isolamento resignado.
    B:
      texto: pelo despertar sexual e pelo conhecimento, que rompem com um estado de inocência anterior,
        resultando em uma perturbação emocional e um conflito interior.
    C:
      texto: pela superação de um trauma passado, sendo que a figura da cobra é o símbolo do obstáculo
        que foi vencido e que o conduz a um novo estágio de maturidade e paz.
    D:
      texto: por um processo de profunda introspecção, no qual o amor é um caminho para a autodescoberta
        e transcendência espiritual, apesar das dificuldades iniciais.
    E:
      texto: pela busca por um novo tipo de devoção religiosa, tendo a figura feminina como fonte de inspiração
        que o afasta ainda mais dos preceitos tradicionais e o aproxima de um paraíso utópico.
  resposta: B
