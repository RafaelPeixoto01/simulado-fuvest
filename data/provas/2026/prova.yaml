  - texto: Em 19 de setembro de 2023, o Azerbaijão lançou uma ofensiva contra a autoproclamada República
      de Nagorno-Karabakh (RAHK ou Artsakh), um território povoado por armênios sob bloqueio desde dezembro
      de 2022. Em 28 de setembro de 2023, a RAHK anunciou sua dissolução, que entrou em vigor a partir
      de 1º de janeiro de 2024, após mais de três décadas de existência não reconhecida. Em agosto de
      2025, o governo norte americano propôs que a rota de transporte estratégica turco-azerbaijana seja
      controlada pelos EUA, por 99 anos. Essa proposta ainda está em curso, devido à oposição do Irã.
  - figura: q052-1.webp
  - texto: |-
      Reconfiguração geopolítica do Cáucaso (2023). Atlas Géopolitique Mondial, 2025. Adaptado.
      Com base no texto, na legenda do mapa e em seus conhecimentos, assinale a alternativa que explica os motivos da ofensiva do Azerbaijão contra os armênios.
  alternativas:
    A:
      texto: O território armênio invadido pelo Azerbaijão é estratégico para o comércio de gás e petróleo
        com a Turquia e a União Europeia (UE) e há um projeto estratégico de transporte, no sul do território
        invadido, que permitirá uma rota de petróleo, gás e fluxo comercial.
    B:
      texto: O território no sul da Armênia é de interesse do Irã devido às reservas de hidrocarbonetos,
        causando vários conflitos com o Azerbaijão, que, ao defender a Armênia, cria enclaves de proteção
        territorial, resguardando as rotas comerciais até Ierevan, a capital da Armênia.
    C:
      texto: As bases militares de vários países estão concentradas no território armênio, que é disputado
        pela Turquia, Estados Unidos da América e Rússia, sendo este último interessado na rota Nagorno-Karabakh,
        por ser estratégica ao escoamento de sua produção de gás e petróleo para a UE.
    D:
      texto: O conflito entre Armênia e Azerbaijão força a Turquia a ter neutralidade e, ao mesmo tempo,
        permite o funcionamento dos gasodutos (TANAP) e oleodutos (BTC), a partir do controle que ela
        tem das rotas, dos pontos de passagem fechados e das bases militares.
    E:
      texto: No conflito entre Armênia e Azerbaijão, o corredor de transporte estratégico ao sul do Azerbaijão,
        associando a ferrovia, escoa toda a sua produção de petróleo, gás e fluxo comercial, conectando
        o território de Nagorno-Karabakh à Turquia e à área ocupada pela Armênia.
  resposta: A
