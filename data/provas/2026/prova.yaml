      O produto conhecido como descalcificante, comumente composto por ácido cítrico, é usado para desentupir os dutos internos de eletrodomésticos como cafeteiras e ferros de passar roupa a vapor. O entupimento frequentemente é causado pelo depósito de calcário (CaCO₃), produto da reação entre CO₂ e íons cálcio presentes na água. O equilíbrio de formação do carbonato de cálcio está representado a seguir:
      Ca²⁺(aq) + CO₂(g) + H₂O(l) ⇌ CaCO₃(s) + 2H⁺(aq).
      Sobre os processos de entupimento por carbonato de cálcio e a descalcificação desses eletrodomésticos, é correto afirmar que
  alternativas:
    A:
      texto: a diminuição do pH pela presença do ácido cítrico leva à reação de descalcificação.
    B:
      texto: a reação de descalcificação com ácido cítrico desloca o equilíbrio porque consome CO₂.
    C:
      texto: ambientes ricos em CO₂ causam menos entupimento dos eletrodomésticos.
    D:
      texto: a utilização de água com maior pH nos eletrodomésticos causa menos entupimento.
    E:
      texto: o ácido cítrico age como um catalisador, pois não participa do equilíbrio de descalcificação.
  resposta: A
  anulada: false
