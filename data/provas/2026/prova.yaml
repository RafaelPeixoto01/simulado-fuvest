- numero: 86
  disciplina: biologia
  assunto: zoologia
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      A rega e o zelo geraram uma infinidade de seres que descobria nos dedos ao mexer na terra: minhocas, besouros verdes, bichos-de-conta.
      Djaimilia Pereira de Almeida. A visão das plantas.
      Na obra A visão das plantas (2021) são descritas características dos animais e das plantas no jardim cuidado por Celestino. Nesta frase, são citados animais que pertencem a diferentes grupos de invertebrados, como as minhocas (anelídeos), os besouros (insetos) e os bichos-de-conta (crustáceos), também conhecidos como tatuzinhos de jardim. Assinale a alternativa que apresenta corretamente a informação sobre o sistema respiratório destes grupos.
  alternativas:
    A:
      texto: Os besouros e os bichos-de-conta apresentam respiração traqueal, sendo a umidade do solo
        importante em ambos os casos.
    B:
      texto: As minhocas apresentam respiração cutânea e os besouros apresentam respiração traqueal, sendo
        a umidade do solo importante em ambos os casos.
    C:
      texto: Os besouros apresentam respiração traqueal e os bichos-de-conta apresentam respiração pulmonar,
        e a umidade do solo não é importante na respiração destes animais.
    D:
      texto: As minhocas, os besouros e os bichos-de-conta apresentam respiração branquial, sendo a umidade
        do solo importante na respiração dos três animais.
    E:
      texto: As minhocas, os besouros e os bichos-de-conta apresentam respiração pulmonar, e a umidade
        do solo não é importante na respiração dos três animais.
  resposta: B
  anulada: false
  pendencias: []
- numero: 87
  disciplina: portugues
  assunto: leituras-obrigatorias
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      As plantas viam o jardineiro como as plantas vêem. Não se sentiam agradecidas. Tratavam o seu regador à semelhança da chuva que caía sobre elas nas noites de Outono. Florescerem não era o seu meio de meterem conversa com o jardineiro, mas uma forma de acentuarem a sua indiferença à declaração de amor que ele cultivava a cada hora.
      Tanto lhes fazia serem cuidadas por um assassino, se eram sujas as mãos que as amparavam ou o que viera antes do amor que ele lhes dedicava.
      Seguiam-no com o seu olhar sem julgamento, alheias a que, todas as manhãs, Celestino acordava por elas. Vigiavam os seus passos, pressentiam a sua presença, alegravam-se de o ver, conheciam as suas rotinas. Sem que por um instante lhe sentissem a falta, ou se afligissem com as suas ausências ocasionais.
      Djaimilia Pereira de Almeida. A visão das plantas.
      Considerando o trecho citado, depreende-se que o “olhar sem julgamento”
  alternativas:
    A:
      texto: expressa a piedade do jardim diante da condição de Celestino, que se encontra próximo da
        morte.
    B:
      texto: expressa o terror das plantas por serem cuidadas por um criminoso que carrega atos extremos
        de violência praticados em seu passado.
    C:
      texto: evidencia que a natureza está alheia às ações e sentimentos humanos, existindo à revelia
        da humanidade.
    D:
      texto: é a retribuição ao cuidado cotidiano que as plantas recebem, reconhecendo que Celestino se
        redimiu de seu passado.
    E:
      texto: evidencia a integração do jardineiro com o jardim, na medida em que dependem naturalmente
        um do outro para sobreviverem.
  resposta: C
  anulada: false
  pendencias: []
- numero: 88
  disciplina: historia
  assunto: brasil-imperio
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      Entre 1810 e 1850 os debates acalorados giraram em torno do fim do tráfico internacional, da sua legislação, da sua repressão, num impressionante vaivém, ou na famosa expressão: “Para inglês ver”. Até que o comércio internacional de almas fosse extinto em 1850, e na verdade alguns anos depois, muita pressão externa foi necessária. O fim do tráfico não significou a abolição da escravidão, que ainda permaneceria forte por quase quarenta anos.
      Lilia M. Schwarcz e Flávio Gomes. “Apresentação”. In: Dicionário da escravidão e liberdade. São Paulo: Companhia das Letras, 2018. Adaptado.
      De acordo com o excerto, é correto afirmar:
  alternativas:
    A:
      texto: O fim do tráfico internacional de escravizados em 1850 implicou a substituição da mão de
        obra africana pela indígena.
    B:
      texto: Os importadores de escravizados foram duramente prejudicados com a promulgação da lei Feijó
        de 1831.
    C:
      texto: Os debates parlamentares entre os anos 1810 e 1850 defendiam formas de indenização aos proprietários.
    D:
      texto: O fim do tráfico internacional após 1850 favoreceu o tráfico interprovincial.
    E:
      texto: Os apelos internacionais pela abolição do tráfico revelavam os interesses de imigrantes europeus.
  resposta: D
  anulada: false
  pendencias: []
- numero: 89
  disciplina: portugues
  assunto: leituras-obrigatorias
  disciplinas_secundarias:
  - historia
  texto_base: null
  enunciado:
  - texto: |-
      A família de Neide fazia questão de conservar o pomposo sobrenome, “Paranhos”, herdado dos tempos da escravatura. A manutenção do nome dos descendentes dos antigos colonizadores, cuja família era tradicional na cidade, para o clã descendente de africanos escravizados, ganhara um sentido de enfrentamento aos brancos “Paranhos”. Para além de ser um destino histórico, era uma velada reivindicação de uma fortuna familiar dos brancos, que em grande parte era de pertença dos negros “Paranhos”.
      Conceição Evaristo. Canção para ninar menino grande.
      No excerto, o uso do mesmo nome por uma família branca e uma família negra indica
  alternativas:
    A:
      texto: a ascensão social dos “Paranhos” negros após o fim da escravidão, alcançada por meio dos
        programas governamentais de ajuda a ex-escravizados, e a decadência dos “Paranhos” brancos trazida
        pela crise do café.
    B:
      texto: o racismo expresso nas ações e decisões das instituições políticas monárquicas, provenientes
        do período colonial, e a manutenção da dominação socioeconômica dos “Paranhos” negros pelos “Paranhos”
        brancos.
    C:
      texto: a persistência de um vínculo desigual entre as famílias, oriundo do período da escravidão,
        e um esforço dos “Paranhos” negros de afirmar sua participação no enriquecimento dos “Paranhos”
        brancos.
    D:
      texto: o esforço de construção de uma ordem social harmoniosa, desenvolvida durante a Primeira República,
        e a persistência de ressentimentos e rivalidades pessoais entre os “Paranhos” brancos e os “Paranhos”
        negros.
    E:
      texto: a dependência financeira dos “Paranhos” negros em relação aos “Paranhos” brancos, provocada
        por sua condição de escravizados, e a valorização da mistura racial como característica de formação
        do povo brasileiro.
  resposta: C
  anulada: false
  pendencias: []
- numero: 90
  disciplina: portugues
  assunto: leituras-obrigatorias
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      Quando no dia seguinte, também no final da tarde, Fio Jasmim se dirigiu para a pequena joalheria, ele pensou em ser mais cuidadoso ao pronunciar qualquer nome de mulher perto de Dolores dos Santos. Quando contou o incidente para os companheiros maquinistas, os mais velhos riram dele e perguntaram qual o motivo de ele estar tão preocupado com a pequena distração cometida. Nem ele sabia bem o porquê. Entretanto, não gostava de pronunciar o nome da esposa para outras mulheres. A de casa é santa, pensava ele. Se ele tivesse dito pelo menos Juventina, seria mais fácil explicar. Assustado com o próprio pensamento, Fio Jasmim não entendia o que estava se passando com ele. Estaria por acaso pensando em alguma conquista? Ouvira dizer que ela era uma mulher namoradeira, mas que não parava com homem algum, tinha um gênio indomável. Todas essas considerações não lhe importavam, não estava interessado na mulher. Mas e se ela estivesse interessada nele...
      Conceição Evaristo. Canção para ninar menino grande.
      No romance de Conceição Evaristo, Fio Jasmim, por meio de suas viagens, é o elo que agrega as várias personagens femininas que se relacionam com ele. De acordo com essa consideração, Fio Jasmim
  alternativas:
    A:
      texto: atende a uma forma de masculinidade que rompe com os estereótipos, expressando uma identidade
        inovadora e desvinculada das expectativas sociais.
    B:
      texto: relaciona-se com as personagens femininas de maneira igualitária e com respeito mútuo, que
        não correspondem às dinâmicas de poder desiguais.
    C:
      texto: reproduz uma masculinidade estereotipada por meio de atitudes que, em larga medida, atendem
        às expectativas sociais e culturais, reproduzindo estereótipos do gênero.
    D:
      texto: resiste a expectativas internas e externas, o que subverte um esperado comportamento masculino.
    E:
      texto: sente culpa e arrependimento por seu comportamento com mulheres, apesar de reforçar ideais
        de virilidade e dominação do estereótipo da masculinidade.
  resposta: C
  anulada: false
  pendencias: []
