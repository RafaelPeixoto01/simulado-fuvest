      texto: substituir o ambiente degradado e nocivo dos cortiços e vilas operárias por espaços públicos
        marcados pela flora da Mata Atlântica.
    B:
      texto: disciplinar o lazer das crianças com a introdução de noções de saúde preventiva e de atividades
        racionais e pedagógicas.
    C:
      texto: produzir formas de ajustamento social que afastassem os jovens do ócio e dos vícios, por
        meio da educação profissionalizante.
    D:
