  - texto: |-
      Os espetáculos circenses organizados ao final do século XVIII uniam o cômico e o dramático, como historicamente já faziam outras formas de espetáculo, por meio da combinação da atuação das famílias de saltimbancos, ciganos, atores da Commedia dell’Arte, e mesclavam a pantomima e o palhaço com a acrobacia, os equilíbrios, as exibições equestres e a doma de animais em um mesmo espaço. Desde aquele momento, fica visível a emergência não somente de novos modelos de espetáculos, mas também novas estruturas de organização e produção desses espetáculos, caracterizadas pela delimitação do espaço físico das apresentações, cobrança compulsória de entradas e alternância entre exibições de equilibristas, acrobatas, artistas equestres, comediantes, pantomimas e representações diversas, ou seja, um espetáculo pautado na íntima mistura de expressões e artistas originários de diferentes espaços e formações.
      LOPES, Daniel de Carvalho; SILVA, Ermínia. Circo: percursos de uma arte em transformação contínua. Cadernos do GIPE-CIT, v. 1, 2020. Adaptado.
      No contexto histórico, o circo
  alternativas:
    A:
      texto: bem como outras expressões artísticas, interage e se apropria, continuamente, de elementos
        estéticos, sociais, culturais, políticos e tecnológicos da época e da sociedade em que se apresenta,
        revelando, assim, sua contemporaneidade.
    B:
      texto: é constituído pelas interações que estabelece com os variados elementos que o compõem, e
        o local de sua manifestação é similar e perene às realizações espetaculares dos séculos anteriores.
    C:
      texto: presente no Brasil a partir do início do século XX promove uma ruptura do circo tradicional
        e início do circo novo que não se constitui com elementos antes explorados.
    D:
      texto: moderno descaracteriza o modelo encontrado nos séculos XVII e XVIII e faz emergir uma nova
        expressão artística que ainda há de se configurar por um novo nome, diferente de circo.
    E:
      texto: tradicional não tinha como principal característica divertir os espectadores, haja vista
        a veiculação de artistas com corpos ditos grotescos nos espetáculos; nos dias atuais reconhece-se
        a mudança de objetivo que traz no circo a clara representação de entretenimento e diversão a partir
        de corpos virtuosos.
  resposta: A
  anulada: false
