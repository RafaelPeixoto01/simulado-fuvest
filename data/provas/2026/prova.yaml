  - texto: |-
      A espectrometria de massas, utilizada para a identificação das proteínas no estudo apresentado no texto, é uma técnica que permite determinar com precisão a massa molecular de moléculas carregadas. A determinação da massa exata da molécula é feita a partir do conhecimento da sua carga e da razão massa/carga (m/z), parâmetro que influencia no movimento das espécies, permitindo sua determinação. Caso a carga das moléculas seja unitária, a razão m/z é numericamente igual à massa da espécie a ser identificada. Caso a carga seja 2, a razão m/z detectada é metade da massa da molécula.
      A imagem a seguir representa, na forma de um gráfico, o resultado de uma análise por espectrometria de massas de uma amostra pura contendo apenas uma espécie intacta com fórmula molecular [C₄₄H₆₉NO₁₂Ca]²⁺ e massa exata, considerando os isótopos mais abundantes, de 843,444 g/mol, detectada como m/z 421,722.
  - figura: q067-1.webp
  - texto: A presença de outros sinais além do sinal de m/z 421,722, mesmo em uma amostra pura não contendo
      nenhuma outra espécie além do [C₄₄H₆₉NO₁₂Ca]²⁺, deve-se
  alternativas:
    A:
      texto: à presença de outros isótopos menos abundantes e mais pesados de átomos presentes na molécula.
    B:
      texto: às espécies com cargas unitárias que possuem massa maior.
    C:
      texto: à presença de outros isótopos mais abundantes e mais pesados de átomos presentes na molécula.
    D:
      texto: à carga do cálcio, que faz com que a espécie detectada tenha mais de uma massa molecular.
    E:
      texto: à presença de outros isótopos menos abundantes e mais leves de átomos presentes na molécula.
  resposta: A
  anulada: false
  pendencias: []
