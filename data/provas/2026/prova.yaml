  - texto: |-
      Em regiões montanhosas e com clima tropical, é comum a ocorrência de movimentações de massa associados a volumes elevados de chuva. Pelos seus efeitos destrutivos, principalmente em áreas ocupadas de forma irregular, tornam-se foco de estudos de identificação, caracterização, monitoramento e prevenção. Observe a seguir um exemplo de sistema de monitoramento:
      Sistema de monitoramento de corrida de detritos
  - figura: q035-1.webp
  - texto: |-
      Sensores – Função
      Pluviômetro – Medir as precipitações
      Geofones – Medir as vibrações no solo
      Sonar de volume – Medir o nível dos rios
      Cabo sensor – Registrar a passagem de detritos
      Sensor de impacto – Registrar a força da corrida de detritos
      Corridas de Detritos no Brasil, FEBRAGEO. 2022. Adaptado.
      Sobre o motivo da localização dos sensores, assinale a alternativa correta:
  alternativas:
    A:
      texto: O sensor de impacto instalado próximo à estrada e no setor mais elevado do terreno permite
        detectar a passagem de folhas, troncos e matacões.
    B:
      texto: O monitoramento na área de fundo de vale é necessário para medição do volume e velocidade
        da corrida de detritos, com o intuito da prevenção de riscos.
    C:
      texto: O pluviômetro instalado na porção menos elevada do terreno é suficiente para emissão de alerta
        de risco para a população residente no local.
    D:
      texto: O sonar de volume instalado próximo às residências e na parte elevada do terreno ajuda a
        detectar a velocidade com a qual os detritos atingem os objetos.
    E:
      texto: A correlação entre cabo sensor e geofones instalados nas porções média e inferior da drenagem
        permite detectar a composição da corrida de detritos.
  resposta: B
