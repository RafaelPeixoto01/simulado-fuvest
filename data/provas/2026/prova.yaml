- numero: 61
  disciplina: fisica
  assunto: fisica-moderna
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: "Em 1905, Albert Einstein propôs que a luz, um tipo de radiação eletromagnética, é composta
      por fótons, sendo que cada fóton tem energia proporcional à frequência da luz (\U0001D453) e à constante
      de Planck (ℎ). Nesses termos, \U0001D438 = ℎ\U0001D453, e a intensidade da luz é a medida da quantidade
      de fótons. Essa interpretação foi fundamental para o desenvolvimento da teoria quântica da luz e
      para explicar o efeito fotoelétrico. Esse efeito consiste em um fenômeno físico no qual elétrons
      são ejetados de um material, geralmente um metal, quando este é irradiado com luz cujos fótons têm
      energia maior que a energia de ligação do elétron ao material, também conhecida como função trabalho.
      Assim, quando o fóton incide sobre a superfície do material, a energia excedente transforma-se na
      energia cinética do elétron que escapa da superfície.\nEm qual das situações a seguir a energia
      cinética do elétron ejetado no efeito fotoelétrico aumenta?"
  alternativas:
    A:
      texto: Aumentando a intensidade da luz incidente.
    B:
      texto: Usando uma superfície maior.
    C:
      texto: Aumentando a frequência da luz incidente.
    D:
      texto: Usando um material com função trabalho maior.
    E:
      texto: Diminuindo a energia do fóton incidente.
  resposta: C
  anulada: false
  pendencias: []
