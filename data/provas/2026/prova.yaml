  - texto: Em abril de 2025, uma empresa de biotecnologia anunciou que havia criado lobos com características
      de lobos-gigantes, ou dire-wolves, uma espécie extinta há milhares de anos. Para isso, a empresa
      obteve o genoma de lobos-gigantes e o comparou com o genoma de lobos modernos. Com base nesta comparação,
      foram feitas 20 modificações em 14 genes do genoma do lobo moderno, utilizando tecnologias de edição
      gênica. Em seguida, o núcleo de uma célula de lobo moderno contendo o DNA editado foi inserido em
      óvulos anucleados de cachorras. Por fim, os óvulos foram inseminados em cachorras, possibilitando
      a gestação. O resultado foi o nascimento de três filhotes, dois machos e uma fêmea, que possuem
      pelagem branca e espessa, além de um tamanho corporal maior, lembrando o fenótipo esperado de um
      lobo-gigante.
