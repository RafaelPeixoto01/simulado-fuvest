- numero: 81
  disciplina: quimica
  assunto: ligacoes
  disciplinas_secundarias: []
  texto_base: tb08
  enunciado:
  - texto: O processo de comunicação entre plantas discutido no texto pode ocorrer de diversas formas.
      Uma delas baseia-se na emissão de moléculas por uma planta atacada, chamada de emissor, e a recepção
      dessas moléculas por uma outra planta, chamada de receptor. Dependendo do tipo de ataque e das espécies
      envolvidas, essa comunicação pode acontecer tanto por via aérea, quanto por via do solo, facilitada
      pela água presente.
  - figura: q081-1.webp
  - texto: 'Considerando os processos de sinalização entre plantas descritos, é correto afirmar:'
  alternativas:
    A:
      texto: Na via aérea, os compostos gerados pelo emissor podem ser polares para que possuam uma volatilidade
        elevada.
    B:
      texto: Na comunicação pelo solo, as moléculas devem ser necessariamente apolares, para que possam
        ser solubilizadas no meio, atingindo o receptor.
    C:
      texto: As moléculas transportadas por via aérea seriam facilmente solubilizadas no solo por conta
        da sua baixa polaridade.
    D:
      texto: As moléculas polares geradas pelas folhas são facilmente transportadas pelo solo por conta
        de suas relativas baixas solubilidades.
    E:
      texto: As moléculas responsáveis pela comunicação por via aérea devem possuir alta volatilidade
        e baixa polaridade.
  resposta: E
  anulada: false
  pendencias: []
