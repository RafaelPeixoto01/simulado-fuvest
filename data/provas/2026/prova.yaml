  enunciado:
  - texto: |-
      O carnaval, para além de ser a mais importante manifestação cultural brasileira, é o exercício concreto e sensível de vários direitos conquistados e consagrados. Ele celebra o direito à cidade, à manifestação, à associação e o direito à liberdade de expressão. Como festa pagã e sincrética, afirma o direito à liberdade religiosa sem ser proselitista e, como representação cultural, amplia o espaço cívico para combiná-lo com festividade, criatividade e liberdade artística e cultural.
      O carnaval, nas suas diversas facetas, é político. E essa característica não aparece somente nos debates promovidos através da festa, mas também pela possibilidade de desfrutar uma vida livre de censura de qualquer tipo por parte de pessoas de todas as regiões do país, em suas mais distintas realidades. Ocupar as ruas é um ato político. O lazer e a folia em espaço público, o exercício do direito à fruição e de produzir e consumir conteúdos culturais diversos também são. É ainda mais relevante o ato de externalizar e amplificar histórias, memórias e narrativas sobre grupos historicamente silenciados no país, como as populações negra, indígena e de tantas outras comunidades tradicionais. A manifestação política através de brincadeiras, danças, marchinhas, cantos e fantasias é das formas mais sublimes de expressão da aliança entre luta social, cultura e expressão estética. É a possibilidade que brasileiras e brasileiros encontram de, lutando por meio da arte, fazer ecoar uma voz esquecida no cotidiano.
      Artigo 19. 16/02/2024. Adaptado.
      Ao afirmar que o carnaval é político, o texto objetiva
  alternativas:
    A:
      texto: ressaltar a necessidade da festa popular para que brasileiros e brasileiras possam ter algum
        momento de lazer.
    B:
      texto: valorizar a ocupação do espaço público, resistindo contra aqueles que não são favoráveis
        à folia e ao consumo.
    C:
      texto: criticar os vários direitos adquiridos pelas classes mais silenciadas da sociedade em sua
        luta social e cultural.
    D:
      texto: defender posicionamentos e direitos por meio de formas de expressão culturais e artísticas.
    E:
      texto: refletir, do ponto de vista sócio-histórico, sobre o consumo, que acentua as diferenças culturais
        e religiosas.
  resposta: D
  anulada: false
  pendencias: []
