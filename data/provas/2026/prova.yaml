  - texto: Aristóteles produziu aquela que é considerada a primeira classificação dos organismos vivos,
      no mundo ocidental. Nela, considerou principalmente a existência de características compartilhadas
      para dividir os seres vivos em distintas categorias. Atualmente, a classificação dos seres vivos
      pauta-se no paradigma da Escola Filogenética (cladística). Tal escola
  alternativas:
    A:
      texto: também realiza a análise de características compartilhadas entre os diferentes grupos de
        organismos, buscando identificar ancestrais comuns e relações de parentesco entre eles.
    B:
      texto: busca as diferenças entre os grupos de seres vivos, agrupando-os exclusivamente com base
        nessas diferenças, desconsiderando características compartilhadas.
    C:
