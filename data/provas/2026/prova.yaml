  conteudo:
  - texto: 'Quem viajou de avião já ouviu o famoso aviso: “Em caso de despressurização da cabine, máscaras
      de oxigênio cairão automaticamente acima do seu assento. Puxe uma das máscaras, coloque-a sobre
      o nariz e a boca e respire normalmente (...)”. Porém, ao invés de aviões conterem cilindros de oxigênio
      que alimentam as máscaras, esse gás é gerado por meio de uma reação química. No compartimento sobre
      cada passageiro encontra-se um reservatório contendo um sal como o clorato de sódio (NaCℓO₃) que,
      ao se decompor, produz oxigênio (O₂), cloreto de sódio (NaCℓ) e calor. O clorato de sódio é estável
      em temperatura ambiente, e sua decomposição só se inicia quando o passageiro puxa a máscara, o que
      dispara um gatilho que gera calor suficiente para iniciar a reação que, então, se mantém autossuficiente
      até consumo total do reagente.'
