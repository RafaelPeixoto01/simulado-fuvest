  - texto: 'Em março de 2025, postagens em redes sociais digitais discutiram uma tendência verificada
      entre crianças e adolescentes de utilizar o termo “CLT” como uma ofensa. Na matéria “''Crianças
      demonizam CLT'': carteira assinada vira ofensa entre os jovens”, de Camila Corsini para o UOL, há
      vários depoimentos em que crianças associam o emprego com CLT a menores rendimentos, à pobreza e
      ao fracasso profissional, em oposição a ocupações autônomas ou por conta própria, que seriam caminhos
      para a riqueza. Veja os gráficos com as estimativas da Pesquisa Nacional por Amostra de Domicílios
      Contínua (PNAD-C) do IBGE para a distribuição da ocupação por categoria e o rendimento médio mensal
      real habitual das pessoas para o trimestre compreendido entre dezembro de 2024 e fevereiro de 2025:'
