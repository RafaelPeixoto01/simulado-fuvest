  texto_base: null
  enunciado:
  - texto: 'A jornada das mulheres pela igualdade de direitos no Brasil, como em outras partes do mundo,
      sempre envolveu lutas sociais, políticas e jurídicas, com marcos importantes como a Lei Geral de
      1827, que permitiu o acesso das mulheres à educação, e a Constituição de 1934, que garantiu o direito
      ao voto feminino. A partir da década de 1960, houve avanços significativos, como o Estatuto da Mulher
      Casada (1962), que eliminou a necessidade de receber autorização do marido para diversas atividades,
      e, na década de 1970, a Lei do Divórcio (1977) e o fortalecimento dos movimentos feministas. As
      obras Caminho de pedras, de Rachel de Queiroz, e As meninas, de Lygia Fagundes Telles, discutem
      questões relativas aos direitos das mulheres e sua relação com a política ao longo do século XX
      no Brasil. Sobre esses romances, é correto afirmar:'
  alternativas:
    A:
      texto: Em Caminho de pedras, Rachel de Queiroz relaciona a luta pelos direitos da mulher à legalização
        do divórcio no Brasil, enquanto As meninas constitui um libelo pela educação feminina no período
        final da Era Vargas.
    B:
      texto: As personagens Angelita, de Caminho de pedras, e Ana Clara, de As meninas, impactam a vida
        dos protagonistas de seus romances e representam a transformação da condição social das mulheres
        ao romperem com a configuração familiar tradicional.
    C:
      texto: Em Caminho de pedras e em As meninas, a política (militância de esquerda) e a religião (internato
        de freiras) são instituições que, em vez de contribuírem para a revisão de valores morais e para
        a emancipação feminina, aprofundam os mecanismos de controle social sobre as mulheres.
    D:
      texto: Tanto Caminho de pedras quanto As meninas relacionam o exercício da política coletiva (militância
        de esquerda, luta contra a ditadura militar) à política exercida em nível da vida privada e do
        cotidiano, por meio da trajetória de personagens femininas que desafiam padrões sociais estabelecidos.
    E:
      texto: Tanto Caminho de pedras quanto As meninas exercem uma crítica à chamada “mulher burguesa”.
        O romance de Rachel de Queiroz narra os desdobramentos do desejo de ascensão social de Noemi,
        enquanto o de Lygia Fagundes Telles detalha o apego de Lorena à instituição do casamento.
  resposta: D
  anulada: false
  pendencias: []
