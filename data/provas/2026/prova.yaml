      Em uma eleição para um conselho composto por 5 membros, existem 7 candidatos inscritos e um total de 35 eleitores. São eleitos os 5 candidatos com mais votos, sendo o critério de desempate a idade, isto é, se houver uma só vaga para dois candidatos que empataram em número de votos, o candidato mais velho é eleito e o mais novo, não. Aleph, que é o mais novo dentre todos os candidatos, está analisando quantos votos precisa para garantir sua eleição.
      Sabendo que cada eleitor tem direito a votar em somente um candidato e que, geralmente, nessas eleições, um ou dois dos eleitores não comparecem para votar, pode-se afirmar:
  alternativas:
    A:
      texto: Se um ou dois eleitores não comparecerem, Aleph será eleito se tiver pelo menos 5 votos.
    B:
      texto: Aleph não será eleito com 5 votos, mesmo que um ou dois eleitores não compareçam.
    C:
      texto: Caso dois eleitores não compareçam, Aleph precisará receber 5 votos para se eleger. Mas,
        se apenas um eleitor não comparecer, 5 votos não garantem sua eleição.
    D:
      texto: Na hipótese de dois eleitores não comparecerem, Aleph precisa que um dos eleitos tenha recebido
        6 ou mais votos para que ele consiga se eleger com apenas 4 votos.
    E:
      texto: Na hipótese de apenas um dos eleitores não comparecer, Aleph precisa que dois dos eleitos
        tenham recebido 6 ou mais votos para que ele consiga se eleger com apenas 4 votos.
  resposta: null
