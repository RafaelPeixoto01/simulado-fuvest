  texto_base: null
  enunciado:
  - texto: 'Em meados do século XIX, Nísia Floresta publicou no Brasil seu Opúsculo Humanitário, uma ardente
      defesa da educação como meio para eliminar os obstáculos que impediam as mulheres de contribuir,
      em condições de igualdade com os homens, com a sociedade brasileira. Para tanto, contrapõe o estado
      da educação das mulheres nas nações ditas civilizadas e cultas ao péssimo estado da educação, pública
      e privada, religiosa e laica no Brasil, assumindo que a educação é uma expressão do grau de civilização
      das nações e muito influente sobre sua moralidade. Meio século mais tarde, Émile Durkheim dedicou
      duas obras à educação escolar: Educação e Sociologia e A Educação Moral. Nelas, o sociólogo francês
      concebe a escola como um espaço de transmissão da civilização às novas gerações por meio da sua
      socialização nos sentimentos, ideias e valores da sociedade, além da promoção da solidariedade com
      as múltiplas sociedades das quais participamos e com a humanidade como um todo. Ao funcionar como
      uma forma de vinculação às normas sociais por meio de uma compreensão racional da moralidade que
      subjaz a esses sentimentos, ideias e valores, a escola seria também um espaço de produção de autonomia.
      Mas, para que assim seja, esses sentimentos, ideias e valores deveriam ser justificáveis exclusivamente
      pela razão, sem invocar princípios religiosos, que são exclusivistas. É correto afirmar que em seus
      escritos sobre educação, Durkheim e Floresta convergem ao'
  alternativas:
    A:
      texto: reafirmar a importância dos valores religiosos da sociedade na educação como um projeto moralizante,
        ainda que critiquem a educação católica.
    B:
      texto: conceber a educação das mulheres como manifestação de uma lei necessária do progresso das
        nações, expressão do positivismo dos autores.
    C:
      texto: indicar a função da escola de integrar seus estudantes às normas e valores morais característicos
        de uma sociedade para permitir que com ela contribuam.
    D:
      texto: justificar uma educação escolar segregada de grupos menos integrados socialmente, como as
        mulheres, em virtude de normas e valores da sociedade.
    E:
      texto: defender uma educação com caráter cívico e nacionalista, que afirme a superioridade da nação
        e promova as glórias da civilização nacional.
  resposta: C
  anulada: false
  pendencias: []
- numero: 10
  disciplina: portugues
  assunto: textos-multimodais
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - figura: q010-1.webp
  - texto: |-
      Capoeira, Maria Auxiliadora da Silva, técnica mista sobre tela, 69,5 x 75 x 1,5 cm, 1970. Acervo MASP.
      “Maria Auxiliadora nasceu em 24 de maio de 1935, em Campo Belo, MG, numa família de 18 irmãos, gerados por Dona Maria, uma humilde bordadora, que acumulava ainda as funções de dona-de-casa, escultora e pintora. (...) Auxiliadora, ainda criança, mostra uma inclinação natural para tingir os fios que a mãe borda para fora e, com 11 anos, já desenhava, com carvão, figuras nos muros. Absorta nessa atividade, esquecia muitas vezes de olhar as panelas no fogo, e a comida da família queimava. (...) Sem conhecer perspectiva ou claro-escuro, bem dentro dos princípios dos artistas autodidatas, Auxiliadora foi aprimorando sua arte. No fim dos anos 1960, juntou-se, com outros integrantes da família, como o escultor Vicente de Paula e o pintor João Cândido, ao grupo que girava em torno do músico, teatrólogo e poeta negro Solano Trindade, no Embu das Artes, SP, onde se formara um centro de artesanato, principalmente de cultura e arte de origem africana.”
      D'AMBROZIO, Oscar. Maria Auxiliadora. Um cometa das artes. Adaptado.
      A trajetória da artista autodidata Maria Auxiliadora da Silva desafia as estruturas convencionais do sistema de artes visuais no Brasil ao articular, em sua obra e atuação, experiências de pertencimento, identidade e resistência. Em crítica publicada no livro “Pensando a Arte”, Mário Schenberg descreve sua produção como marcada pela "vivência autêntica da vida popular", "senso mágico afro-brasileiro" e uma "imaginação construtora de arquiteturas cromáticas e lineares". Considerando a obra “Capoeira”, os comentários de Schenberg, o texto de Oscar D’Ambrozio e os debates contemporâneos sobre arte e decolonialidade, é correto afirmar:
  alternativas:
    A:
      texto: A obra de Maria Auxiliadora é classificada como "naïf" ou "primitivista" por apresentar um
        vocabulário visual simples e espontâneo, característico de artistas sem formação acadêmica, o
        que justifica sua exclusão dos grandes circuitos institucionais da arte contemporânea.
    B:
      texto: A produção de Maria Auxiliadora deve ser compreendida como uma manifestação isolada, desprovida
        de intencionalidade crítica ou diálogo com os debates socioculturais e políticos do seu tempo,
        reforçando o lugar da arte popular como expressão puramente intuitiva.
    C:
      texto: A visibilidade póstuma de Maria Auxiliadora nos museus e exposições de arte brasileira evidencia
        o reconhecimento institucional imediato e contínuo de artistas racializados e periféricos no país,
        fruto da tradição inclusiva das artes visuais brasileiras desde o século XX.
    D:
      texto: A categorização da obra de Maria Auxiliadora como “primitivista” ou “ingênua” revela, muitas
        vezes, uma perspectiva colonizadora que desconsidera a complexidade estética, a intencionalidade
        política e a potência simbólica de sua produção, ligada a vivências negras, femininas e periféricas
        que tensionam o cânone eurocentrado da arte.
    E:
      texto: A valorização da obra de Maria Auxiliadora por críticos como Mário Schenberg atesta a neutralidade
        das categorias da crítica de arte moderna no Brasil, demonstrando que critérios estéticos sempre
        foram suficientes para reconhecer artistas não brancos e mulheres no campo artístico.
  resposta: D
  anulada: false
  pendencias: []
- numero: 11
  disciplina: portugues
  assunto: leituras-obrigatorias
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      Sempre que brilha um novo dia, e que nos bate à porta o jornal, apoderamo-nos com solicitude dessa folha e avidamente percorremos a sessão das Câmaras do dia antecedente em procura do assunto que temos escrito no coração e no espírito - a educação da mulher brasileira -, e dobramos a folha desconsolados e aguardamos o dia seguinte, que se escoa na mesma expectativa, no mesmo desengano!
      (...)
      Um dia raiará mais propício para nós, em que os escolhidos da nação brasileira se dignem de achar a educação da mulher um objeto importante para dele ocuparem-se, com a circunspecção que merece.
      Nísia Floresta. Opúsculo Humanitário.
      Sonhando ser mestra, eu não imaginava o descanso, o repouso ameno que daria à minha mãe como recompensa dos grandes sacrifícios feitos por ela para meu bem-estar, eu não pensava em ser útil, em tornar-me necessária, imprescindível. Eu queria ser mestra para não morar em um cortiço mal-alumiado, infecto, úmido, nesta terra onde há tantas flores, tanta luz e tantas alegrias. O caso é que fosse qual fosse a mão que me escreveu no pensamento a resolução de vir a ser professora – pertencesse ela à tentação diabólica do luxo ou à compreensão de um dever –, fosse qual fosse, eu a abençoo.
      Julia Lopes de Almeida. Memórias de Martha.
      A partir da leitura dos excertos e das obras citadas, é correto afirmar:
  alternativas:
    A:
      texto: Opúsculo Humanitário e Memórias de Martha são obras que defendem fortemente o abolicionismo
        e o acesso à educação pela população afrodescendente brasileira.
    B:
      texto: Opúsculo Humanitário defende a modernização da política brasileira, e Memórias de Martha
        narra a ascensão social da protagonista por meio da sua profissionalização.
    C:
      texto: Opúsculo Humanitário e Memórias de Martha, obras seminais do feminismo no Brasil, defendem
        a educação profissional feminina a fim de prepará-las para a sua emancipação econômica.
    D:
      texto: Opúsculo Humanitário e Memórias de Martha destacam o espaço rural brasileiro como o lugar
        adequado para a emancipação feminina.
    E:
      texto: Opúsculo Humanitário e Memórias de Martha são obras que reivindicam uma solução para as contradições
        sociais e econômicas do Brasil no século XIX, com ênfase na defesa da educação feminina.
  resposta: E
  anulada: false
  pendencias: []
- numero: 12
  disciplina: portugues
  assunto: leituras-obrigatorias
