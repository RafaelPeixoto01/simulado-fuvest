  enunciado:
  - texto: "Existem números curiosos na matemática. Os números perfeitos são alguns deles. Um número \U0001D45B
      (para \U0001D45B ∈ ℕ*) é perfeito se, e somente se, for igual à soma de seus divisores positivos
      (excluindo o próprio). Relacionando números perfeitos e números primos, Euclides escreveu uma proposição
      em seu famoso livro “Elementos”: se 2ⁿ − 1 é um número primo, então 2ⁿ⁻¹(2ⁿ − 1) é um número perfeito.\nConsiderando
      o que foi exposto, é correto afirmar:"
  alternativas:
    A:
      texto: "Com exceção de \U0001D45B = 1, os 5 primeiros termos da sequência (\U0001D44Eₙ) = (2ⁿ −
        1) são números primos."
    B:
      texto: Os termos da progressão geométrica, cujo primeiro termo é o primeiro número perfeito e cuja
        razão é 3, são pares.
    C:
      texto: Os números 28 e 31 são números perfeitos.
    D:
      texto: "Na proposição de Euclides, para \U0001D45B = 4, obtemos que 2ⁿ − 1 não é primo, mas que
        2ⁿ⁻¹(2ⁿ − 1) é perfeito."
    E:
      texto: "A sequência formada pela diferença dos termos consecutivos de (\U0001D44Eₙ) = (2ⁿ − 1) é
        uma progressão aritmética de razão 2."
  resposta: B
  anulada: false
  pendencias: []
- numero: 56
