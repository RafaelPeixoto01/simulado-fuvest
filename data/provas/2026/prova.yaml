      Noemi em busca de sua liberdade política, social e sexual, em uma sociedade conservadora. O papel
      da mulher na sociedade e sua inserção no mercado de trabalho são temas atuais. Em março de 2025,
      o governo federal lançou um boletim que tem como objetivo analisar a inserção das mulheres no mercado
      de trabalho brasileiro. Um dos gráficos apresentados pelo boletim trata da taxa de participação
