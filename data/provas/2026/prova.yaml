  - texto: |-
      Francisco Ruiz Gijón (1683-1720), Santíssimo Cristo da Expiação, popularmente conhecido como Cristo Cachorro. Escultura em madeira, 1682 (detalhe).
      A partir da comparação entre a escultura Cristo Cachorro, de Francisco Ruiz Gijón, e o livro O Cristo cigano, de Sophia de Mello Breyner Andresen, inspirado por ela, depreende-se:
  alternativas:
    A:
      texto: A escultura barroca Cristo Cachorro prenuncia os traços modernistas do livro de Sophia de
        Mello Breyner Andresen, uma vez que a faca, metáfora central do poema, pensada a partir de um
        objeto do cotidiano, está indiretamente presente na escultura como o instrumento cortante utilizado
        para sua criação.
    B:
      texto: Tanto a escultura Cristo Cachorro, enquanto obra barroca, quanto o livro de Sophia de Mello
        Breyner Andresen, obra modernista, revelam, na precisão dos detalhes anatômicos e na personalização
        do objeto faca, respectivamente, o desaparecimento da visão da arte enquanto ligação com o divino
        e a concepção da morte como fim absoluto.
    C:
      texto: Na precisão dos detalhes anatômicos e na concepção do Cristo como um ser humano perfeito
        e unido ao divino pela morte, a escultura Cristo Cachorro revela a visão barroca do mundo, enquanto
        o livro de Sophia de Mello Breyner Andresen revela seu traço moderno na despersonalização do humano,
        ao propor a faca e o amor como condutores da ação.
    D:
      texto: A elaboração metonímica do corpo do Cristo no Cristo Cachorro, atenta aos detalhes, revela
        uma antecipação de traços modernistas nessa escultura barroca, enquanto a comparação entre amor
        e morte no livro de Sophia de Mello Breyner Andresen revela os traços tardiamente românticos de
        seu estilo poético.
    E:
      texto: A precisão de detalhes anatômicos e o equilíbrio de traços alcançados pelo artista na elaboração
        da escultura Cristo Cachorro revelam a visão barroca da arte como vitória do humano sobre o divino,
        enquanto o livro de Sophia de Mello Breyner Andresen, ao ocultar a imagem do cigano e resumi-la
        a uma voz em agonia, revela a concepção modernista de um mundo sem Deus.
  resposta: C
  anulada: false
  pendencias: []
