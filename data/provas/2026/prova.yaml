  - texto: 'A bióloga Lynn Margulis publicou um polêmico artigo em 1967 propondo que algumas organelas
      das células eucarióticas poderiam ser o resultado de eventos de endossimbiose, no qual bactérias
      passaram a viver em simbiose dentro de células eucarióticas até serem completamente incorporadas
      a elas. A hipótese de Margulis sofreu muita oposição, até que evidências experimentais mostraram
      que algumas organelas de fato possuíam muitas similaridades com bactérias. Entre as evidências de
      endossimbiose, podemos citar:'
  alternativas:
    A:
