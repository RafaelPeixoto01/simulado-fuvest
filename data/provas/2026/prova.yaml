      O indígena sofre menos sob a República do que sob a dominação espanhola? Não existem mais corregimientos nem encomiendas, mas persistem os trabalhos forçados e os recrutamentos. O sofrimento que lhe provocamos basta para descarregar sobre nós a execração dos seres humanos. Nós o conservamos na ignorância e na servidão, o envilecemos no quartel, o embrutecemos com o álcool, o lançamos a destroçar-se nas guerras civis e, de tempos em tempos, organizamos caçadas e matanças.
      Manuel González Prada. “Nuestros índios”. In: Ideas en torno de Latinoamérica. México: UNAM, 1986. Adaptado.
      O excerto, extraído de um texto publicado no início do século XX pelo peruano Manuel González Prada,
  alternativas:
    A:
      texto: identifica mudanças na condição dos indígenas após a emancipação política, mas afirma a persistência
        de sua exploração no trabalho e de sua marginalização social.
    B:
      texto: valoriza a ativa participação dos indígenas no processo de emancipação política, mas admite
        a dificuldade política de incorporá-los à nova ordem social.
    C:
      texto: reconhece os crimes contra os indígenas cometidos durante a colonização espanhola, mas enfatiza
        a melhoria nas relações sociais e na condição indígena sob a República.
    D:
      texto: defende a persistência da exclusão social dos indígenas na República, mas a justifica em
        função das heranças recebidas do período de colonização espanhola.
    E:
      texto: critica a obrigatoriedade do alistamento militar dos indígenas, mas insiste na importância
        de sua participação e de seu envolvimento na construção da República.
  resposta: A
