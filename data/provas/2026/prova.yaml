  - texto: "em que \U0001D443ᵢ(\U0001D465) é a probabilidade do i-ésimo resultado para a variável \U0001D465.\nPor
      exemplo, considere uma sequência com duas letras A coloridas, a primeira azul e a segunda vermelha
      (AA). Se essas duas letras fossem colocadas numa urna, a probabilidade de se retirar, sem observar,
      a letra azul, como na sequência original, é 1/2. Devolve-se a letra à urna e sorteia-se novamente.
