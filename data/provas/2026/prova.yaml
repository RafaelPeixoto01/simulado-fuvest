  - texto: Caetano Veloso revela sua posição a respeito do fato narrado no fragmento “Mas, embora me encha
      de orgulho o pensamento de que meu pai possa ter trapaceado para me agradar, eu sempre preferi crer
      na autenticidade do sorteio”. Assinale a alternativa em que a paráfrase do excerto mantém o mesmo
      sentido do texto original.
  alternativas:
    A:
      texto: Eu sempre preferi crer na autenticidade do sorteio e sempre tive orgulho de meu pai, mesmo
        sabendo que ele possa ter trapaceado no sorteio para me agradar.
    B:
      texto: Me enche de orgulho o pensamento de que meu pai trapaceou, mesmo que eu creia na autenticidade
        do sorteio para me agradar.
    C:
      texto: Eu sempre preferi crer na autenticidade do sorteio, mas, mesmo com o pensamento de que meu
        pai trapaceou para me agradar, tenho orgulho dele.
    D:
      texto: Uma vez acreditando na autenticidade do sorteio, penso que, para me agradar, meu pai pode
        ter trapaceado, o que me faz ter um pensamento cheio de orgulho.
    E:
      texto: Eu, contudo, sempre preferi crer na autenticidade do sorteio, ainda que me encha de orgulho
        o pensamento de que, a fim de me agradar, meu pai possa ter trapaceado.
  resposta: E
