  enunciado:
  - texto: O sistema de numeração conhecido como chinês científico (ou em barras) surgiu provavelmente
      há mais de dois milênios. O sistema é essencialmente posicional, de base 10, com o primeiro algarismo
      à direita representando a unidade. A primeira linha horizontal de símbolos da figura mostra como
      se representam os algarismos 1, 2, 3, 4, 5, 6, 7, 8 e 9 quando aparecem em posições ímpares (unidades,
      centenas etc.), e a segunda linha quando tais algarismos aparecem em posições pares (dezenas, milhares
      etc.). Nesse sistema, passou-se a usar um círculo para representar o algarismo zero a partir da
      Dinastia Sung (960-1126).
  - figura: q031-1.webp
  - texto: |-
      Howard Eves, Introdução à História da Matemática. Tradução: Hygino H. Domingues. Editora Unicamp, 2011 (5ª ed.).
      Assinale a alternativa que representa o número 91625 nesse sistema de numeração.
