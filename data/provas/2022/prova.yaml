  enunciado:
  - texto: "Alguns equipamentos de visão noturna têm seu funcionamento baseado no efeito fotoelétrico,
      uma das primeiras descobertas que contribuíram para o surgimento da mecânica quântica. Nesses equipamentos,
      fótons de frequência \U0001D453 emitidos por um objeto incidem sobre uma superfície metálica. Elétrons
      são então liberados da superfície e acelerados por um campo elétrico. Em seguida, o sinal eletrônico
      é amplificado e produz uma imagem do objeto.\nDiferentemente do que a física clássica prevê, apenas
      os elétrons com energia ℎ\U0001D453 acima de uma certa energia mínima \U0001D438₀ são liberados
      da superfície metálica.\nConsiderando a incidência de fótons com frequência da ordem de 10¹⁴ Hz,
      a ordem de grandeza do valor limite de \U0001D438₀ para que o equipamento funcione deve ser:"
  - texto: |-
      Note e adote:
