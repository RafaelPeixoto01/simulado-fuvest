- numero: 58
  disciplina: geografia
  assunto: hidrografia
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      Uma mancha de petróleo com mais de 3000 km de extensão se espalhou por praias e manguezais da costa da região nordeste e parte do sudeste, atingindo áreas marinhas protegidas como o Parque Nacional Marinho de Abrolhos, um dos principais bancos de corais e berço de biodiversidade do Atlântico Sul. Desde que foi detectada pela primeira vez, no dia 30 de agosto de 2019, a mancha de petróleo atingiu cerca de 900 locais em mais de 127 municípios em 11 estados. A origem do petróleo está estimada em algum local a leste do litoral do estado de Pernambuco, distante, aproximadamente, 600 km da linha de costa.
      Disponível em https://www.wwf.org.br/. 2019. Adaptado.
      Com base em seus conhecimentos sobre o litoral brasileiro e as correntes marítimas superficiais que margeiam a costa, assinale a alternativa correta que aponta o fator que contribuiu para a dispersão do petróleo.
  alternativas:
    A:
      texto: As reentrâncias e os recortes do litoral brasileiro, com sua geomorfologia costeira, foram
        responsáveis pelo impacto ambiental causado pelo derramamento de petróleo.
    B:
      texto: A presença de correntes marítimas frias em superfície, características dessa região, com
        elevado potencial de transporte de sedimentos, acentuou a dispersão do petróleo.
    C:
      texto: A corrente marítima das Falkland (Malvinas), que margeia a costa brasileira até o litoral
        da região nordeste, com águas frias em superfície, potencializou a dispersão do petróleo.
    D:
      texto: A reduzida profundidade média do litoral brasileiro favoreceu a dispersão do petróleo ao
        longo da costa de norte a sul, resultando em impactos negativos, em especial para a fauna marinha.
    E:
      texto: A corrente marítima do Brasil, que é caracterizada pelo movimento de águas superficiais quentes
        ao longo da linha de costa e provenientes do Atlântico Equatorial, espalhou o petróleo.
  resposta: E
  anulada: false
  pendencias: []
