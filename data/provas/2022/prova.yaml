  - texto: |-
      A noção de ditadura variou ao longo da História e dependeu das características políticas de cada sociedade.
      A esse respeito, assinale a alternativa correta:
  alternativas:
    A:
      texto: Na Roma Antiga, durante o período republicano, a ditadura era uma magistratura de caráter
        extraordinário, delimitada legalmente e estabelecida por um período determinado, com uma finalidade
        definida.
    B:
      texto: Com o golpe do 18 Brumário (1799), instaurou-se uma ditadura parlamentar na França, sob o
        comando de Napoleão Bonaparte, cujo objetivo fundamental era reescrever a Constituição francesa.
    C:
      texto: A ditadura militar brasileira, estabelecida em 1964, teve como característica o poder exclusivo
        das Forças Armadas e o fechamento das instâncias parlamentares durante toda a sua vigência.
    D:
      texto: O conceito da ditadura do proletariado foi elaborado por Karl Marx, defendido por anarquistas
        e comunistas, e previa a instauração permanente de um regime autoritário, como o da antiga União
        Soviética.
    E:
      texto: A ditadura nazista caracterizava-se por um complexo arranjo institucional baseado na articulação
        política entre o Poder Executivo, as Forças Armadas, o Parlamento alemão e os poderes legislativos
        municipais.
  resposta: A
  anulada: false
  pendencias: []
