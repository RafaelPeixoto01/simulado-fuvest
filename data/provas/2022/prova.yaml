      Texto 2
      Não sei onde ela tinha ido à escola, mas ela sabia ler e escrever. Saber escrever era algo perigoso se você tinha um pai exilado no Burundi. Logo começam a suspeitar que está se correspondendo com os tutsis que preparam seu retorno a Ruanda, que você é uma espiã dando informações aos que estão desse lado da fronteira e poderia facilitar a volta dos tutsis.

      Esses textos foram retirados, respectivamente, da música “Pantera Negra”, de Emicida, e do livro “A mulher de pés descalços”, de Scholastique Mukasonga, e fazem referência à guerra civil em Ruanda. Sobre esse conflito, é correto afirmar:
  alternativas:
    A:
      texto: Ocorrido no início do século XX, teve como principal estopim a disputa por recursos minerais
        no território de Ruanda, na divisa com Senegal.
    B:
      texto: Ex-colônia belga e inglesa, Ruanda conquistou sua independência com auxílio norte-americano
        nos anos 2000, desencadeando a guerra civil.
    C:
      texto: Trata-se de um conflito resultante da disputa entre diferentes grupos religiosos, que resultou
        na morte de mais de 800 mil Hutus e Tutsis.
    D:
      texto: Apoiados pelos russos e pelos franceses, os Tutsis tomaram o poder com um golpe de estado
        na década de 1970, iniciando as tensões que resultaram na guerra civil.
    E:
      texto: Ocorrido na década de 1990, teve como origem a disputa étnico-cultural (Tutsis e Hutus) nos
        territórios de Ruanda e Burundi.
  resposta: E
