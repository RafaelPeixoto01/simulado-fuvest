  - texto: |-
      A escassez global de semicondutores continua a ter estranhas repercussões, sobretudo do ponto de vista geopolítico. Há um ano as indústrias lutam para se abastecer com chips eletrônicos que equipam aparelhos do dia a dia, de computadores a torradeiras, passando pelas máquinas de lavar e consoles de videogames. O episódio atual, no entanto, surge em um contexto marcado por um questionamento geral a respeito dos benefícios da globalização e do declínio da atividade industrial no Ocidente.
      Evgeny Morzorov. “Devemos temer um colapso eletrônico?”. Le Monde Diplomatique Brasil, agosto/2021. Adaptado.
      O texto refere-se a uma questão geopolítica contemporânea: a disputa pelos semicondutores na indústria mundial. Sobre esse assunto, indique a alternativa correta:
  alternativas:
    A:
      texto: A produção de semicondutores está concentrada no sudeste asiático, nos países da 1ª e 2ª
        geração dos Tigres Asiáticos, tais como Taiwan, Coreia do Sul, Cingapura e Indonésia.
    B:
      texto: Nos últimos 20 anos, EUA e Europa vêm perdendo destaque na produção de semicondutores em
        decorrência da queda acentuada de investimentos em pesquisa e inovação.
    C:
      texto: 'A crise da falta de semicondutores revela um dos efeitos negativos da globalização: a independência
        da cadeia produtiva em escala mundial, pouco suscetível a desequilíbrios de oferta e demanda.'
    D:
      texto: A Nova Divisão Internacional do Trabalho indica o predomínio geoeconômico dos países do sudeste
        asiático, principais produtores de semicondutores, que têm ampliado, através da China, sua participação
        nesse setor desde sua democratização.
    E:
      texto: A escassez de semicondutores é resultado de uma interrupção momentânea da produção, em especial
        no sudeste asiático, devido à falta de matéria-prima, que é o início da cadeia produtiva.
  resposta: A
  anulada: false
  pendencias: []
