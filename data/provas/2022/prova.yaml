  - texto: |-
      A produção do vidro tem por base a modificação da estrutura cristalina do quartzo (SiO₂) por meio do seu aquecimento e da adição de óxidos alcalinos, dentre eles o Na₂O. Esse processo adiciona cátions sódio à estrutura do quartzo, tornando-a amorfa. Alguns vidros, como os utilizados em telas de smartphones, passam ainda por processo de troca iônica para aumentar a resistência a quedas e riscos. Para isso, o vidro é banhado em uma solução salina contendo íons potássio. Dessa forma, o potássio substitui o sódio na estrutura, sem que o volume do vidro se altere.
      Com base nessas informações, é correto afirmar que os íons potássio
  alternativas:
    A:
      texto: são maiores do que os íons sódio, dessa forma, a estrutura torna-se mais preenchida e mais
        resistente ao choque físico.
    B:
      texto: são mais resistentes ao choque físico do que os íons sódio, e esse caráter é conferido ao
        vidro.
    C:
      texto: são menores do que os íons sódio, tornando a estrutura menos preenchida e o vidro mais flexível.
    D:
      texto: fazem com que a estrutura do vidro deixe de ser amorfa quando substituem os íons sódio, tornando
        o vidro menos resistente ao choque físico.
    E:
      texto: têm o mesmo tamanho que os íons sódio, visto que ambos são metais alcalinos, permitindo sua
        completa substituição no vidro.
  resposta: A
  anulada: false
  pendencias: []
