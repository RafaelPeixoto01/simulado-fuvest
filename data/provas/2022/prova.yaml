  - texto: O hidróxido de alumínio (Aℓ(OH)₃), ao precipitar em solução aquosa, forma um sólido gelatinoso
      que pode ser usado como agente floculante no tratamento de água. Essa precipitação pode ocorrer
      pela adição de um hidróxido solúvel a uma solução aquosa ácida contendo um sal de alumínio solúvel,
      como o AℓCℓ₃. Entretanto, adicionando-se excesso de hidróxido ao meio, há a formação de íons Aℓ(OH)₄⁻,
      espécie solúvel em água, e o precipitado se solubiliza novamente. Dessa forma, dependendo do pH
      do meio, uma dentre as espécies Aℓ(OH)₄⁻(aq), Aℓ(OH)₃(s) e Aℓ³⁺(aq) estará presente na solução em
      quantidade maior que as demais, como exemplificado no esquema.
