        da produção.
    B:
      texto: pela capacidade de controlar e padronizar as diferentes etapas do processo produtivo por
        meio da disciplina.
    C:
      texto: pelo processo de concentração de operários, que estimulou a disputa por vagas e a diminuição
        dos salários.
    D:
      texto: através da substituição das formas artesanais das oficinas domésticas pela estrutura de guildas
        e corporações.
    E:
      texto: por meio de estratégias de gestão que incidiam na divisão do trabalho e na introdução de
        bônus por produtividade.
