  - texto: A pandemia da COVID-19 acendeu o alerta sobre os impactos que a rápida disseminação de enfermidades
      produz em um mundo cada vez mais globalizado. Além disso, ressaltou a importância das pesquisas
      científicas na descoberta, tratamento e controle de doenças tropicais negligenciadas, muitas delas
      recorrentes em diferentes países do mundo. Os mapas a seguir indicam as taxas de incidência de doenças
      tropicais negligenciadas (total de casos por milhão de habitantes) e o Produto Interno Bruto (PIB)
      per capita dos respectivos países.
  - figura: q066-1.webp
  - texto: |-
      Fabrício Marques. “Uma agenda para as doenças esquecidas”. Revista Pesquisa FAPESP, abril/2021. Adaptado.
      Em relação à incidência de doenças tropicais negligenciadas, é correto afirmar:
  alternativas:
    A:
      texto: Na África, é maior nos países com os maiores PIB per capita, em especial na região subsaariana.
    B:
      texto: Na Ásia, é menor nos países com os menores PIB per capita, com destaque para Ásia Setentrional.
    C:
      texto: Na América do Sul, é menor nos países da América Platina, com os menores PIB per capita da
        região.
    D:
      texto: Na América do Norte, com elevado PIB per capita, a incidência é menor em comparação ao Oriente
        Médio.
    E:
      texto: Na Oceania, apesar do PIB per capita elevado, verifica-se alta incidência, com destaque para
        a Austrália.
  resposta: D
  anulada: false
