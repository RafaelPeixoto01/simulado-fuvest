  - texto: No dia 23 de março de 2021 o mega navio Ever Given, de 220.000 toneladas e 400 m de comprimento,
      encalhou no Canal de Suez no Egito em rota para o porto de Rotterdam, Holanda, ficando atravessado
      e preso pelas extremidades. O navio reflutuou no dia 29 do mesmo mês em razão das condições de vento
