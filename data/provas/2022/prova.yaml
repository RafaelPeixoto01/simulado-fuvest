  - texto: "O gráfico mostra dados coletados na cidade do Rio de Janeiro, entre fevereiro e abril de 2020,
      período que inclui o início das medidas de restrição de circulação na cidade por causa da pandemia
      de COVID-19. Para cada dia, representado por um símbolo no gráfico, foram coletadas duas grandezas:
      uma média da energia de vibração sísmica durante o dia (na abscissa) e o índice \U0001D439 (na ordenada),
      que é a fração de pessoas que saiu de casa alguma vez naquele dia. A energia sísmica média foi medida
      em (nm/s)² na faixa de frequências que tem causas humanas. Os triângulos representam domingos e
      feriados; os quadrados referem-se aos sábados; e os círculos correspondem aos dias úteis da semana.
      Para cada um desses subconjuntos de dados, uma reta média foi obtida, expressando a relação aproximada
      entre as duas grandezas medidas."
