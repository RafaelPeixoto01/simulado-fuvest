  enunciado:
  - texto: Eventos climáticos extremos marcaram este ano com vários exemplos no mundo, atingindo populações
      inteiras, tanto em ambientes rurais como urbanos. Dentre esses eventos, pode-se destacar as inundações
      na Alemanha no mês de julho, com regiões acometidas por fortes chuvas.
  - figura: q060-1.webp
  - texto: |-
      Área urbana de Schuld, Oeste da Alemanha, antes (à esquerda) e depois (à direita) da inundação de julho/2021. Disponível em https://www.dw.com/.
      Um dos motivos que podem ser relacionados ao evento de inundação da área destacada é:
  alternativas:
    A:
      texto: O fato de o rio meandrante desviar da área urbana instalada nas suas margens, pois o vale
        estreito é periodicamente inundado, em especial nos eventos climáticos extremos, que submergem
        os morros na cidade.
    B:
      texto: A extensão do assentamento urbano que não respeitou os limites do canal fluvial, acabando
        por aterrá-lo, o que levou à inundação diante de um evento climático extremo, já que os rios não
        podem ser encobertos.
    C:
      texto: A área urbana, que se encontra em um fundo de vale plano onde há a presença de um canal de
        rio meandrante, o qual pode ter suas águas periodicamente extravasadas para a planície de inundação.
    D:
      texto: O insucesso da prevenção da inundação por meio da retificação do rio, pois se esperava que,
        mesmo com volumes excessivos de chuvas, as águas do canal fluvial não poderiam ser extravasadas
        para as margens.
    E:
      texto: Como a área urbana se encontra em um fundo de vale rugoso, existe maior facilidade para o
        assentamento, porém com o risco de o rio entrelaçado desviar seu curso único, causando inundações
        laterais.
  resposta: C
  anulada: false
  pendencias: []
