      região da África equatorial oriental, onde um meteorito contendo um metal chamado Vibranium caiu
      há 10 mil anos e provocou mutações na planta. Uma explicação coerente com o conhecimento científico
      para o que ocorreu nessa situação ficcional é que a erva
