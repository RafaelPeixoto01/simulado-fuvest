  - texto: O canhão de Newton, esquematizado na figura, é um experimento mental imaginado por Isaac Newton
      para mostrar que sua lei da gravitação era universal. Disparando o canhão horizontalmente do alto
      de uma montanha, a bala cairia na Terra em virtude da força da gravidade. Com uma maior velocidade
      inicial, a bala iria mais longe antes de retornar à Terra. Com a velocidade certa, o projétil daria
      uma volta completa em torno da Terra, sempre “caindo” sob ação da gravidade, mas nunca alcançando
      a Terra. Newton concluiu que esse movimento orbital seria da mesma natureza do movimento da Lua
      em torno da Terra.
  - figura: q056-1.webp
  - texto: Qual deveria ser a velocidade inicial de um projétil lançado horizontalmente do alto do Everest
      (a uma distância aproximada de 6.400 km do centro da Terra) para colocá-lo em órbita em torno da
      Terra?
  - texto: |-
      Note e adote:
      Despreze a resistência do ar.
      Aceleração da gravidade: g = 10 m/s².
  alternativas:
    A:
      texto: 8 km/s
    B:
      texto: 11,2 km/s
    C:
      texto: 80 km/s
    D:
      texto: 112 km/s
    E:
      texto: 8.000 km/s
  resposta: A
  anulada: false
  pendencias: []
