  - texto: Em virtude do movimento das placas tectônicas, a distância entre a América do Sul e a África
      aumenta, nos dias atuais, cerca de 2,0 cm a cada ano. Supondo que essa velocidade tivesse sido constante
      ao longo do tempo, e tomando uma distância atual de cerca de 5.000 km entre os limites dessas duas
      massas continentais, indique a melhor estimativa para quanto tempo teria transcorrido desde quando
      ambas estavam unidas em um único supercontinente.
  - texto: |-
      Note e adote:
      O valor obtido, embora da ordem de magnitude correta, não é o mesmo calculado por estimativas mais precisas.
  alternativas:
    A:
      texto: 250.000 anos
    B:
      texto: 2.500.000 anos
    C:
      texto: 25.000.000 anos
    D:
      texto: 250.000.000 anos
    E:
      texto: 2.500.000.000 anos
  resposta: D
  anulada: false
