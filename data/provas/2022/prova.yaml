  - texto: Cálculos renais, conhecidos popularmente por “pedras nos rins”, consistem principalmente em
      oxalato de cálcio, CaC₂O₄, espécie cuja constante de solubilidade (Kₚₛ) é de aproximadamente 2 ×
      10⁻⁹. Os íons oxalato, presentes em muitos vegetais, reagem com os íons cálcio para formar oxalato
      de cálcio, que pode gradualmente se acumular nos rins. Supondo que a concentração de íons cálcio
      no plasma sanguíneo seja de cerca de 5 × 10⁻³ mol/L, qual seria a concentração mínima, em mol/L,
      de íons oxalato para que CaC₂O₄ precipitasse?
