  - texto: 'Atualmente, no Brasil, coexistem dois sistemas de placas de identificação de automóveis: o
      padrão Mercosul (o mais recente) e aquele que se iniciou em 1990 (o sistema anterior, usado ainda
      pela maioria dos carros em circulação). No sistema anterior, utilizavam-se 3 letras (em um alfabeto
      de 26 letras) seguidas de 4 algarismos (de 0 a 9). No padrão Mercosul adotado no Brasil para automóveis,
      são usadas 4 letras e 3 algarismos, com 3 letras nas primeiras 3 posições e a quarta letra na quinta
      posição, podendo haver repetições de letras ou de números. A figura ilustra os dois tipos de placas.'
