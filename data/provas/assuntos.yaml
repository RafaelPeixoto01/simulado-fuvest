# Taxonomia de assuntos por disciplina (RN-014, ADR-009, CR-004).
#
# Condensada do "Programa das disciplinas" do Guia de Provas FUVEST 2027
# (https://www.fuvest.br/wp-content/uploads/fuvest2027-guia-provas-programas.pdf)
# e ajustada ao que as provas de 2023 a 2025 cobram. A ordem aqui é a ordem de exibição.
#
# Regras de classificação (cada questão tem exatamente um assunto, da disciplina principal):
# - O slug é estável: vai para o banco e para o histórico dos estudantes. Renomear ou remover
#   um slug em uso exige reclassificar as questões no mesmo commit (a V11 acusa).
# - O nome pode mudar à vontade (a exibição usa sempre o nome atual).
# - Português: questão sobre uma obra da lista de leituras obrigatórias vai para
#   "leituras-obrigatorias", mesmo que seja um poema; lógica e falácias vão para "argumentacao".
# - História: Filosofia e Sociologia são classificadas em História (como as disciplinas) e
#   têm assuntos próprios.

