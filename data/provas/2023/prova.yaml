      “O ‘País’ abriu quarta-feira em suas colunas o mais interessante dos plebiscitos para solução de um importante problema social: Como deve ser educada a mulher... Trata-se de saber se devemos ser educadas para, pelo casamento, sermos sustentadas pelo homem, ou para nos tornarmos hábeis e prover à nossa própria subsistência pelo nosso único trabalho. Se admitis a primeira hipótese, em que consiste a educação feminina para o casamento? Se preferis a segunda, quais são os gêneros de trabalho em que a mulher pode, sem decair, ganhar a vida em nossa terra? (...) Esta forma de educação requer toda uma ordem de conhecimento que não sejam apenas frívolos. (...) Os nossos costumes, por isso mesmo, são ingênuos e se apoiam em preconceitos e tradições, não admitem ainda a mulher que trabalha. (...) Assim mesmo as professoras já lograram subir um pouco na cotação social. As médicas vão impondo-se pouco a pouco...”. Carmem Dolores. “A Semana”. Rio de Janeiro, 08/04/1906. In: VASCONCELLOS, Eliane (org.). Carmem Dolores. Crônicas , 1905-1910. Rio de Janeiro: Arquivo Público do Estado do Rio de Janeiro, 1998.
      De acordo com o excerto, assinale a alternativa mais adequada para expressar o processo de inserção das mulheres no mundo do trabalho no início do século XX.
  alternativas:
    A:
      texto: O patriarcalismo e o emprego do dote foram erradicados pelos protocolos jurídicos adotados
        no regime republicano, favorecendo o reconhecimento social do trabalho feminino.
    B:
      texto: A educação feminina dissociava-se das convenções vigentes na sociedade e dos padrões morais
        preconizados pelo catolicismo.
    C:
      texto: O reconhecimento social do trabalho feminino estava limitado à esfera pública, pois o espaço
        doméstico ainda permanecia marcado pela autoridade masculina.
    D:
      texto: O processo de feminização do magistério na escola básica proporcionou o reconhecimento do
        trabalho das mulheres e a conquista de novos papéis sociais.
    E:
      texto: A ruptura do preconceito para com o trabalho feminino nas fábricas, comércio, serviço público
        e profissões liberais se deu efetivamente após a conquista dos direitos políticos pelas mulheres,
        em 1934.
  resposta: D
