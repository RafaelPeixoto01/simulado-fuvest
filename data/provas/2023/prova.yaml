  enunciado:
  - texto: |-
      O processo de transporte de O para a respiração pode ser entendido como um processo de equilíbrio químico entre a hemoglobina (Hb) e o O . A Hb é uma proteína do sangue responsável pelo transporte do O que também pode existir na forma protonada como HbH . Dependendo da concentração de CO , podem ocorrer a alcalose ou a acidose respiratória. A ligação do oxigênio com a HbH gera a forma oxigenada (HbO ), como pode ser representado pela equação química simplificada:
      HbH (aq) + O (g) ⇌ HbO (aq) + H (aq)
      O dióxido de carbono liberado na respiração pode alterar esse equilíbrio devido à formação de ácido carbônico, representado pela equação:
      CO (g) + H O( l ) ⇌ H (aq) + HCO (aq)
      Com base nessas informações, é correto afirmar:
  alternativas:
    A:
      texto: Nos pulmões, onde a concentração de oxigênio é mais elevada, a forma de hemoglobina favorecida
        é a protonada.
    B:
      texto: Nos tecidos humanos, onde é consumido O pelo metabolismo, a forma de hemoglobina favorecida
        é a HbO .
    C:
      texto: Quando uma pessoa expira mais depressa que o normal, a concentração de dióxido de carbono
        no seu sangue diminui e, nessas situações, a forma de hemoglobina favorecida é a forma protonada.
    D:
      texto: Nos tecidos humanos, onde é liberado dióxido de carbono produzido pelo metabolismo, a forma
        de hemoglobina favorecida é a forma protonada.
    E:
      texto: Nos tecidos humanos, onde é liberado dióxido de carbono produzido pelo metabolismo, a forma
        de hemoglobina favorecida é a HbO .
  resposta: D
  anulada: false
  pendencias: []
