  enunciado:
  - texto: |-
      “De acordo com o órgão responsável pela área de telecomunicações e radiodifusão dos Estados Unidos, considera-se ionizante qualquer radiação eletromagnética que transporte energia maior que 10 eV (elétron-volts). Essa energia é equivalente àquela transportada pelo ultravioleta longínquo, uma das faixas mais energéticas do ultravioleta, que se estende entre 122 nm e 200 nm de comprimento de onda.”
      Disponível em https://mundoeducacao.uol.com.br/. Adaptado. “De acordo com a professora Patricia Nicolucci, da USP, há dois tipos de radiação: a ionizante e a não ionizante. Mas elas possuem características diferentes de interação com o corpo humano. ‘[Alguns tipos de radiação] são consideradas não ionizantes porque a energia não é suficiente para liberar elétrons quando interagem com o tecido do corpo humano ou qualquer outro material. Já a radiação ionizante, utilizada em medicina nuclear e em radioterapia, tem uma energia maior, o que lhe confere essa característica de tirar elétrons dos átomos da matéria com a qual interage’.”
      Disponível em https://www5.usp.br/noticias/. Adaptado.
      Com base nos textos e nos seus conhecimentos, assinale a alternativa correta.
  alternativas:
    A:
      texto: A luz de lâmpadas brancas, as micro-ondas e o laser vermelho podem ser considerados exemplos
        de radiação não ionizante.
    B:
      texto: Radiação eletromagnética de comprimentos de onda maiores tem um efeito ionizante mais acentuado
        do que a de comprimentos de onda menores.
    C:
      texto: Luz visível não pode ser considerada uma forma de radiação, uma vez que tem efeitos desprezíveis
        sobre tecidos do corpo humano.
    D:
      texto: O efeito fotoelétrico é um exemplo de interação de radiação não ionizante com a matéria.
    E:
      texto: A liberação de elétrons de moléculas de tecidos do corpo humano por radiações ionizantes
        não afeta as propriedades químicas dessas moléculas.
  resposta: A
  anulada: false
