    C:
      texto: Uma etnia que historicamente alcançou a emancipação política e social por meio da assimilação
        da cultura europeia.
    D:
      texto: Um conjunto de indivíduos de nacionalidade estrangeira cujos hábitos e costumes contrastavam
        com os da população local.
    E:
      texto: Um segmento que ganhou visibilidade por ocupar posições sociais de prestígio.
  resposta: B
