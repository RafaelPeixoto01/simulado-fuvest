      “Em nossa época, entretanto, devemos conceber o Estado contemporâneo como uma comunidade humana que, dentro dos limites de determinado território (...) reivindica o monopólio do uso legítimo da violência física. É, com efeito, próprio de nossa época não reconhecer, em relação a qualquer outro grupo ou aos indivíduos, o direito de fazer uso da violência, a não ser nos casos em que o Estado o tolere: o Estado se transforma, portanto, na única fonte do ‘direito’ à violência”.
      WEBER, Max. Ciência e Política: duas vocações. São Paulo: Cultrix, 1970.
      “Com a entrada das milícias na disputa por territórios no Rio de Janeiro, elas passaram a se digladiar pelo domínio geográfico das comunidades cariocas e fluminenses (...). Embora as milícias também comandem a comunidade com tirania e sua autoridade se mantenha à base de ameaças, como fazem os traficantes, e aqueles que contestam seu poder possam perder a vida e sofrer torturas, ao contrário do tráfico, os milicianos se vendem como fiadores de mercadorias valiosíssimas:
      ordem,
      estabilidade
      e possibilidade de planejar o futuro, aliança política com o Estado e a polícia. (...) O lado impopular desse modelo é que a maior parte das receitas para bancar o negócio vem da extorsão dos habitantes”.
      PAES MANSO, Bruno . A república das milícias . São Paulo: Todavia, 2020.
      A partir da definição de Estado proposta por Max Weber e de acordo com a citação de Paes Manso, como é possível analisar a atuação das milícias no Rio de Janeiro?
  alternativas:
    A:
      texto: As milícias, assim como o Estado, controlam a população e mantêm a ordem em determinado território
        com o uso ilegal da violência, da ameaça e da extorsão.
    B:
      texto: As milícias contribuem para o exercício do monopólio do uso legítimo da violência pelo Estado,
        pois garantem a imposição da ordem e o controle do tráfico nos territórios que dominam.
    C:
      texto: As milícias desafiam o monopólio do uso legítimo da violência física do Estado ao utilizar
        a violência ilegalmente para controlar determinados territórios.
    D:
      texto: As milícias diferenciam-se dos traficantes ao atuar pacificamente em resposta à reivindicação
        popular por maior estabilidade e ordem nos territórios em que atuam.
    E:
      texto: As milícias e os traficantes, assim como o Estado, possuem autonomia e legitimidade para
        usar a violência e controlar territórios.
  resposta: C
