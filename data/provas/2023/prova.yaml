      O texto da professora e jurista estadunidense Kimberlé Crenshaw define o conceito de interseccionalidade para o estudo das múltiplas discriminações. A partir dessa definição, é possível dizer que os dados do Dieese sobre o mercado de trabalho brasileiro em 2021 indicam que
  alternativas:
    A:
      texto: a interseccionalidade de discriminações de gênero, de raça e de classe faz com que homens
        negros sejam o grupo social mais vulnerável.
    B:
      texto: as discriminações de raça e gênero não se relacionam; assim, mulheres negras e homens negros
        sofrem as mesmas discriminações no mercado de trabalho.
    C:
      texto: a interseccionalidade de discriminações atinge de maneira igual mulheres brancas e negras
        pertencentes às classes trabalhadoras.
    D:
      texto: a interseccionalidade de discriminações de gênero e raça explica o fato de as mulheres negras
        ocuparem as posições menos valorizadas e mais mal pagas no mercado de trabalho.
    E:
      texto: as situações de gênero e de raça não têm impacto no mercado de trabalho. Trabalhadores e
        trabalhadoras são discriminados igualmente em virtude da desigualdade de classe social.
  resposta: D
