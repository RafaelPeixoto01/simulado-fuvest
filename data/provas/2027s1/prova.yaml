  - texto: "Todos gostam de dias extraordinários, ou seja, dias que fogem da rotina da pessoa. Em uma
      cidade, constatou-se que uma pessoa que sai de casa e retorna no mesmo dia tem a probabilidade de
      \U0001D45D = 10⁻³ de ter passado esse dia extraordinariamente. Essa pessoa sai de casa e retorna
      no mesmo dia rotineiramente exatamente 28 dias por mês. Nessa situação, a probabilidade dessa pessoa
      ter pelo menos dois dias extraordinários no mês é \U0001D443₂. Suponha que o que acontece em um
      dia independe do que acontece em qualquer dia. Se essa pessoa reduzir suas saídas rotineiras para
      exatamente 14 dias por mês (metade dos 28 dias), a probabilidade de ter tido pelo menos um dia extraordinário
      nesses 14 dias vale \U0001D443₁. Use a aproximação (1 + \U0001D6FC)ⁿ = 1 + \U0001D45B\U0001D6FC,
      válida quando |\U0001D6FC| < 1 e |\U0001D45B\U0001D6FC| é pequeno comparado a 1. Então, a relação
      entre \U0001D443₂ e \U0001D443₁ vale, aproximadamente,"
  alternativas:
    A:
      texto: "\U0001D443₂/\U0001D443₁ = 5,2 × 10⁻²."
    B:
