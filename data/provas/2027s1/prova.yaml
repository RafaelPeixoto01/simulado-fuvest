      Para estudar o movimento de oscilação das asas de insetos, os cientistas usam, em geral, experimentos que colocam um mosquito entre um laser e um fotossensor. Conforme a asa do mosquito bate, ela intercepta a luz que vai em direção ao sensor, o qual gera uma variação de voltagem (em mV) proporcional à quantidade de luz que incide sobre ele. O sinal elétrico obtido pelos cientistas mostra a combinação de vários movimentos com frequências e amplitudes diferentes. Nas figuras a seguir, o gráfico 1 mostra um exemplo da variação da amplitude do sinal elétrico (em mV) em função do tempo (em ms) de movimentos oscilatórios com duas frequências diferentes, identificadas em asas de libélulas. O gráfico 2 mostra a combinação desses dois movimentos gerando uma oscilação mais complexa.
