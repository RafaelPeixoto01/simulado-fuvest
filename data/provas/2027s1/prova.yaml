  enunciado:
  - texto: |-
      O espectro atômico funciona como uma impressão digital cósmica, pois cada elemento químico emite ou absorve luz em comprimentos de onda específicos e imutáveis. Ao decompor a luz de estrelas e galáxias, os cientistas conseguem identificar esses padrões fixos, que servem como uma régua de comparação absoluta entre o que é observado no laboratório e o que vem das profundezas do espaço.
      A prova da expansão do universo surgiu quando Edwin Hubble percebeu que essas linhas espectrais em galáxias distantes estavam deslocadas para o vermelho (redshift). Esse fenômeno é análogo ao efeito Doppler sonoro. Como esse padrão se repete em quase todas as direções, conclui-se que o próprio espaço entre as galáxias está em constante expansão.
  - figura: q024-1.webp
  - texto: |-
      Disponível em https://www.jpl.nasa.gov/edu/resources/. Adaptado.
      Qual das alternativas explica corretamente a relação entre os modelos atômicos e a descoberta de Hubble?
  alternativas:
    A:
      texto: As linhas espectrais mudam de posição porque os átomos em galáxias distantes são mais antigos
        e possuem níveis de energia diferentes dos átomos encontrados atualmente na Via Láctea.
    B:
      texto: O modelo atômico de Bohr estabelece que os elétrons emitem fótons em frequências específicas;
        o deslocamento dessas frequências conhecidas para o vermelho (redshift) comprova o afastamento
        das galáxias.
    C:
      texto: O desvio para o vermelho ocorre porque os átomos das galáxias distantes estão se expandindo
        fisicamente, tornando-se maiores e alterando a distância entre o núcleo e os elétrons.
    D:
      texto: Hubble provou que o hidrogênio nas galáxias distantes possui um espectro de emissão diferente
        do hidrogênio da Terra, o que invalidou o princípio da universalidade das leis da física.
    E:
      texto: As linhas de absorção observadas por Hubble são causadas pela poeira cósmica que desacelera
        a luz, fazendo com que os fótons percam energia e mudem de cor sem que haja movimento real das
        galáxias.
  resposta: B
  anulada: false
  pendencias: []
