  texto_base: null
  enunciado:
  - texto: |-
      No sangue, o oxigênio liga-se à hemoglobina não oxigenada (Hb), formando a hemoglobina oxigenada (HbO₂). Esse processo de oxigenação pode ser representado pelo equilíbrio químico:
      Hb + O₂ ⇌ HbO₂
      Para estimar a quantidade de oxigênio transportado pelo sangue, relógios digitais esportivos e monitores hospitalares utilizam um dispositivo chamado oxímetro de pulso. Esse equipamento emite luz em dois comprimentos de onda, 660 nm (vermelho) e 940 nm (infravermelho), e mede a quantidade de luz absorvida pelo sangue nos vasos sanguíneos superficiais, próximos à pele do usuário. A figura a seguir mostra, de forma simplificada, o espectro de absorção de luz pela Hb e pela HbO₂ em função do comprimento de onda, com destaque para os comprimentos de onda utilizados pelos oxímetros.
  - figura: q078-1.webp
  - texto: 'Considerando o equilíbrio químico e os dados espectrais apresentados, pode-se afirmar que,
      em uma situação de baixa pressão parcial de O₂:'
  alternativas:
    A:
      texto: O equilíbrio desloca-se para a direita, aumentando a fração de HbO₂ e a absorção de luz em
        940 nm.
    B:
      texto: Não há alteração na posição do equilíbrio, apenas a intensidade da luz absorvida se altera
        em todos os comprimentos de onda.
    C:
      texto: Ocorre aumento simultâneo das frações de Hb e HbO₂, elevando a absorção em 660 nm e 940 nm.
    D:
      texto: O equilíbrio desloca-se para a esquerda, aumentando a fração de Hb, o que resulta em maior
        absorção de luz em 660 nm.
    E:
      texto: A absorção de luz em 660 nm induz o deslocamento do equilíbrio no sentido da formação de
        Hb, reduzindo a fração de HbO₂.
  resposta: D
  anulada: false
  pendencias: []
