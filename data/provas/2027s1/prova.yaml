  enunciado:
  - texto: |-
      A capsaicina é um composto orgânico, responsável pela sensação de ardor produzida por algumas pimentas. Pesquisas sobre como o organismo detecta calor e substâncias irritantes levaram à identificação do canal iônico TRPV1. Em humanos, a capsaicina liga-se a esse canal, localizado em terminações nervosas livres associadas à detecção de estímulos potencialmente lesivos. Quando ativado, o TRPV1 aumenta a permeabilidade da membrana neuronal a cátions, especialmente Na⁺ e Ca²⁺, promovendo despolarização e geração de potenciais de ação. Esses impulsos são interpretados pelo sistema nervoso central como dor em queimação.
      Com base nessas informações e nos conhecimentos sobre receptores sensoriais, assinale a alternativa correta.
  alternativas:
    A:
      texto: A capsaicina provoca sensação de ardor porque induz aumento da temperatura local nos tecidos
        com os quais entra em contato, sendo esse aumento detectado por receptores térmicos responsáveis
        pela percepção de calor.
    B:
      texto: A ligação da capsaicina ao TRPV1 promove redução da entrada de cátions na célula sensorial,
        estabilizando o potencial de membrana e facilitando a propagação do impulso nervoso.
    C:
      texto: A ativação do TRPV1 indica que um mesmo receptor sensorial pode responder a estímulos de
        naturezas distintas, desde que estes estejam associados a condições potencialmente lesivas ao
        organismo.
    D:
      texto: A sensação de queimação ocorre porque a capsaicina estimula mecanorreceptores presentes na
        pele e nas mucosas, que respondem a alterações estruturais da membrana plasmática provocadas pelo
        contato com a substância.
    E:
      texto: A capsaicina desencadeia sensação de ardor por ativar receptores térmicos responsáveis pela
        detecção de variações de temperatura não nocivas, os quais não participam de vias neurais associadas
        à dor.
  resposta: C
  anulada: false
  pendencias: []
- numero: 62
  disciplina: biologia
  assunto: saude
  disciplinas_secundarias:
