- numero: 14
  disciplina: portugues
  assunto: leituras-obrigatorias
  disciplinas_secundarias:
  - historia
  texto_base: null
  enunciado:
  - figura: q014-1.webp
  - texto: |-
      La Bouche du Roi, obra mais famosa de Romuald Hazoumè, artista plástico da República do Benim (África Ocidental), local de onde escravos africanos eram transportados para as Américas.
      Em La Bouche du Roi, vê-se uma instalação que recria o mapa do porão de um navio negreiro, utilizando centenas de máscaras, galões de petróleo vazios e outros materiais que representam a situação de pessoas escravizadas. A obra propõe uma revisão iconográfica da história do tráfico de escravos.
      Na obra A visão das plantas, de Djaimilia Pereira da Silva, o personagem Celestino retorna de sua vida de corsário assombrado pelos crimes que praticara. O pirata foi se transformando em um jardineiro, de cujas mãos nascem a beleza e o viço das plantas. Sob a paz da natureza, entretanto, assomam-se constantes lembranças dos escravos mortos. Constata-se da leitura de A visão das plantas e da análise da imagem:
  alternativas:
    A:
      texto: Em A visão das plantas, a crítica social manifesta-se de forma sutil, ao enfatizar o caráter
        idílico do jardim. Já em La Bouche du Roi, a crueza do material, proveniente do lixo, diminui
        a intensidade da crítica à violência e interfere negativamente na dimensão estética da obra.
    B:
      texto: Em ambas as expressões artísticas, na escritura poética de Djaimilia e na híbrida instalação
        do artista plástico, ressoam vozes da história, espectros antes silenciosos a clamar pela responsabilidade
        da sociedade. Ambas demonstram como a arte não perdoa esquecimentos; como objetos artísticos,
        reinventam situações e são potentes formas de crítica e de regeneração dos sentimentos humanos.
    C:
      texto: As duas obras compartilham uma estética de desconstrução das narrativas coloniais, mas A
        visão das plantas é uma obra de ficção que reinterpreta a história de uma maneira reconciliadora,
        enquanto La Bouche du Roi caracteriza-se por uma crítica desconfortável, buscando expor a violência
        das práticas coloniais com enfoque nos efeitos psicológicos do colonialismo sobre corpos africanos.
    D:
      texto: Embora haja o reconhecimento dessas duas obras no campo das artes, seja na seara da arte
        literária, seja na das artes plásticas, elas não trazem contribuição ao cânone da literatura pós-colonial,
        tampouco acenam para a importância de revisitar o passado para compreender os ecos do presente.
    E:
      texto: Em A visão das plantas, a autora utiliza elementos de ficção científica para explorar a desconexão
        emocional dos personagens em relação ao mundo natural. Em La Bouche du Roi, o escultor critica
        a globalização, utilizando materiais que imitam o “outro” de uma maneira distorcida, ressaltando
        a perda da identidade cultural africana diante de influências externas.
  resposta: B
  anulada: false
  pendencias: []
- numero: 15
  disciplina: portugues
  assunto: leituras-obrigatorias
  disciplinas_secundarias:
  - historia
  texto_base: null
  enunciado:
  - texto: Leia os excertos dos poemas O Navio Negreiro (1868), de Castro Alves, e O africano e o poeta,
      extraído de Nebulosas (1872), de Narcisa Amália.
  - texto: |-
      'Stamos em pleno mar...;
      [...]
      Albatroz! Albatroz! dá-me estas asas.
      [...]
      Mas que vejo eu aí... Que quadro d'amarguras!
      É canto funeral! ... Que tétricas figuras! ...
      Que cena infame e vil... Meu Deus! Meu Deus! Que horror!
      E ri-se a orquestra irônica, estridente...
      [...]
      Qual um sonho dantesco as sombras voam!...
      Gritos, ais, maldições, preces ressoam!
      E ri-se Satanás
      Senhor Deus dos desgraçados!
      Dizei-me vós, Senhor Deus,
      Se eu deliro... ou se é verdade
      Tanto horror perante os céus?!...
      Ó mar, por que não apagas
      Co'a esponja de tuas vagas
      Do teu manto este borrão?
      Castro Alves. O Navio Negreiro.
  - texto: |-
      [...]
      De imenso desgosto
      Silente expressão;
      Quem pensa? — O poeta
      [...]
      Lacera-me o seio
      Sulcado de dor,
      Quem sente? — O poeta
      [...]
      Sulquei vasto mar;
      Mas este queixume
      [...]
      Quem quer escutar?…
      — Quem quer? O poeta
      [...]
      Quem vê? — O poeta
      [...]
      Sem crenças na vida,
      Sem pátria querida,
      Só resta tombar!
      Mas… quem uma prece
      Na campa do escravo
      Que outrora foi bravo
      Triste há de rezar?!…
      — Quem há de?… O poeta
      Narcisa Amália. O africano e o poeta.
  - texto: 'Depreende-se dos poemas:'
  alternativas:
    A:
      texto: Castro Alves e Narcisa Amália, apesar de distantes no tempo e pertencentes a movimentos literários
        distintos, trazem críticas severas à escravidão e evidenciam a relação entre a poesia, a dor,
        a natureza e o sofrimento humano.
    B:
      texto: Castro Alves descreve a dor do cativo com profundo envolvimento emocional; Narcisa Amália
        recorre à expressão "Quem há?" para enfatizar a solidão existencial do africano, sugerindo que
        o mundo deve se curvar à sua dor, mais profunda e sublime que a dos outros seres humanos.
    C:
      texto: Ambos os poemas exaltam a liberdade, sendo o mar um símbolo positivo. Em O Navio Negreiro,
        o mar é uma libertação do sofrimento, enquanto, em O africano e o poeta, o poeta alcança uma transcendência
        que o liberta de sua dor através do contato com a natureza, principalmente com o mar.
    D:
      texto: Em O Navio Negreiro, o autor constrói imagens complexas para atestar a dimensão da crueldade
        do momento histórico retratado. Em O africano e o poeta, a autora indicia a função crítica do
        poeta na sociedade, inscrevendo-a no próprio poetar. Desse modo, Narcisa Amália dialoga com Castro
        Alves, denunciando as injustiças da sociedade escravocrata.
    E:
      texto: Ambos os poemas apresentam a figura do poeta como um ser divinizado, cuja percepção de dor
        transcende a realidade humana. Em O Navio Negreiro, o poeta é intermediário entre horrores do
        mar e as figuras mitológicas; em O africano e o poeta, a dor do humano destaca-se como um sofrimento
        internalizado, mas igualmente elevado a uma missão quase divina.
  resposta: D
  anulada: false
  pendencias: []
