  enunciado:
  - texto: |-
      Considere os textos a seguir que discorrem sobre copos térmicos:
      “O que realmente faz nossos produtos se destacarem é o isolamento térmico de ponta. Quase todos os itens da nossa seleção são feitos com dupla parede de aço inox 18/8 (...). E o grande segredo disso está na ciência. Sim, isso mesmo! Em outras palavras, nossos produtos possuem um espaço a vácuo entre as paredes que evita a troca de temperatura com o ambiente externo.
      Esse é um método inventado pelo nosso fundador, o físico e inventor William Stanley Jr., lá em 1913, quando a marca Stanley foi criada. Na época, as partes internas das garrafas eram feitas de vidro. William descobriu, então, que um processo de soldagem entre duas paredes de aço inox, a vácuo, seria muito mais eficiente.”
      Disponível em https://www.stanley1913.com.br/blogs/news/tecnologia-stanley/.
      “Copos térmicos possuem uma barreira extra que impede que as trocas de calor com o ambiente externo aconteçam muito rapidamente. Para isso, dispõem de um truque: possuem paredes duplas, às vezes até mesmo triplas, entre o líquido a superfície externa. Isto é, a segunda parede do copo, que é a de contato direto com o líquido, não está diretamente em contato com o meio externo. Entre essas paredes, há ainda um pequeno espaço vazio – um vácuo.”
      Disponível em: https://guiadoestudante.abril.com.br/.
      De acordo com os textos e com os seus conhecimentos, é correto afirmar:
  alternativas:
    A:
      texto: Uma das funções do aço inox na composição das paredes do copo é o de aumentar a irradiação
        de calor do interior do copo para o ambiente externo, diminuindo a temperatura no interior do
        líquido.
    B:
      texto: Por ser um metal, o aço inox é um isolante térmico melhor do que o vidro, que é tanto um
        bom isolante elétrico como um bom condutor de calor.
    C:
      texto: A parede dupla de aço inox com camadas reflexivas separadas por uma região de vácuo suprime
        tanto a condução como a irradiação de calor entre o copo e o ambiente externo.
    D:
      texto: A presença de uma região de vácuo entre as paredes de metal não inibe o processo de troca
        de calor por convecção com o ambiente externo.
    E:
      texto: A principal função da região de vácuo entre as paredes do copo é a de suprimir a irradiação
        de calor do ambiente externo para o interior do recipiente.
  resposta: C
  anulada: false
  pendencias: []
