  enunciado:
  - texto: |-
      Ao comparar a fisiologia de um inseto com a de um mamífero, observa-se que ambos possuem altas demandas metabólicas, mas utilizam estratégias distintas para a manutenção da homeostase e o transporte de substâncias.
      Sobre a fisiologia comparada desses dois grupos, assinale a alternativa correta.
  alternativas:
    A:
      texto: Ambos utilizam pigmentos respiratórios metálicos, como a hemoglobina, dissolvidos obrigatoriamente
        no interior de células especializadas para garantir que o oxigênio chegue às mitocôndrias musculares.
    B:
      texto: A hemolinfa dos insetos circula sob alta pressão em uma rede de capilares contínuos, o que
        permite uma velocidade de difusão de gases superior à encontrada no sistema circulatório fechado
        dos mamíferos.
    C:
      texto: O coração dos insetos situa-se na posição ventral e é responsável pelo transporte de oxigênio
        para os tecidos, diferindo dos mamíferos, que possuem coração dorsal e pulmões responsáveis pela
        hematose.
    D:
      texto: Nos insetos, o sistema circulatório aberto é dissociado do transporte de gases, enquanto
        nos mamíferos a integração entre os sistemas cardiovascular e respiratório é obrigatória para
        o suprimento de oxigênio aos tecidos.
    E:
      texto: Tanto em insetos quanto em mamíferos, o sistema circulatório é o único responsável pelo transporte
        de oxigênio e gás carbônico, além de hormônios e excretas.
  resposta: D
  anulada: false
