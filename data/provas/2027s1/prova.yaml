  texto_base: tb06
  enunciado:
  - texto: O fluxo de água que dá origem às Blood Falls é fornecido por um lago subglacial de água com
      cerca de 4 vezes mais sais que a água do mar. Em condições normais, a água pura congela a 0 °C sob
      pressão atmosférica; no entanto, nesse lago, a água permanece líquida mesmo a temperaturas da ordem
      de −7 °C. Esse reservatório não congela mesmo em temperaturas abaixo de 0 °C, pois
  alternativas:
    A:
      texto: a elevada concentração de partículas dissolvidas reduz a temperatura de congelamento da água,
        dificultando a formação da estrutura cristalina do gelo.
    B:
      texto: os íons de ferro presentes reagem quimicamente com a água, liberando calor e impedindo a
        solidificação.
    C:
      texto: o aumento da densidade da água salgada pela concentração de sais dissolvidos eleva seu ponto
        de congelamento em relação à água pura.
    D:
      texto: a pressão exercida pela geleira é suficiente, por si só, para impedir a mudança de fase da
        água.
    E:
      texto: a ausência de oxigênio dissolvido dificulta a formação de ligações de hidrogênio entre as
        moléculas de água, dificultando a solidificação da água líquida.
  resposta: A
  anulada: false
  pendencias: []
