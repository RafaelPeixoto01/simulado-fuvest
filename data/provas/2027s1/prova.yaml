  - texto: 'No início do século XX, exploradores que atravessavam a Antártida observaram um fenômeno intrigante
      na geleira Taylor: água de cor avermelhada brotava do gelo, lembrando sangue. O fenômeno ficou conhecido
      como “Cachoeiras de Sangue” (Blood Falls).'
  - figura: tb06-1.webp
  - texto: Durante muito tempo, acreditou-se que a coloração fosse causada por algas ou microrganismos
      pigmentados que viviam em reservatórios de água presas abaixo do gelo. Na verdade, análises químicas
      mostraram que essa água é extremamente rica em íons ferro(II) dissolvidos. Enquanto permanece sob
      o gelo, em um ambiente sem oxigênio, a água é incolor. No entanto, ao entrar em contato com o ar,
      ocorre uma reação química rápida, responsável pela coloração vermelha intensa, semelhante à observada
      na ferrugem e no tom avermelhado do sangue, associado à hemoglobina.
