  - texto: Em Memórias de Martha (1899), Julia Lopes de Almeida apresenta uma narrativa que, embora dialogue
      com a estética naturalista, introduz deslocamentos críticos significativos. Considerando a trajetória
      da protagonista no romance, assinale a alternativa que caracteriza a relação entre a forma literária
      e a crítica social na obra.
  alternativas:
    A:
      texto: A narrativa adota o determinismo ambiental rigoroso para demonstrar que a promiscuidade do
        espaço coletivo de habitação anula qualquer possibilidade de desenvolvimento individual ou preservação
        da dignidade das mulheres trabalhadoras.
    B:
      texto: A obra utiliza a estrutura do romance naturalista para celebrar a ascensão social de Martha
        como um exemplo de que o sistema educacional da época era plenamente democrático e inclusivo.
    C:
      texto: A representação da pobreza na obra é suavizada por uma perspectiva idealista e romântica,
        que ignora as tensões de classe em favor de uma visão sentimental da vida comunitária nas estalagens.
    D:
      texto: O romance limita-se a reproduzir as teorias de degenerescência racial da época, justificando
        a condição de Martha através de uma herança biológica que impede seu desenvolvimento intelectual.
    E:
      texto: O foco na precariedade urbana é uma denúncia das "vítimas do progresso", evidenciando que
        a modernidade, na virada do século XIX para o XX, no Rio de Janeiro, fundamentava-se na exclusão
        e na invisibilidade do trabalho feminino, sobretudo o doméstico.
  resposta: E
  anulada: false
  pendencias: []
- numero: 19
  disciplina: geografia
  assunto: espaco-urbano
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      Leia o excerto:
      “[...] Nesses movimentos, as transformações das cidades (de sua centralidade) e de seus centros (de seus bairros) tendem ao idêntico. Elas exibem, no processo, a necessidade de uma maior intervenção da gestão pública no espaço urbano [...].
      Do ponto de vista da centralidade, a produção do espaço da metrópole paulistana, ao longo de sua história, traz mudanças importantes. Em primeiro lugar a expansão do tecido urbano engloba subcentros (vários centros) que dividem com o centro histórico a capacidade da reunião das atividades constitutivas da vida urbana, em sociedade [...]. Mas enquanto o chamado centro histórico guarda um conteúdo que o diferencia dos outros (pela densidade e expressividade das atividades ali reunida), os centros vão compondo vários núcleos (bairros), que são lugares de funções únicas, com reunião de atividades comerciais e serviços descentralizados, destituídos de sentido como articulador da vida urbana [...]”.
      Ana Fani A. Carlos. Metamorfose do centro da metrópole de São Paulo. In A nova vida do velho centro: nas cidades portuguesas e brasileiras. Centro de Estudos de Geografia e Ordenamento Territorial. CEGOT, 2016. Adaptado.
      No texto, a autora analisa que a expansão urbana da metrópole paulistana descentraliza e organiza outros centros de serviços nos bairros. Assinale a alternativa que melhor explica como o processo de urbanização amplia a centralidade da cidade.
  alternativas:
    A:
      texto: A formação de múltiplos núcleos urbanos elimina a concentração de riqueza e poder, tornando
        a metrópole socialmente homogênea, devido à distribuição dos serviços básicos para a população
        em diferentes bairros.
    B:
      texto: A formação de novas centralidades significa que todas as áreas da metrópole passam a ter
        o mesmo nível de infraestrutura, serviços e investimentos públicos, dando um caráter hegemônico
        aos bairros e melhorando a qualidade de vida da população.
    C:
      texto: A formação de novas centralidades não impede que o centro histórico continue concentrando
        os principais serviços, infraestruturas estratégicas e instituições de poder econômico e político,
        ainda que descentralizando alguns serviços básicos para os bairros.
    D:
      texto: A existência de vários núcleos urbanos impede a formação de hierarquias espaciais dentro
        da metrópole, redefinindo o espaço urbano, melhorando a qualidade dos centros comerciais e de
        serviços para atender a população.
    E:
      texto: A expansão territorial reduz automaticamente as diferenças socioeconômicas entre centro e
        periferia, diminuindo as contradições e transferindo serviços para os bairros periféricos, formando
        uma estrutura policêntrica.
  resposta: C
  anulada: false
  pendencias: []
