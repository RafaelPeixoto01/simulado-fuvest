      “O Colégio da Bahia seja de Vossa Alteza para o favorecer porque está já bem principiado e haverá nele vinte meninos, pouco mais ou menos, e mande ao governador que faça casas para os meninos, porque as que têm são feitas por nossas mãos e são de pouca duração e mande dar alguns escravos da Guiné à casa para fazerem mantimentos porque a terra é tão fértil que facilmente se manterão e vestirão muitos meninos, se tiverem alguns escravos que façam roças de mantimentos e algodoais, e para nós não é necessário nada, porque a terra é tal que um só morador é poderoso a manter a um de nós. Para as outras capitanias mande Vossa Alteza mulheres órfãs, porque todas casarão. Nesta não são necessárias por agora, por haver muitas filhas de homens brancos e de índias da terra, as quais todas agora casarão, com a ajuda do Senhor, e se não casavam antes, era porque consentiam viver os homens em seus pecados livremente.”
      Manuel da Nóbrega. Cartas: a El-Rei D. João III – 1551. In: Manuel da Nóbrega. Cartas jesuíticas: cartas do Brasil (1549-1560). 2015.
      O relato de Manuel da Nóbrega sobre a ação religiosa no Brasil colonial indica o seguinte:
  alternativas:
    A:
      texto: O missionário recomenda que o Estado auxilie os jesuítas a prover sustento material para
        crianças do reino.
    B:
      texto: A iniciativa educacional durante o primeiro período da colonização em terras brasileiras
        era inexistente.
    C:
      texto: As mulheres nem sempre se casavam, porque, muitas vezes, queriam uma vida independente.
    D:
      texto: O envio de mulheres para aquela capitania era imprescindível.
    E:
      texto: A escravidão era um mal a ser erradicado na colônia.
  resposta: A
