- numero: 77
  disciplina: biologia
  assunto: fisiologia-humana
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      Segundo a Organização Mundial da Saúde (OMS), a prática de exercícios físicos traz diversos benefícios para a melhoria da qualidade de vida, como a produção de adaptações orgânicas que reduzem o risco de doenças crônicas. Considerando que a geração desses benefícios depende do atendimento aos princípios do treinamento, analise o caso a seguir:
      Mulher, 45 anos de idade, trabalha a maior parte do dia sentada e não tem rotina regular de exercícios. Há cerca de dois meses, passou a sentir falta de ar ao subir escadas. Para melhorar o condicionamento, iniciou aulas de sapateado aos sábados, que possuem duração de 90 minutos. Apesar de gostar das aulas, a dificuldade para respirar quando sobe escadas continua. Com base nas informações apresentadas, é correto afirmar que a aula de sapateado por 90 minutos, uma vez na semana, pode ser considerada
  alternativas:
    A:
      texto: suficiente para a melhora da resistência cardiorrespiratória, portanto a falta de fôlego
        ao subir escadas deve ter outra causa, que precisaria ser investigada.
    B:
      texto: inadequada porque o sapateado exige capacidade anaeróbia, enquanto subir escadas exige capacidade
        aeróbia.
    C:
      texto: insuficiente para melhorar a resistência cardiorrespiratória, devendo ser aumentada sua duração.
    D:
      texto: inadequada, na medida em que a continuidade da baixa resistência cardiorrespiratória indica
        que a aula de sapateado deveria ser mais intensa.
    E:
      texto: insuficiente para melhorar a resistência cardiorrespiratória, devendo ser praticada com maior
        regularidade.
  resposta: E
  anulada: false
  pendencias: []
- numero: 78
  disciplina: quimica
  assunto: equilibrio
  disciplinas_secundarias:
