  - texto: |-
      Arissana Pataxó. Indígenas em foco, 2016. MASP.
      Considerando a tensão entre a obra de Arissana Pataxó e a história das imagens de povos indígenas produzidas por olhares externos, assinale a alternativa que interpreta corretamente seu efeito crítico:
  alternativas:
    A:
      texto: 'A obra sugere uma reconciliação entre tradição e modernidade: a tecnologia realiza uma mediação
        que aproxima universos culturais distintos, reconfigurando hierarquias no ato de fotografar.'
    B:
      texto: 'A cena mantém a lógica tipificante do retrato etnográfico: os marcadores culturais prevalecem,
        sem que a posição do observado seja significativamente alterada.'
    C:
      texto: 'O foco recai sobre a técnica fotográfica: ao colocar a lente no centro, a obra privilegia
        a mediação técnica do dispositivo, deslocando a leitura da disputa de quem enuncia a imagem.'
    D:
      texto: 'A imagem opera um deslocamento de perspectiva: quem tradicionalmente era objeto do olhar
        assume a posição de enunciador, produzindo uma ruptura na lógica da representação.'
    E:
      texto: 'O sentido crítico reside no apagamento do indivíduo: ao ocultar o rosto, sugere uma coletivização
        da identidade que desloca o debate do ponto de vista para a generalização da condição indígena.'
  resposta: D
  anulada: false
