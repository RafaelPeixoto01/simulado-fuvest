  - texto: |-
      “Uma comissão especial da ONU enviada para estudar o problema palestino apresentou um plano de partilha para a região. O plano foi aceito pela Assembleia Geral das Nações Unidas em novembro de 1947, com apoio dos Estados Unidos e da União Soviética. Os membros árabes das Nações Unidas e os árabes palestinos rejeitaram-no, e, mais uma vez diante da impossibilidade de encontrar uma política que árabes e judeus aceitassem, a Grã-Bretanha decidiu retirar-se da Palestina numa data fixada, 14 de maio de 1948. À medida que ela se aproximava, a autoridade britânica inevitavelmente diminuiu sua presença e, com isso, irrompeu a luta. Isso levou à decisão dos países árabes vizinhos de intervir, e assim uma série de conflitos locais transformou-se numa guerra. A 14 de maio, a comunidade judia declarou sua independência como Estado de Israel, o que foi imediatamente reconhecido pelos Estados Unidos e pela União Soviética; e forças egípcias, jordanianas, iraquianas, sírias e libanesas avançaram sobre as partes predominantemente árabes do país. Numa situação em que não havia fronteiras fixas nem nítidas divisões de população, a luta se deu entre o novo exército israelense e os dos estados árabes, tendo Israel conseguido ocupar a maior parte do país. Por prudência, inicialmente, e depois por pânico e por causa da política deliberada do exército israelense, quase dois terços da população árabe deixou suas casas e tornou-se refugiada.”
      Albert Hourani. Uma história dos povos árabes. Tradução de Marcos Santarrita. São Paulo: Companhia das Letras (Companhia de Bolso), 2006. Adaptado.
      Com base no trecho do livro de Albert Hourani, assinale a alternativa correta acerca da criação do Estado de Israel em 1948.
  alternativas:
    A:
      texto: O plano de partilha da Palestina aprovado pela ONU em 1947 foi amplamente aceito tanto pelos
        árabes palestinos, quanto pelos Estados árabes vizinhos.
    B:
      texto: A criação do Estado de Israel ocorreu após um acordo mediado pela Grã-Bretanha, que garantiu
        fronteiras consensuais e evitou o conflito armado.
    C:
      texto: A declaração de independência de Israel ocorreu em um contexto de enfraquecimento da autoridade
        britânica.
    D:
      texto: A intervenção militar dos países árabes ocorreu apenas após a definição clara de fronteiras
        internacionais reconhecidas pela ONU.
    E:
      texto: O êxodo da população árabe palestina em 1948 deveu-se a uma decisão voluntária das lideranças
        árabes.
  resposta: C
