- numero: 63
  disciplina: biologia
  assunto: saude
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: Em novembro de 2025, a Anvisa aprovou o registro da Butantan-DV, a primeira vacina de dose
      única contra a dengue no mundo, desenvolvida pelo Instituto Butantan. Trata-se de uma vacina tetravalente
      de vírus vivo atenuado, capaz de estimular resposta imune contra os quatro sorotipos do vírus da
      dengue. O gráfico a seguir apresenta os resultados do ensaio clínico de fase III, comparando a incidência
      acumulada de dengue sintomática, confirmada virologicamente, entre o grupo que recebeu a Butantan-DV
      (Vacinado) e o grupo que recebeu uma substância inerte (placebo), ao longo de aproximadamente dois
      anos de acompanhamento. Os dados demonstram eficácia vacinal significativa na redução dos casos
      sintomáticos.
  - figura: q063-1.webp
  - texto: |-
      Disponível em: Figura 2 DOI: 10.1056/NEJMoa2301790. Adaptado.
      Com base na interpretação do gráfico e nos conhecimentos sobre mecanismos de ação das vacinas, assinale a alternativa correta.
  alternativas:
    A:
      texto: A diferença progressiva entre os valores dos dois grupos indica que a vacina elimina completamente
        o vírus da dengue no organismo do vacinado, impedindo qualquer forma de infecção. Isso explica
        a incidência do grupo vacinado permanecer próxima de zero durante todo o período de acompanhamento
        do ensaio clínico.
    B:
      texto: A eficácia vacinal demonstrada no gráfico significa que, no grupo vacinado, a maioria dos
        participantes desenvolveu anticorpos detectáveis, enquanto no grupo placebo nenhum participante
        apresentou qualquer tipo de resposta imunológica, conforme evidenciado pela diferença de incidência
        acumulada observada entre os dois grupos ao longo do seguimento.
    C:
      texto: Por ser uma vacina de vírus vivo atenuado, a Butantan-DV introduz formas enfraquecidas dos
        quatro sorotipos virais, estimulando o sistema imune adaptativo a produzir anticorpos e células
        de memória. Isso reduz, mas não elimina totalmente, a probabilidade de dengue sintomática, fato
        coerente com os dados do grupo vacinado.
    D:
      texto: A incidência acumulada mais elevada no grupo placebo demonstra que a substância inerte administrada
        provocou diretamente a doença nos participantes, funcionando como controle positivo do estudo.
        A vacina, por sua vez, atuou como controle negativo, sendo responsável pela menor incidência observada
        em seu grupo.
    E:
      texto: Como a vacina é de vírus vivo atenuado, seu mecanismo de proteção baseia-se exclusivamente
        na produção de anticorpos pela imunidade inata, dispensando qualquer ativação do sistema imune
        adaptativo. Esse mecanismo seria suficiente para explicar a menor incidência acumulada de dengue
        sintomática observada no grupo vacinado.
  resposta: C
  anulada: false
  pendencias: []
