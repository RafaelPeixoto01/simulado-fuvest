- numero: 66
  disciplina: biologia
  assunto: citologia
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      As membranas biológicas desempenham papel central na organização e no funcionamento das células. A presença de um sistema de endomembranas, com organelas delimitadas por bicamada lipídica simples ou dupla, constitui uma das principais características que diferenciam células eucarióticas de procarióticas, com consequências diretas sobre o metabolismo, o modo de vida parasitário de diversos organismos e a lógica de ação de fármacos.
      Considerando esses aspectos, assinale a alternativa correta.
  alternativas:
    A:
      texto: Células procarióticas possuem membrana plasmática, porém a ausência de endomembranas impede
        a realização de qualquer via metabólica aeróbia, razão pela qual todos os procariontes são anaeróbios
        obrigatórios e dependem de processos fermentativos para a obtenção de energia a partir de substratos
        orgânicos.
    B:
      texto: O parasitismo ocorre em organismos que carecem de compartimentalização interna por endomembranas,
        pois a ausência de organelas próprias torna o organismo dependente da maquinaria metabólica do
        hospedeiro.
    C:
      texto: A compartimentalização por endomembranas nas células eucarióticas possibilita que reações
        metabólicas com exigências físico-químicas distintas ocorram simultaneamente em compartimentos
        separados.
    D:
      texto: As células procarióticas compensam a ausência de núcleo delimitado por membrana por meio
        de um sistema endomembranoso rudimentar análogo ao retículo endoplasmático, no qual concentram
        a transcrição do DNA e a síntese de proteínas destinadas à exportação para o meio extracelular.
    E:
      texto: Células procarióticas e eucarióticas apresentam grau equivalente de compartimentalização
        interna por membranas, diferindo fundamentalmente apenas no tamanho celular e na composição química
        da parede celular, característica que está presente em todos os representantes de ambos os grupos.
  resposta: C
  anulada: false
  pendencias: []
