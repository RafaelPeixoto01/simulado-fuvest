  - texto: |-
      A mobilização criada em torno da enfermagem durante a II Guerra Mundial no Brasil fez com que muitas imagens diferentes fossem produzidas sobre a enfermagem e as enfermeiras. É evidente que esta escolha, como um dos emblemas em torno do qual o Estado Novo constituiu um ideal de mulher e de mobilização das mulheres, intensificada com a guerra, não foi casual.
      Roney Cytrynowicz. Guerra sem guerra. A mobilização e o cotidiano em São Paulo durante a Segunda Guerra Mundial. São Paulo: Geração Editorial/EDUSP, 2000. Adaptado.
      O emprego da propaganda para moldar comportamentos e construir ideais de cidadania foi amplamente usado pelo Estado Novo. No contexto da Segunda Guerra Mundial, a construção da imagem da enfermeira foi mobilizada pelo regime para
  alternativas:
    A:
      texto: incentivar a autonomia política feminina e o sufrágio universal pleno, desvinculado da imagem
        doméstica e paternalista.
    B:
      texto: substituir a mão de obra masculina nas indústrias de base, focando na enfermagem como um
        treinamento técnico secundário.
    C:
      texto: promover a subordinação da sociedade ao Estado Novo por meio de políticas de saúde, saneamento
        e controle de natalidade.
    D:
      texto: criar um símbolo de coesão nacional e engajamento cívico, utilizando as enfermeiras como
        ferramentas de propaganda política.
    E:
      texto: converter o sacerdócio da caridade em uma profissão associada à defesa nacional, rompendo
        com práticas e hierarquias militares.
  resposta: D
  anulada: false
  pendencias: []
