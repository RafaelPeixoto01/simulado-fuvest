  texto_base: null
  enunciado:
  - texto: 'Casos de intoxicação humana por metanol estão geralmente associados ao consumo de bebidas
      alcoólicas adulteradas. No organismo, o metanol ingerido segue dois caminhos principais: eliminação
      na forma inalterada, que apresenta baixa toxicidade, e transformação metabólica em formaldeído e
      ácido fórmico, substâncias muito tóxicas, pela enzima álcool desidrogenase (ADH). Em casos de intoxicação,
      o tratamento consiste na administração de etanol ou fomepizol que competem com o metanol pela ADH
      disponível, reduzindo sua transformação metabólica e favorecendo sua eliminação na forma inalterada.
      O tratamento com fomepizol é mais eficiente do que com etanol. A figura a seguir mostra a quantidade
      de metanol eliminado na forma inalterada, em função do tempo, para três pacientes que ingeriram
      a mesma quantidade da mesma bebida adulterada, sendo um paciente sem tratamento, um tratado com
      etanol e um tratado com fomepizol.'
  - figura: q062-1.webp
  - texto: Assinale a alternativa que relaciona corretamente os pacientes 1, 2 e 3 aos tratamentos administrados
      e identifique a substância com maior afinidade pela ADH.
  alternativas:
    A:
      texto: 'Paciente 1: fomepizol; Paciente 2: etanol; Paciente 3: sem tratamento; maior afinidade com
        a ADH: fomepizol.'
    B:
      texto: 'Paciente 1: etanol; Paciente 2: sem tratamento; Paciente 3: fomepizol; maior afinidade com
        a ADH: etanol.'
    C:
      texto: 'Paciente 1: sem tratamento; Paciente 2: fomepizol; Paciente 3: etanol; maior afinidade com
        a ADH: metanol.'
    D:
      texto: 'Paciente 1: fomepizol; Paciente 2: sem tratamento; Paciente 3: etanol; maior afinidade com
        a ADH: metanol.'
    E:
      texto: 'Paciente 1: sem tratamento; Paciente 2: etanol; Paciente 3: fomepizol; maior afinidade com
        a ADH: fomepizol.'
