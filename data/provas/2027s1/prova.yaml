  - texto: |-
      Certas narrativas convidam o leitor a acompanhar a trama dos acontecimentos, buscando nela as relações de causa e efeito que acabam por produzir sentido ao desfecho proposto.
      Em A paixão segundo G.H., G.H. propõe outro jogo ao leitor: acompanhá-la no processo de busca de algum tipo possível de elaboração dos fragmentos de linguagem que se acumulam na experiência existencial do indivíduo singular. Nesse processo de organização, explicita-se um diálogo entre narradora e leitor, como se observa em:
  alternativas:
    A:
      texto: “A verdade não faz sentido, a grandeza do mundo me encolhe. Aquilo que provavelmente pedi
        e finalmente tive, veio, no entanto me deixar carente como uma criança que anda sozinha pela terra.”
    B:
      texto: '“O mundo havia reivindicado a sua própria realidade, e, como depois de uma catástrofe, a
        minha civilização acabara: eu era apenas um dado histórico. Tudo em mim fora reivindicado pelo
        começo dos tempos e pelo meu próprio começo.”'
    C:
      texto: “Toda a parte mais inatingível de minha alma e que não me pertence - é aquela que toca na
        minha fronteira com o que já não é eu, e à qual me dou. Toda a minha ânsia tem sido esta proximidade
        inultrapassável e excessivamente próxima. Sou mais aquilo que em mim não é.”
    D:
      texto: “Não estou à altura de imaginar uma pessoa inteira porque não sou uma pessoa inteira. E como
        imaginar um rosto se não sei de que expressão de rosto preciso? Logo que puder dispensar tua mão
        quente, irei sozinha e com horror.”
    E:
      texto: “Esse murmúrio, sem nenhum sentido humano, seria a minha identidade tocando na identidade
        das coisas. Sei que, em relação ao humano, essa prece neutra seria uma monstruosidade.”
  resposta: D
