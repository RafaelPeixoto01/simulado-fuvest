  enunciado:
  - texto: |-
      Leia o excerto:
      “O saneamento básico no Brasil não é somente um desafio técnico ou orçamentário: trata-se de uma profunda ferida social que revela um país ainda marcado por desigualdades históricas, racismo estrutural e negligência institucional: simboliza a continuidade de um modelo excludente que desumaniza populações inteiras com base em sua origem étnica e localização geográfica.
      O acesso à coleta e tratamento de esgotos; água potável; e a coleta e destinação adequada de resíduos sólidos não podem ser desvinculados dos direitos humanos fundamentais [...]. A prova disso é que os locais onde vivem as populações em processo de vulnerabilização social são os que mais carecem dos serviços de saneamento básico...
      Mas quando adicionamos à equação a dimensão racial, o cenário se agrava, pois, as populações negras, quilombolas, indígenas e ribeirinhas são desproporcionalmente mais afetadas pelas mazelas ambientais e urbanas — não somente por ações diretas, mas também por omissões sistemáticas do poder público.
      Como bem aponta Milton Santos, essa lógica é também espacial: o território é usado como marcador de exclusão. A periferia urbana e a zona rural se tornam territórios de sacrifício, nos quais o Estado age menos — ou age em favor do capital, promovendo deslocamentos forçados e negligência institucional.”
      Saneamento: assim age o racismo ambiental na Amazônia. Disponível em: https://namidia.fapesp.br/. Adaptado.
      O excerto analisa problemas socioambientais que caracterizam, respectivamente,
  alternativas:
    A:
      texto: racismo ambiental e segregação socioespacial.
    B:
      texto: densidade demográfica e elevadas temperaturas.
    C:
      texto: desconforto térmico e racismo ambiental.
    D:
      texto: urbanização e desconforto térmico.
    E:
      texto: racismo ambiental e urbanização.
  resposta: A
