  enunciado:
  - texto: "Deseja-se projetar uma rodovia retilínea \U0001D45F de maneira que passe pelos pontos \U0001D434(2,3)
      e \U0001D435(14,9) em um mapa (escala em km). Uma torre de transmissão está localizada no ponto
      \U0001D437(10,6), que representa o centro da torre, e tem um raio de alcance de 5 km, definindo
      uma área circular \U0001D436. Para realizar a manutenção dessa torre, uma estrada de serviço \U0001D460,
      também retilínea, deve ser construída de maneira que seja perpendicular à rodovia \U0001D45F, partindo
      do centro da torre \U0001D437. Com base nessas informações, analise as seguintes afirmações:\nI.
      A equação reduzida da reta \U0001D45F que representa a rodovia é: \U0001D466 = (1/2)\U0001D465 +
      2\nII. A distância entre os pontos \U0001D434 e \U0001D435 é 6√5 km.\nIII. A rodovia \U0001D45F
      intercepta a área circular \U0001D436 em dois pontos distintos.\nIV. A equação da reta que representa
      a estrada de serviço \U0001D460 perpendicular à rodovia \U0001D45F que passa por \U0001D437 é: \U0001D466
      = −2\U0001D465 + 26\nV. A equação da circunferência que representa a área de circular \U0001D436
      é: (\U0001D465 − 10)² + (\U0001D466 − 6)² = 25\nAssinale a alternativa correta."
  alternativas:
    A:
      texto: Apenas I, II e V são verdadeiras.
    B:
      texto: Apenas II, III e V são verdadeiras.
    C:
      texto: Apenas I, III e IV são verdadeiras.
    D:
      texto: Apenas II, IV e V são verdadeiras.
    E:
      texto: Todas as afirmações são verdadeiras.
  resposta: E
  anulada: false
  pendencias: []
