  enunciado:
  - texto: A figura a seguir representa esquematicamente os compostos orgânicos isômeros de posição orto-nitrofenol
      (2-nitrofenol) e para-nitrofenol (4-nitrofenol). No primeiro, a posição dos grupos funcionais hidroxila
      (–OH) e nitro (–NO₂) possibilita a formação de ligações de hidrogênio intramoleculares, ou seja,
      dentro da própria molécula, o que reduz a disponibilidade do grupo hidroxila para a formação de
      ligações de hidrogênio intermoleculares, isto é, com outras moléculas. Já no segundo, os grupos
      funcionais estão mais distantes, e a geometria da molécula não possibilita a formação de ligação
      de hidrogênio intramolecular.
  - figura: q060-1.webp
  - texto: Com base nos conceitos de ligações químicas e em suas consequências sobre propriedades físicas,
      assinale a alternativa correta.
  alternativas:
    A:
      texto: O orto- e o para-nitrofenol apresentam propriedades físicas idênticas, pois possuem a mesma
        fórmula molecular e os mesmos grupos funcionais.
    B:
      texto: No orto-nitrofenol, a presença de ligação de hidrogênio intramolecular aumenta a capacidade
        da molécula de interagir por ligações covalentes com a água.
    C:
      texto: O para-nitrofenol possui maior ponto de ebulição que o orto-nitrofenol, uma vez que nele
        predominam ligações de hidrogênio intermoleculares.
    D:
      texto: No orto-nitrofenol, a formação de ligação de hidrogênio intramolecular impede completamente
        a ocorrência de interações intermoleculares entre as moléculas.
    E:
      texto: O orto-nitrofenol é mais solúvel em água que o para-nitrofenol, pois a ligação de hidrogênio
        intramolecular aumenta a polaridade da molécula.
  resposta: C
  anulada: false
  pendencias: []
- numero: 61
