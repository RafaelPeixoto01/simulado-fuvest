  - texto: 'A tabela a seguir indica o número de inscritos no Exame Nacional do Ensino Médio (ENEM) entre
      2010 e 2016 segundo a cor/raça, definidas por autodeclaração, bem como a sua variação:'
  - figura: q016-1.webp
  - texto: |-
      A. Senkevics. De Brancos para Negros? Uma Análise Longitudinal da Reclassificação Racial no Enem 2010-2016. Adaptado.
      Sobre a formação e reconfiguração racial, Winant sugere:
      “A teoria da formação racial sugere que o padrão de significados raciais e identidades raciais identificáveis, as dimensões raciais da desigualdade social, o grau de mobilização política baseada na raça, tudo isto manifesta instabilidade e flexibilidade. Portanto, num momento específico de uma certa sociedade, a raça pode parecer fenômeno quase ‘natural’, aproblemático e apolítico, apenas uma questão de ‘senso comum’, noutro momento ou contexto social, a raça pode ser altamente politizada, como lócus de mobilização social significativa.”
      H. Winant. Repensar a Raça no Brasil. Sociedade e Estado, 1994. Adaptado.
      Tendo em vista o argumento de Winant e os dados apresentados, é possível afirmar que o aumento de inscritos no ENEM que se autodeclaram como pretos deve-se, entre outros fatores,
  alternativas:
    A:
      texto: a um crescimento demográfico relativo de pessoas da cor/raça preta na população brasileira
        e ao aumento do número de concluintes pretos no Ensino Médio.
    B:
      texto: à diminuição do número absoluto de brancos entre concluintes do Ensino Médio e postulantes
        a uma vaga no Ensino Superior, que se tornam mais heterogêneos.
    C:
      texto: a um aumento da autoidentificação de candidatos como pretos, o que reflete a ressignificação
        e mobilização social e política dessa categoria racial.
    D:
      texto: ao aumento de vagas no Ensino Superior e à crescente adoção de políticas de cotas raciais
        para pretos e pardos por Instituições de Ensino Superior.
    E:
      texto: à despolitização da categoria de raça, que normaliza a categoria preto, aumentando suas oportunidades
        educacionais e fomentando que mais candidatos se assumam como tal.
  resposta: C
  anulada: false
