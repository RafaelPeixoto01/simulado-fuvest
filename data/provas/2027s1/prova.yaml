  - texto: Em Caminho de pedras (1937), Rachel de Queiroz desloca o foco do regionalismo rural para a
      militância política urbana. No entanto, a obra não se limita ao panfleto ideológico, construindo
      uma tensão constante entre a disciplina do partido e a subjetividade da protagonista Noemi. Assinale
      a alternativa que descreve corretamente como esse conflito é representado na narrativa.
  alternativas:
    A:
      texto: O romance de Rachel de Queiroz abandona a crítica social da Literatura de 1930 para focar
        em um drama passional de triângulo amoroso, despolitizando as relações de classe em favor do psicologismo.
    B:
      texto: A subjetividade feminina é apresentada como um obstáculo reacionário que impede o avanço
        da causa proletária, sendo a narrativa um libelo contra o individualismo burguês encarnado por
        Noemi.
    C:
      texto: O conflito central reside na impossibilidade de conciliar a militância política, focada no
        coletivo, com os dramas individuais e maternais de Noemi, expondo a fragilidade do projeto político
        diante da complexidade do desejo e da culpa.
    D:
      texto: A obra adere à estética do realismo socialista, retratando Noemi como a heroína infalível
        que sacrifica sua vida pessoal em favor da revolução, sem hesitações ou conflitos internos.
    E:
      texto: A organização política do partido é celebrada como a única via de cura para as neuroses femininas,
        sugerindo que a organização coletiva elimina as angústias do exílio doméstico vivido por Noemi
        no início da obra.
  resposta: C
  anulada: false
  pendencias: []
