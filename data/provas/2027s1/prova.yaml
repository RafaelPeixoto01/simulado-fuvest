  enunciado:
  - texto: |-
      Uma das hipóteses para explicar a orientação espacial de animais com percursos migratórios longos como tartarugas marinhas é a de que eles possuem cristais de magnetita (Fe₃O₄) em seus tecidos, permitindo que esses animais detectem variações na direção do campo magnético da Terra próximo à superfície (vide figura). Em um experimento (Lohmann e Lohmann (1994)), filhotes de tartaruga-cabeçuda (Caretta caretta) foram expostos a um campo magnético de módulo 50 μT e diferentes ângulos de inclinação vertical em relação à superfície. Quando a inclinação era de 60º, as tartarugas interpretavam estar muito ao norte e mudavam sua rota para o sul. Quando a inclinação era de 30º, sentiam estar muito ao sul e ajustavam sua rota ao norte.
      Lohmann e Lohmann, Detection of magnetic inclination angle by sea turtles: a possible mechanism for determining by sea turtles. J. Exp. Biol. 194, 23–32 (1994).
  - figura: q038-1.webp
  - texto: |-
      Disponível em https://www.pnas.org/doi/10.1073/pnas.0801859105.
      Qual a variação (em valor absoluto) na componente do campo magnético vertical à superfície da Terra entre os dois ângulos de inclinação utilizados no experimento?
  - texto: |-
      Note e adote:
      sen 60º = cos 30° = √3/2 ≈ 0,866
      sen 30º = cos 60º = 1/2
  alternativas:
    A:
      texto: 18,3 μT
    B:
      texto: 25 μT
    C:
      texto: 43,3 μT
    D:
      texto: 50 μT
    E:
      texto: 100 μT
  resposta: A
  anulada: false
  pendencias: []
