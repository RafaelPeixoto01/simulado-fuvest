  - texto: |-
      O javali foi introduzido no Brasil por ação humana e, hoje, suas populações causam fortes impactos ambientais, sobretudo na Mata Atlântica. Os javalis revolvem intensamente o solo durante a busca por alimento e apresentam dieta generalista, consumindo frutos, sementes, raízes, invertebrados e pequenos vertebrados. Espécies nativas de animais como cutias, quatis, tatus e pequenos marsupiais utilizam parte desses mesmos recursos alimentares. Em algumas áreas, o javali pode integrar a dieta de grandes predadores nativos, como a onça.
      Considerando a estrutura de cadeias e teias tróficas, assinale a alternativa correta.
  alternativas:
    A:
      texto: A redução de invertebrados do solo causada pelo javali interfere na decomposição da matéria
        orgânica, mas não afeta demais consumidores da cadeia trófica.
    B:
      texto: Efeitos do javali sobre a teia trófica são limitados, pois a presença de vários consumidores
        generalistas reduz possíveis alterações provocadas por sua introdução na quantidade de organismos
        em cada nível da cadeia alimentar.
    C:
      texto: A competição entre javalis e cutias por frutos tende a aumentar a disponibilidade de sementes
        no solo, pois a sobreposição de dieta favorece dispersão mais eficiente.
    D:
      texto: A predação de invertebrados pelo javali pode reduzir a abundância de consumidores secundários
        insetívoros, alterando a transferência de energia para níveis tróficos superiores.
    E:
      texto: A incorporação do javali como presa da onça-pintada tende a neutralizar seus impactos na
        comunidade, pois a predação restabelece o controle trófico sobre a espécie invasora.
