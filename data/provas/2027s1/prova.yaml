      coeficientes reais maiores do que 1 e \U0001D465 ≥ \U0001D450/\U0001D44F.\nConsiderando a função
      \U0001D454: ℝ⁺ → ℝ, definida por \U0001D454(\U0001D465) = \U0001D465^0,5, pode-se afirmar que, partindo
