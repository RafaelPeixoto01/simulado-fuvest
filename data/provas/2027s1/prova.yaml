      dos reservatórios. Pesquisadores brasileiros elaboraram um modelo matemático que contribui para
      controlar o volume de água dos reservatórios, reduzindo problemas na distribuição de água. O estudo
      indicou que mudanças nas regras de operação poderiam aumentar o volume mínimo de água armazenada.
      Uma das equações apresentadas pelos pesquisadores calcula a vazão de água de uma turbina em função
      de constantes e outras variáveis, como o nível de água do reservatório e a área de abertura da turbina.
