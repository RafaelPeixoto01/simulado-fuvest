  enunciado:
  - texto: |-
      “Vê-se que o essencial gira em torno do ‘feudo’. A palavra aparece no oeste da Alemanha no início do século XI e se difunde sob sua aceitação técnica no final desse século, não sendo empregada por toda parte nem sempre nesse sentido exato. É mais um termo dos juristas e historiadores modernos do que um vocábulo da época. O mais importante é que o feudo é mais frequentemente uma terra. Isso assenta o feudalismo sobre sua base rural e manifesta que ele é antes de tudo um sistema de posse e de exploração da terra. A concessão do feudo pelo senhor ao vassalo faz-se no decorrer de uma cerimônia, a investidura, que consistia num ato simbólico, na entrega de um objeto (estandarte, cetro, bastão, anel, punhal, luva, pedaço de palha etc.). Em geral ela seguia o apalavramento e a homenagem. Só excepcionalmente foi consignada em ata escrita antes do século XIII. Feudalismo, mundo do gesto, não do escrito. O que garante a ascendência crescente do vassalo sobre seu feudo e, evidentemente, a hereditariedade do feudo, peça central do sistema feudal.”
      Jacques Le Goff. A civilização do Ocidente medieval. Petrópolis: Vozes, 2016.
      De acordo com o excerto, sobre a sociedade medieval, é correto dizer que
  alternativas:
    A:
      texto: o sistema feudal, na Europa, foi predominante em toda a Idade Média.
    B:
      texto: os feudos nas cidades foram fundamentalmente hereditários.
    C:
      texto: as cerimônias, os rituais e os compromissos públicos, no feudalismo, eram predominantemente
        orais.
    D:
      texto: a concessão do feudo implicava o firmamento de um contrato escrito.
    E:
      texto: o termo “feudo” era usado na Europa medieval como sinônimo de propriedade privada.
  resposta: C
  anulada: false
  pendencias: []
