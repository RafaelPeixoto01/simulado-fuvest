      Leia o excerto:
      “Os mapas serão considerados como parte integrante da família mais abrangente das imagens carregadas de um juízo de valor, deixando de ser percebidos essencialmente como levantamentos inertes de paisagens morfológicas ou como reflexos passivos do mundo dos objetos. Eles são considerados imagens que contribuem para o diálogo num mundo socialmente construído. Nós distinguimos assim a leitura dos mapas da crítica cartográfica tradicional e de oposições binárias entre mapas “verdadeiros e falsos”, “exatos e inexatos”, “objetivos e subjetivos”, “literais e simbólicos”, baseados na “integridade científica” ou marcados por uma “deformação ideológica”.
      B. Harley. Mapas, saber e poder. Confins, 2009. Adaptado.
      A partir do excerto, pode-se afirmar que o autor entende o mapa como uma linguagem porque
  alternativas:
    A:
