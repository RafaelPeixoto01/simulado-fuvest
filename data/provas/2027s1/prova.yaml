  - texto: |-
      “A disputa entre Venezuela e Guiana pelo território de Essequibo dura mais de 1 século. O local tem 160 mil km² e representa 74% do território da Guiana. É rica em petróleo, minerais e tem saída para o Oceano Atlântico. O presidente venezuelano, Nicolás Maduro, convocou um referendo sobre a anexação da área em 10 de novembro (2023), afirmando que, na ocasião, os venezuelanos decidirão ‘democraticamente o seu futuro e o seu destino’. O governo da Guiana classificou a medida como provocativa, ilegal, nula e sem efeito jurídico internacional. Também acusou o líder venezuelano de crime internacional ao tentar enfraquecer a integridade territorial do Estado soberano da Guiana. O país defende o Tratado de Washington de 1897 e o Laudo de Paris de 1899, que determinaram a área como pertencente à Guiana, que era uma colônia britânica na época, e delimitaram a linha fronteiriça do território.”
      Disponível em: https://www.poder360.com.br/. Adaptado.
      Sobre a formação histórica do conflito entre Venezuela e Guiana e seus desdobramentos geopolíticos, é correto afirmar:
  alternativas:
    A:
      texto: A atual reivindicação venezuelana baseia-se em acordos firmados entre a Espanha e o Reino
        Unido na década de 1890, tendo o Brasil atuado como árbitro da disputa.
    B:
      texto: A definição das fronteiras entre Venezuela e Guiana foi estabelecida consensualmente no Congresso
        do Panamá (1826), não tendo sido posteriormente questionada por nenhuma das partes.
    C:
      texto: O território do Essequibo foi reconhecido internacionalmente como parte integrante da Venezuela
        pela Organização dos Estados Americanos (OEA), atendendo a um pedido do então presidente venezuelano,
        Nicolás Maduro, em 2023.
    D:
      texto: A controvérsia recente evidencia a primazia de mecanismos jurídicos internacionais consensuais,
        cuja efetividade tem sido reconhecida por ambas as partes como via legítima e suficiente de resolução
        do litígio.
    E:
      texto: A disputa pelo Essequibo remonta às indefinições fronteiriças herdadas da dissolução da Capitania
        Geral da Venezuela e à expansão britânica sobre a Guiana, ambas no século XIX, culminando no Laudo
        Arbitral de Paris (1899).
  resposta: E
  anulada: false
