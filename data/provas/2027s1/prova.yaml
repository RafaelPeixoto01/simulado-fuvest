- numero: 22
  disciplina: fisica
  assunto: fisica-moderna
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      A produção de energia a partir de fontes renováveis continua a crescer no mundo todo. De acordo com estimativas da Agência Internacional de Energia, 450 GW de nova energia verde seriam instalados em todo o mundo até o final de 2023, dos quais dois terços seriam provenientes de sistemas fotovoltaicos. Esses sistemas funcionam com os módulos fotovoltaicos que convertem a energia recebida do sol em energia elétrica.
      A radiação solar direta que atinge a superfície da Terra, em um dia claro ao meio-dia, contém um fluxo de aproximadamente 3,0×10²¹ fótons por segundo por metro quadrado. O comprimento de onda dominante dessa radiação está em torno de 550 nanômetros (nm).
      Considere um painel fotovoltaico com área de 2,0 m² sob incidência de radiação solar. A eficiência quântica do dispositivo, definida como a razão entre o número de elétrons coletados e o número de fótons incidentes, é de 20%. Qual é a potência elétrica aproximada gerada e como essa eficiência impacta o desempenho do sistema?
  - texto: "Note e adote:\nCada fóton tem energia diretamente proporcional ao produto da constante de
      Planck (ℎ) pela velocidade da luz (\U0001D450) e inversamente proporcional ao comprimento de onda
      da luz (λ), ou seja, \U0001D438 = ℎ\U0001D450/λ.\nConstante de Planck: ℎ = 6,6 × 10⁻³⁴ J × s\nVelocidade
      da luz: \U0001D450 = 3,0 × 10⁸ m/s\nPotência é definida como a quantidade de energia por intervalo
      de tempo, isto é, \U0001D443 = \U0001D438/∆\U0001D461."
  alternativas:
    A:
      texto: Exatamente igual a 432 W. A eficiência de 20% significa que um quinto da energia luminosa
        total é convertida diretamente em eletricidade, sem perdas de calor.
    B:
      texto: No máximo igual a 432 W. Apenas 20% dos fótons geram elétrons. Parte da energia de cada fóton
        é dissipada e transformada em calor, aquecendo o painel.
    C:
      texto: Exatamente igual a 2160 W. De acordo com a lei da conservação de energia, toda a luz que
        atinge o painel deve ser transformada em eletricidade para ser usada na casa.
    D:
      texto: Menor que 2160 W. A eficiência de 20% aplica-se apenas à metade do painel que está diretamente
        voltada para o sol ao meio-dia.
    E:
      texto: Exatamente igual a 0 W. O efeito fotovoltaico somente funciona em laboratórios com luzes
        especiais (lasers) e não pode ser produzido pela luz do sol comum.
  resposta: B
  anulada: false
  pendencias: []
- numero: 23
