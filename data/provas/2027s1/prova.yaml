  - texto: |-
      Além das dificuldades para o reconhecimento internacional, as novas repúblicas nascidas nas regiões outrora colonizadas pelos espanhóis tiveram suas economias profundamente afetadas pelos muitos anos de guerra. [...]
      Não bastassem as dificuldades com o erário, desde muito cedo, conflitos sociais e étnicos ganharam destaque.
      Valdir dos Santos. Independências na América Latina. São Paulo: Contexto, 2025.
      As dificuldades mencionadas no texto e enfrentadas pelas ex-colônias espanholas na América demonstram
  alternativas:
    A:
      texto: a dependência dos novos países em relação aos Estados Unidos, que controlavam os países da
        América.
    B:
      texto: o rompimento brusco da condição colonial, cujas bases sociais foram destruídas imediatamente.
    C:
      texto: a impossibilidade de ampliar as relações comerciais com a Inglaterra, cujo interesse estava
        voltado para o Oriente.
    D:
      texto: a complexa constituição dos novos Estados, que passaram a ser controlados pelas elites criollas.
    E:
      texto: o impasse provocado pelo fim do pacto comercial, que ampliava o mercado para os produtos
        coloniais.
  resposta: D
  anulada: false
