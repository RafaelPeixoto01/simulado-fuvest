  - texto: |-
      Árvores que choram
      Na Cidade Universitária da USP, em algumas épocas do ano, pode-se observar gotas que caem de algumas árvores. Esse fenômeno é resultado de uma interação de insetos hemípteros com as árvores. Eles se alimentam da seiva das árvores, composta por água, açúcar e outras substâncias como aminoácidos. Ao sugar a seiva, absorvem os compostos nitrogenados e expelem o açúcar e água em excesso. Os hemípteros chegam às árvores sozinhos ou carregados por algumas espécies de formigas, que têm o comportamento de levá-los, defendê-los, e usufruem do produto açucarado.
  - figura: q069-1.webp
