  - texto: |-
      Do pouco que havemos expendido relativamente às qualidades naturais da mulher indígena, queremos concluir que ela é digna de ocupar outra posição em nossa terra; e que o desprezo com que foi sempre e continua a ser olhada a sua raça pelas nossas outras populações é um abuso antinacional, anticristão, que os nossos governantes e o nosso clero devem fazer desaparecer, empregando, por bem da pátria e da igreja, meios mais próprios e seguros para consegui-lo. A humanidade e a civilização reclamam imperiosamente deles convenientes medidas para arrancar essa pura, digna porção do povo brasileiro à vida em que vegeta, e torná-la útil como incontestavelmente pode ser a uma e a outra. Oferecendo o nosso mesquinho óbolo¹ à nobre causa das nossas aborígenes, temos concluído os pontos principais que fazem o objeto deste opúsculo.
      ¹óbolo: pequeno donativo feito aos pobres; esmola.
      Nísia Floresta. Opúsculo Humanitário.
      Considerando o excerto, a autora
  alternativas:
    A:
      texto: sugere que a mulher indígena deve ser completamente integrada à cultura europeia, abandonando
        suas raízes e tradições para se tornar útil à pátria.
    B:
      texto: defende que o desprezo pelas mulheres indígenas é um abuso, tanto em termos nacionais quanto
        cristãos, e que os governantes e o clero devem adotar medidas eficazes para melhorar a situação
        dessa população.
    C:
      texto: faz uma crítica voltada para a opressão que as mulheres indígenas sofrem por parte de outras
        etnias, sem considerar o impacto das normas coloniais sobre os próprios colonizadores.
    D:
      texto: considera que as mulheres indígenas já estão integradas e respeitadas o suficiente pela sociedade
        brasileira, prescindindo de reformas para melhorar sua situação.
    E:
      texto: argumenta que a opressão das mulheres indígenas é um fenômeno isolado, sem relação com outras
        formas diversas de discriminação sofridas por outros grupos marginalizados no Brasil.
  resposta: B
  anulada: false
