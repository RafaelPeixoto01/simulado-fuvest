  - texto: Quando estudamos a geometria do Globo terrestre, temos que a menor distância entre dois pontos
      na superfície da Terra é realizada por um arco de grande círculo que passa pelo centro do planeta.
      Esse conhecimento é essencial para a aviação, pois ao usar a rota ortodrômica (arco de círculo máximo)
      minimiza-se o consumo de combustível, maximizando a eficiência operacional. Considere que um avião
      quer fazer uma viagem entre as cidades de Turim (Itália) e Montreal (Canadá), que se encontram aproximadamente
      na mesma Latitude, 45° Norte, e que a diferença na Longitude pode ser considerada, aproximadamente,
      para fins de cálculos, 90°.
