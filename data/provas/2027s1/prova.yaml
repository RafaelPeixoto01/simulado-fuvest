      Leia o trecho da reportagem a seguir:
      “Nesta semana, agricultores franceses voltaram a ocupar as ruas em protesto contra o acordo. Cerca de 350 tratores invadiram a icônica avenida Champs-Élysées, em Paris, e acamparam nas proximidades do edifício do Parlamento.
      Os protestos refletem um profundo mal-estar no setor agrícola francês com a assinatura do acordo entre a União Europeia (U.E.) e o Mercosul, no dia 17 de janeiro de 2026, que foi vista como a gota d’água. Especialistas concordam que as diferenças nas regras sanitárias e de bem-estar animal entre o bloco do Mercosul e o europeu são significativas. Na União Europeia, há normas rígidas sobre rastreabilidade, uso de pesticidas, hormônios e bem-estar animal.
      Há receio de que produtos importados não cumpram padrões equivalentes, mas ainda assim concorram em preço, um ponto que gera rejeição tanto entre produtores quanto entre consumidores. [...] Mas, para muitos analistas, o acordo do Mercosul é mais estratégico do que macroeconômico e ajudaria a reduzir a influência chinesa na região.”
      Disponível em: bbc.com/portuguese/articles/. Adaptado.
      Considerando o contexto do acordo comercial entre União Europeia e Mercosul e a posição do Brasil na economia internacional, assinale a alternativa correta.
  alternativas:
    A:
      texto: O acordo tende a fortalecer prioritariamente a indústria alimentícia brasileira, estimulando
        a indústria de base, reduzindo o peso das exportações agrícolas e garantindo o baixo custo e a
        qualidade.
    B:
      texto: Os protestos indicam que o tratado ampliará a produção de alimentos da U.E., alterando as
        regras sanitárias, aumentando os preços dos alimentos e das máquinas agrícolas que terão custo
        maior.
    C:
      texto: Os protestos refletem mudanças na maneira de comercializar os produtos do Mercosul, devido
        à maior concorrência pelos baixos custos de produção e a normas ambientais menos rigorosas, reforçando
        o perfil agroexportador brasileiro.
    D:
      texto: O acordo promove desenvolvimento industrial equivalente entre Europa e América do Sul, como
        política macroeconômica estratégica para enfrentar a economia chinesa, garantindo baixo custo
        dos alimentos e o perfil agroexportador.
    E:
      texto: A assinatura do tratado coloca o Brasil em destaque nas exportações agrícolas brasileiras,
        mesmo tendo um parque industrial importante, deixando de ter uma posição de agroexportador e garantindo
        baixo custo dos alimentos.
  resposta: C
