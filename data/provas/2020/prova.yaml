      É de grande relevância aqui o fato de que uma grande proporção do trânsito de internet do mundo passa pelos Estados Unidos (...). Isso significa que a NSA (a agência de segurança nacional dos EUA) poderia acessar uma quantidade alarmante de ligações telefônicas simplesmente escolhendo as instalações certas. O que é ainda mais inacreditável: essas instalações não passam de alguns prédios, conhecidos como “hotéis de telecomunicação”, que hospedam os principais centros de conexão de internet e telefonia do planeta todo.
      Stephen Graham, Cidades Sitiadas: o novo urbanismo militar , 2016. Adaptado.
      A respeito da configuração espacial e geopolítica retratada no excerto e no mapa, é possível afirmar que
  alternativas:
    A:
      texto: essa é a razão do grande déficit econômico dos Estados Unidos atualmente, uma vez que a maior
        parte dos negócios e transações é feita pela internet.
    B:
      texto: essa situação explica o fato de que os Estados Unidos tenham, atualmente, a maior dívida
        pública do planeta, já que os custos com o tratamento de dados são muito altos.
    C:
      texto: em um mundo cada vez mais dependente dos fluxos imateriais de informação, a presença de objetos
        técnicos fixos torna ‐ se irrelevante para a posição geopolítica dos Estados Unidos.
    D:
      texto: o mapa representa, por meio do “trânsito de internet” e do fluxo de “ligações telefônicas”,
        uma globalização que integrou completamente tanto os norte ‐ americanos quanto as populações da
        África.
    E:
      texto: a presença de fixos, como algumas instalações de armazenagem e conexão, influencia a orientação
        de fluxos e dá aos EUA uma posição de destaque no contexto geopolítico.
