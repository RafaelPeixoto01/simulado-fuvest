  enunciado:
  - texto: Ao se preparar molho de tomate (considere apenas a fervura de tomate batido com água e azeite),
      é possível observar que a fração aquosa (fase inferior) fica vermelha logo no início e a fração
      oleosa (fase superior), inicialmente com a cor característica do azeite, começa a ficar avermelhada
      conforme o preparo do molho. Por outro lado, ao se preparar uma sopa de beterraba (considere apenas
      a fervura de beterraba batida com água e azeite), a fração aquosa (fase inferior) fica com a cor
      rosada e a fração oleosa (fase superior) permanece com sua coloração típica durante todo o processo,
      não tendo sua cor alterada.
  - figura: q004-1.webp
  - texto: Considerando as informações apresentadas no texto e no quadro, a principal razão para a diferença
      de coloração descrita é que a fração oleosa
  alternativas:
    A:
      texto: fica mais quente do que a aquosa, degradando a betanina; o mesmo não é observado com o licopeno,
        devido à sua cadeia carbônica longa.
    B:
      texto: está mais exposta ao ar, que oxida a betanina; o mesmo não é observado com o licopeno, devido
        à grande quantidade de duplas ligações.
    C:
      texto: é apolar e a betanina, polar, havendo pouca interação; o mesmo não é observado com o licopeno,
        que é apolar e irá interagir com o azeite.
    D:
      texto: é apolar e a aquosa, polar, mantendo ‐ se separadas; o licopeno age como um surfactante misturando
        as fases, colorindo a oleosa, enquanto a betanina não.
    E:
      texto: |-
        tem alta viscosidade, facilitando a difusão do licopeno, composto de menor massa molar; o mesmo não é observado para a betanina, com maior massa.
        Note e adote:
        Massas molares (g/mol):
        Licopeno = 537; betanina = 551.
  resposta: C
