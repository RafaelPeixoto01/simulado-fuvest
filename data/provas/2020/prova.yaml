      Dentre as medidas mais adequadas para mitigação dos efeitos da desertificação encontra(m) ‐ se
  alternativas:
    A:
      texto: a construção de rodovias que permitam às populações mais diretamente atingidas pela seca
        se deslocarem diariamente para áreas mais úmidas.
    B:
      texto: o uso das áreas de meia encosta como alternativa para expansão das áreas de produção de culturas
        temporárias e lavouras permanentes.
    C:
      texto: o plantio de espécies exóticas que apresentam crescimento rápido e podem reduzir os efeitos
        da desertificação e da seca, como o eucalipto, por exemplo.
    D:
      texto: a prevenção, recuperação e reabilitação de terras parcial ou totalmente degradadas com a
        recomposição de espécies nativas.
    E:
      texto: os programas de incentivo para a instalação de fossas sépticas que dispensam a implantação
        de um sistema hídrico de saneamento básico.
  resposta: D
