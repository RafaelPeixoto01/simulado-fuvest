  enunciado:
  - texto: |-
      No Brasil, várias cidades registram ocupação irregular de encostas em áreas sujeitas a deslizamentos de terra (também chamados de escorregamentos). O Instituto de Pesquisas Tecnológicas (IPT) trabalha no levantamento, mapeamento, recuperação e estabilização dessas áreas de risco. Um exemplo deste trabalho foram aqueles executados desde a década de 1970 referentes aos deslizamentos dos morros de Santos e São Vicente ‐ SP, cuja região é acometida há tempos por esses problemas, inclusive com a ocorrência de vítimas fatais. Para investigar os deslizamentos de terra nas áreas serranas tropicais brasileiras, o Instituto realizou levantamentos topográficos, geológicos e geomorfológicos, estudando também a distribuição dos tipos de vegetação existentes e as categorias de ocupação urbana dos morros.
      Representação de deslizamento de terra (escorregamento) na região de Santos e São Vicente
  - figura: q089-1.webp
  - figura: q089-2.webp
  - figura: q089-3.webp
  - texto: Disponível em https://www.ipt.br/. Adaptado. 2019. Baseando ‐ se nas informações do texto e
      na figura, é correto afirmar que
  alternativas:
    A:
      texto: as características topográficas, geológicas e geomorfológicas de uma área de risco estão
        naturalmente ligadas aos escorregamentos, sendo que estradas de terra minimizam a ocorrência de
        deslizamentos.
    B:
      texto: a ocorrência de escorregamentos é causada pela ação humana, cuja ocupação de encostas provoca
        o empobrecimento de solo, que acaba sendo mobilizado pela diminuição de fertilidade.
    C:
      texto: o problema da ocupação de encostas e risco de escorregamentos inclui o contato entre a rocha
        e o solo, cuja facilidade de deslizamento é aumentada em função da inclinação do terreno e da
        maior ocorrência de chuvas.
    D:
      texto: os deslizamentos de terra fazem parte de um conjunto de fenômenos naturais pontuais e incomuns
        na superfície da crosta terrestre e, portanto, não participam da escultura do relevo continental
        e do modelado.
    E:
      texto: os escorregamentos são causados em especial pelo fato de o solo tornar ‐ se mais leve que
        a rocha subjacente durante as chuvas prolongadas de verão, facilitando seu deslizamento ao longo
        das encostas pouco ou nada inclinadas.
  resposta: C
  anulada: false
