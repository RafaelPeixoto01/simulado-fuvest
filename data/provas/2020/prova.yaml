    C:
      texto: “Por que eu ficava isolada na hora do recreio” (L.10 ‐ 11).
    D:
      texto: “me esforçando para não ser notada” (L.15).
    E:
      texto: “sentia vergonha de levantar a mão” (L.8 ‐ 9).
