      Os chamados “remédios homeopáticos” são produzidos seguindo a farmacotécnica homeopática, que se baseia em diluições sequenciais de determinados compostos naturais. A dosagem utilizada desses produtos é da ordem de poucos mL. Uma das técnicas de diluição homeopática é chamada de diluição centesimal (CH), ou seja, uma parte da solução é diluída em 99 partes de solvente e a
      solução resultante é
      homogeneizada (ver
      esquema).
  - figura: q006-1.webp
  - texto: |-
      Alguns desses produtos
      homeopáticos são pro ‐
      duzidos com até 200
      diluições centesimais
  - figura: q006-2.webp
  - texto: |-
      sequenciais (200CH).
      Considerando uma solução de partida de 100 mL com concentração 1 mol/L de princípio ativo, a partir de qual diluição centesimal a solução passa a não ter, em média, nem mesmo uma molécula do princípio ativo?
  alternativas:
    A:
      texto: 12ªdiluição (12CH).
    B:
      texto: |-
        24ª diluição (24CH).
        Note e adote:
    C:
