  - texto: |-
      De acordo com o historiador Martyn Lyons , “ nos temores contemporâneos em relação ao acesso ilimitado a sites perigosos da Internet, e às dificuldades enfrentadas por governos de diversos países no policiamento da distribuição da informação, ouve ‐ se o eco do pânico causado pela invenção da imprensa”.
      Martyn Lyons, A história da leitura de Gutenberg a Bill Gates , RJ: Casa da Palavra, 1999.
      Escolha a alternativa que demonstre corretamente os elementos de continuidade e de descontinuidade entre a “revolução do impresso” e a “revolução eletrônica” apontados pelo autor.
  alternativas:
    A:
      texto: As chamadas “revolução do impresso” e “revolução eletrônica” não somente favoreceram a multiplicação
        e democratização do acesso à informação como também auxiliaram a formação de um público mais vasto
        e mais crítico.
    B:
      texto: A implementação das novas tecnologias de comunicação eliminou a diferença entre os usuários
        e os excluídos do universo da cultura escrita, tal como se prometera no início de sua adoção.
    C:
      texto: A manutenção de índices elevados de circulação de fake news nas redes sociais demonstra que
        a “revolução da comunicação” depende de quem domina e de quem usa as tecnologias.
    D:
      texto: Diferentemente do Index Librorum Prohibitorum promulgado para a atuação da Inquisição no
        controle da expansão do Protestantismo durante o século XVI, os atuais marcos regulatórios da
        Internet limitam ‐ se ao controle da pornografia.
    E:
      texto: O advento da tipografia não foi necessariamente revolucionário, pois não mudou a natureza
        nem o assunto dos livros; já a tecnologia digital suprimiu todas as formas anteriores de comunicação,
        da oral à impressa.
  resposta: C
