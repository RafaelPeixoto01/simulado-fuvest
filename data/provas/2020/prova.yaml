  enunciado:
  - texto: Em supermercados, é comum encontrar alimentos chamados de liofilizados, como frutas, legumes
      e carnes. Alimentos liofilizados continuam próprios para consumo após muito tempo, mesmo sem refrigeração.
      O termo “liofilizado”, nesses alimentos, refere ‐ se ao processo de congelamento e posterior desidratação
      por sublimação da água. Para que a sublimação da água ocorra, é necessária uma combinação de condições,
      como mostra o gráfico de pressão por temperatura, em que as linhas representam transições de fases.
  - figura: q011-1.webp
  - figura: q011-2.webp
  - texto: 'Apesar de ser um processo que requer, industrialmente, uso de certa tecnologia, existem evidências
      de que os povos pré ‐ colombianos que viviam nas regiões mais altas dos Andes conseguiam liofilizar
      alimentos, possibilitando estocá ‐ los por mais tempo. Assinale a alternativa que explica como ocorria
      o processo de liofilização natural:'
  alternativas:
    A:
      texto: A sublimação da água ocorria devido às baixas temperaturas e à alta pressão atmosférica nas
        montanhas.
    B:
      texto: Os alimentos, após congelados naturalmente nos períodos frios, eram levados para a parte
        mais baixa das montanhas, onde a pressão atmosférica era menor, o que possibilitava a sublimação.
    C:
      texto: Os alimentos eram expostos ao sol para aumentar a temperatura, e a baixa pressão atmosférica
        local favorecia a solidificação.
    D:
