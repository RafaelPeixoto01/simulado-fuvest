        costeira.
    C:
      texto: da presença de rede hidrográfica e florestas que contribuem para a formação de ciclones dessa
        natureza e magnitude.
    D:
      texto: da presença de águas superficiais do oceano Índico, com temperaturas mais reduzidas que o
        habitual, em especial no Canal de Moçambique.
    E:
      texto: das características socioeconômicas da região com populações vulneráveis e reduzida capacidade
        do poder público em prestar atendimento à população.
