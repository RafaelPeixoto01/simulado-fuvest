        americano e do continente africano, com a presença, respectivamente, das correntes marítimas de
        Humboldt e de Benguela.
    E:
      texto: As regiões polares apresentam potencial reduzido de pesca em função das dificuldades de acesso,
        baixa reprodução das espécies nesses locais e presença de correntes marítimas frias.
