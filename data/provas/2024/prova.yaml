  enunciado:
  - texto: Fogareiros abastecidos com pequenos botijões de gás são equipamentos corriqueiros em trilhas
      e escaladas de duração prolongada para possibilitar o cozimento de alimentos. Em geral, esses botijões
      são abastecidos com propano, isobutano ou n-butano. A tabela mostra a temperatura de ebulição e
      o calor liberado na combustão desses três gases, à pressão atmosférica.
  - figura: q029-t.webp
  - texto: Com base nessas informações, qual seria o gás mais indicado para a utilização em um ambiente
      com temperatura típica de −6 °C, considerando a viabilidade e o consumo de gás necessário para o
      preparo de alimentos?
  alternativas:
    A:
      texto: Propano, por estar líquido em −6 °C e, dentre as substâncias líquidas nessa temperatura,
        sua combustão fornecer mais calor por volume de gás.
    B:
      texto: Isobutano, por estar gasoso em −6 °C e, dentre as substâncias gasosas nessa temperatura,
        sua combustão fornecer mais calor por volume de gás.
    C:
      texto: n-Butano, por estar gasoso em −6 °C e, dentre as substâncias gasosas nessa temperatura, sua
        combustão fornecer mais calor por volume de gás.
    D:
      texto: n-Butano, por estar líquido em −6 °C e, dentre as substâncias gasosas nessa temperatura,
        sua combustão fornecer menos calor por volume de gás.
    E:
      texto: Isobutano, por estar gasoso em −6 °C e, dentre as substâncias gasosas nessa temperatura,
