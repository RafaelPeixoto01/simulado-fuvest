        um processo natural que não é afetado pela ação humana, pois é um fenômeno associado à origem
        de solos e às nascentes de rios.
    C:
      texto: O fenômeno caracteriza a formação de voçorocas, feições erosivas profundas que têm sua origem
        na ascensão do lençol freático e no acúmulo de lixo. Podem ser evitadas por meio do saneamento
        básico e da confecção de aterros.
    D:
      texto: Trata-se de um fenômeno associado a tremores de terra e fluxos subterrâneos de água que resultam
        na feição erosiva chamada de voçoroca, caracterizada por abrir grandes crateras no solo sem haver
        acúmulo de sedimentos.
    E:
      texto: O fenômeno mostra a formação de fluxos de lama na direção da área urbana do município. Podem
        ser vistos o desmatamento do seu entorno e arruamento precário em estradas de terra vicinais que
        causaram o processo erosivo.
