  - texto: |-
      “Entre os anos de 2012 e 2022, o número de pessoas autodeclaradas pretas e pardas aumentou em uma taxa superior à do crescimento do total da população do país, segundo o resultado da Pesquisa Nacional por Amostra de Domicílios (PNAD) Contínua do IBGE. No caso dos negros, essa porcentagem variou de 7,4% em 2012 para 10,6% em 2022. ‘(...) uma das hipóteses para o crescimento da proporção é que a percepção racial tenha mudado dentro da população, nos últimos anos’.”
      O Globo, 22/07/2022; CNN Brasil, 16/06/2023.
      “Pois bem, é justamente a partir daí que aparece a necessidade de teorizar as ‘raças’ como o que elas são, ou seja, construtos sociais, formas de identidade baseadas numa ideia biológica errônea, mas eficaz, socialmente, para construir, manter e reproduzir diferenças e privilégios. Se as raças não existem num sentido estritamente realista de ciência, ou seja, se não são um fato do mundo físico, são, contudo, plenamente existentes no mundo social, produtos de formas de classificar e de identificar que orientam as ações dos seres humanos.”
      GUIMARÃES, Antônio Sergio Alfredo. Raças e estudos de relações raciais no Brasil. Novos Estudos CEBRAP, n.54, 1999. p.153.
      Relacionando os dados trazidos pela PNAD/IBGE e o conceito de raça do sociólogo Antônio Sergio Alfredo Guimarães, é correto afirmar:
  alternativas:
    A:
      texto: A hipótese de que a autopercepção racial de parte dos brasileiros mudou está em conflito
        com a tese de que raça é um construto social. Isso porque, como os traços fenotípicos da população
        brasileira mantiveram-se os mesmos de 2012 a 2022, não haveria motivos para o aumento dos autodeclarados
        pretos e pardos.
    B:
      texto: A tese de que raças são construtos sociais ganha força diante das mudanças na autopercepção
        de parte dos brasileiros sobre sua condição racial. Alterações culturais e ideológicas da inserção
        social de negros e pardos teriam permitido o crescimento dos assim autodeclarados.
    C:
      texto: As alterações na autopercepção racial captadas pelas pesquisas do IBGE não guardam relação
        com a ideia de que raça é um construto social. Na verdade, reafirmam que as raças são realidades
        biológicas e que mais indivíduos estariam se dando conta do seu verdadeiro pertencimento racial.
    D:
      texto: Os dados colhidos pelo IBGE sobre o aumento da autodeclaração racial dos respondentes como
        pretos e pardos indicam que houve um aumento dessa população no Brasil, o que contraria a tese
        de que raça é um construto social, e não uma realidade biológica.
    E:
      texto: A existência do racismo no Brasil indica que a tese de raça como construto social está errada.
        Se raça fosse um construto social, e não uma realidade biológica, os indivíduos prefeririam se
        declarar como brancos para evitar serem vítimas de racismo.
  resposta: B
  anulada: false
  pendencias: []
