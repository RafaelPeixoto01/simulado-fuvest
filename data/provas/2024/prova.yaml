  - texto: |-
      As moléculas de água podem conter o isótopo estável mais abundante de oxigênio, ¹⁶O, ou o isótopo estável menos abundante, ¹⁸O.
      Essa pequena diferença de massa entre as moléculas de água é suficiente para alterar a sua pressão de vapor. Por esse motivo, a análise de isótopos de oxigênio na água da chuva possibilita a identificação de períodos secos e de períodos chuvosos.
      A figura ilustra a mudança na constituição isotópica da água da chuva ao longo do tempo como resultado da diferença na pressão de vapor.
  - figura: q041-1.webp
  - texto: Com base nessas informações, assinale a alternativa correta.
  alternativas:
    A:
      texto: Em períodos de alta pluviosidade, as primeiras precipitações da nuvem são isotopicamente
        mais leves e a nuvem de chuva se enriquece, relativamente, em ¹⁸O.
    B:
      texto: Em períodos de baixa pluviosidade, a constituição isotópica das nuvens pouco se altera ao
        longo do tempo, e a pouca chuva dessas nuvens é relativamente enriquecida em ¹⁸O.
    C:
      texto: No período atual, em função do aquecimento global, as temperaturas elevadas fazem com que
        o fracionamento isotópico de ¹⁶O e ¹⁸O resultante da evaporação e da precipitação da água não
        ocorra.
    D:
      texto: Em períodos glaciais, em função da maior temperatura do planeta, as chuvas são enriquecidas
        em ¹⁸O, enquanto, nos oceanos, a água é enriquecida em ¹⁶O.
    E:
      texto: Em períodos interglaciais, em função da menor temperatura do planeta, as chuvas são enriquecidas
        em ¹⁶O, enquanto, nos oceanos, a água é enriquecida em ¹⁸O.
  resposta: B
  anulada: false
  pendencias: []
