  - texto: A arte foi e ainda pode ser utilizada para criar, reforçar e disseminar ideias, valores e estereótipos,
      mas também pode colocá-los em discussão. A obra “Sentem para jantar”, de Gê Viana, faz parte da
      série “Atualizações traumáticas de Debret”, na qual o artista propõe uma revisão iconográfica da
      história do Brasil tendo como referência as obras de Jean-Baptiste Debret, especificamente aquelas
      presentes em “Viagem Pitoresca e Histórica ao Brasil” (1834-1839), publicação que pautou de maneira
      imagética o período colonial brasileiro. Em sua revisão, Gê Viana dá continuidade ao seu projeto
      de análise crítica de representações históricas, produzindo releituras de algumas dessas obras,
      dentre as quais, a obra “Um jantar brasileiro”, do artista francês. A seguir, são reproduzidos os
      quadros desses dois artistas.
  - figura: q003-1.webp
  - texto: Jean-Baptiste Debret. “Um jantar brasileiro”, 1827. Aquarela, 15,7 x 22 cm. Disponível em http://museuscastromaya.com.br/.
  - figura: q003-2.webp
  - texto: |-
      Gê Viana. “Sentem para jantar”, 2021. Impressão em jato de tinta com pigmento natural de colagem digital sobre papel Hahnemuhle Photo Rag 308 g/m²; 29,7 x 42 cm. Disponível em https://mam.rio/ge-viana/.
      Com base nas informações e imagens apresentadas, assinale a alternativa que corresponde à abordagem adotada por Gê Viana em sua obra “Sentem para jantar”, ao utilizar como referência a obra “Um jantar brasileiro”, de Jean-Baptiste Debret.
  alternativas:
    A:
      texto: Gê Viana reproduz, em sua obra, as mesmas relações sociais representadas na obra de Debret.
    B:
      texto: Gê Viana exalta, em sua obra, especialmente as características físicas das pessoas retratadas,
        enquanto Debret enfatiza as relações pessoais.
    C:
      texto: Gê Viana emprega, em sua obra, as mesmas técnicas e os mesmos materiais utilizados na obra
        de Debret, o que lhes confere grande semelhança.
    D:
      texto: Gê Viana ignora aspectos relacionados a questões étnico-raciais em sua releitura da obra
        de Debret, focando apenas na estética visual da obra.
    E:
      texto: Gê Viana busca desconstruir, em sua obra, os estereótipos étnico-raciais presentes na obra
        original de Debret.
  resposta: E
  anulada: false
