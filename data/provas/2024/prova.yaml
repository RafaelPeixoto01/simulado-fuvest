  enunciado:
  - texto: "Nas embalagens de lâmpadas de LED atuais, está indicada uma “temperatura de cor” (expressa
      na escala Kelvin), que corresponde à tonalidade da luz emitida pela lâmpada. A “temperatura de cor”
      não indica a temperatura de operação da lâmpada, servindo apenas como uma referência da cor predominante
      da radiação eletromagnética termicamente emitida por um corpo a essa dada temperatura.\nA densidade
      \U0001D70C(\U0001D706) de energia eletromagnética irradiada é função do comprimento de onda \U0001D706
      da luz emitida. As curvas presentes nos gráficos das alternativas mostram \U0001D70C(\U0001D706)
      dividida pelo seu valor máximo \U0001D70C(\U0001D706ₘₐₓ). O máximo de cada curva corresponde ao
      comprimento de onda \U0001D706ₘₐₓ predominante da luz irradiada.\nCom base nessas informações, assinale
      a alternativa que apresenta o gráfico que melhor corresponde à situação em que a cor predominante
      da luz irradiada seja amarela."
