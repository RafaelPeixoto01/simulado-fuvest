      1, de tal forma que a medida de seus lados seja igual à medida dos catetos do triângulo retângulo
      isósceles que possui hipotenusa igual ao lado do quadrado da Etapa 1. Na Etapa 3, aplica-se a Etapa
      2 em cada um dos novos quadrados obtidos, e assim por diante. Ou seja, em cada nova etapa, aplica-se
      a etapa anterior em cada um dos novos quadrados obtidos. A figura a seguir exibe as quatro primeiras
