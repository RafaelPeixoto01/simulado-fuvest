- numero: 52
  disciplina: historia
  disciplinas_secundarias: []
  texto_base: null
  enunciado:
  - texto: |-
      “A história do skate no Brasil passou por fases diferentes e até mesmo antagônicas. Em 1988, por exemplo, na cidade de São Paulo, sob acusação de ser prática displicente, foi promulgada a Lei nº 25.871, pelo então prefeito Jânio Quadros, que proibia a prática da modalidade nas ruas da cidade. Essa proibição foi alterada no ano seguinte, quando a nova prefeita da cidade, Luiza Erundina, em um de seus primeiros atos, revogou essa mesma lei e liberou a prática do skate nas ruas da cidade.
      Anos depois, em 2015, o Brasil somava 8,4 milhões de praticantes de skate, segundo pesquisa Datafolha.
      Já em 2021, quando o skate estreou como modalidade olímpica nos Jogos de Tóquio, o Brasil se destacou como o segundo país com mais medalhas olímpicas na modalidade. No mesmo ano, a indústria nacional ligada ao esporte foi considerada a segunda maior do mundo, atrás apenas dos Estados Unidos, cujo mercado é estimado em US$ 4,5 bilhões ao ano.”
      Thais Carrança, BBC News Brasil em São Paulo, 26 julho 2021. Adaptado.
      A partir da leitura do texto, é correto afirmar:
  alternativas:
    A:
      texto: O skate adentrou o mundo esportivo, entre outros motivos, por pressão dos praticantes da
        modalidade. No entanto, práticas esportivas que surgem pautadas pelo lazer ou por atividades cotidianas
        não deveriam ser consideradas modalidades esportivas por não terem sido institucionalizadas desde
        sua origem.
    B:
      texto: Eventos esportivos de grande alcance, tal qual a Olimpíada, deveriam considerar as estruturas
        normativas que dão origem aos esportes para inseri-los nas competições. Apenas dessa forma, seria
        possível garantir a autenticidade das modalidades e justificar a inserção do skate como esporte
        olímpico.
    C:
      texto: Os esportes são uma forma de representação das práticas sociais. Sendo assim, as transformações
        sociais podem resultar em alterações de regras esportivas, na esportivização de práticas de lazer
        e até na extinção de modalidades esportivas.
    D:
      texto: Os esportes podem sofrer alterações normativas ao longo dos tempos. Com tal efeito, torna-se
        equivocado datar a criação de um esporte, pois ele já pode ter sofrido alterações que descaracterizaram
        sua origem.
    E:
      texto: O skate, bem como outras práticas esportivas, foi criado de modo discreto, por grupos pequenos,
        e ganhou força e ascensão a partir do aumento de incentivo financeiro para sua realização, o que
        é determinante para um esporte alcançar reconhecimento mundial.
  resposta: C
  anulada: false
  pendencias: []
