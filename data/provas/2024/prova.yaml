  - texto: Os jardins de chuva, como o esquematizado na figura, vêm sendo implantados em áreas urbanas
      como uma alternativa de baixo custo para minimizar alagamentos. São canteiros de plantas que ocupam
      partes rebaixadas do terreno, com a função de reter parte das águas pluviais e diminuir sua velocidade
      de escoamento. Para isso, o solo do jardim deve ser preparado a fim de absorver a água e facilitar
      sua infiltração, direcionando-a ao lençol freático. Outra vantagem desses jardins é a retenção e
      decomposição de poluentes carreados pelas águas pluviais. Ainda, ao mesclar diversos tipos de plantas,
      os jardins de chuva atraem animais e aumentam a biodiversidade local.
