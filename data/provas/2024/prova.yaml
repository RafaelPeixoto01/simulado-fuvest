    B:
      texto: A mecanização resultante da Revolução Industrial, iniciada no século XVIII, causou grandes
        mudanças nos meios de produção, com a utilização de energias renováveis.
    C:
      texto: O plantio de árvores em grande escala acentua o aquecimento global, devido à liberação de
        gases do efeito estufa na atmosfera.
