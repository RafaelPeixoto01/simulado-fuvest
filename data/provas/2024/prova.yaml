  texto_base: null
  enunciado:
  - texto: "“Os experimentos de difração e interferência da luz realizados no período de 1800 a 1803,
      em analogia com os processos de interferência das ondas acústicas, corroboraram a natureza ondulatória
      da luz. Por outro lado, Einstein introduziu, em 1905, o conceito de fóton, em que cada componente
      monocromática de frequência \U0001D453 da radiação seria equivalente a um sistema de partículas
      idênticas sem massa, cada qual com energia ℎ\U0001D453, sendo ℎ ≃ 6,626 × 10⁻³⁴ J.s a constante
      de Planck. A hipótese da existência de fótons só teve ampla aceitação após os experimentos de Compton,
      em 1922, sobre o espalhamento da radiação eletromagnética na faixa dos raios X por alvos de elementos
      leves, como o grafite.”\nAdaptado de F. Caruso e V. Oguri, Sobre a necessidade do conceito de fóton,
      RBEF 43, e20210011 (2021).\nDe acordo com o texto e seus conhecimentos, é correto afirmar:"
  alternativas:
    A:
      texto: A radiação eletromagnética apresenta somente comportamento ondulatório.
    B:
      texto: Os experimentos de Compton mostraram que feixes de raios X exibem comportamento corpuscular.
    C:
      texto: A energia de um fóton independe de seu comprimento de onda.
    D:
      texto: A hipótese da natureza corpuscular da radiação está em desacordo com os resultados experimentais.
    E:
      texto: Einstein demonstrou que os experimentos de difração e interferência da luz deveriam estar
        incorretos.
  resposta: B
  anulada: false
  pendencias: []
