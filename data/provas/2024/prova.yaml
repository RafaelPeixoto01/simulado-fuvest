  - texto: "Matrizes podem ser usadas para se obter informações sobre uma rede social. Para compreender
      como isso pode ser feito, consideremos como exemplo uma pequena rede social formada por 4 pessoas:
      \U0001D443₁, \U0001D443₂, \U0001D443₃, \U0001D443₄. A matriz associada a essa rede social é a matriz
      4 × 4:"
  - figura: q013-1.webp
  - texto: "O valor 1 (um) na posição \U0001D44E₃₂ (linha 3, coluna 2) da matriz significa que a pessoa
      \U0001D443₃ segue a pessoa \U0001D443₂, ao passo que o valor 0 (zero) na posição \U0001D44E₂₄ (linha
      2, coluna 4) significa que a pessoa \U0001D443₂ não segue a pessoa \U0001D443₄. O valor 0 (zero)
      será atribuído às posições \U0001D44Eᵢᵢ. O significado do valor da posição \U0001D44Fₘₙ da matriz
      produto \U0001D440 × \U0001D440 = \U0001D440² é a quantidade de conexões da pessoa \U0001D443ₘ até
      a pessoa \U0001D443ₙ passando exatamente por uma pessoa, diferente delas duas, que chamaremos de
      conexão de grau 2.\nDessa forma, os valores das posições da matriz \U0001D440² podem refletir o
      alcance da rede social, suas potencialidades e fraquezas, a influência de certos membros dela, dentre
      outros aspectos.\nCom relação à rede social apresentada, é correto afirmar que:"
  - texto: "Note e adote:\nA posição \U0001D44Fₘₙ da matriz produto \U0001D440 × \U0001D440 = \U0001D440²
      é dada pela expressão\n\U0001D44Fₘₙ = \U0001D44Eₘ₁\U0001D44E₁ₙ + \U0001D44Eₘ₂\U0001D44E₂ₙ + \U0001D44Eₘ₃\U0001D44E₃ₙ
