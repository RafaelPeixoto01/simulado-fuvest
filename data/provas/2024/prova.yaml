      Sobre o papel da cafeicultura na dinâmica territorial dessas áreas, é correto afirmar:
  alternativas:
    A:
      texto: Iniciada no Vale do Paraíba do Sul, entre São Paulo e Rio de Janeiro, na década de 1830,
        a cafeicultura teve pouco êxito nessa região pelas dificuldades de cultivo, em função do clima
        frio e da escassez de trabalho escravizado.
    B:
      texto: A expansão da produção cafeeira no estado de São Paulo se deu em direção à zona oriental
        do estado, na década de 1850, em decorrência da infraestrutura de transporte existente na região
        e da presença de trabalho assalariado.
    C:
      texto: O início da cafeicultura no estado de São Paulo se deu na região oeste, na década de 1930,
        em decorrência da expansão da produção no norte do Paraná, com expansão para o oeste paulista,
        aproveitando-se da qualidade do solo.
    D:
      texto: A produção cafeeira, nos séculos XIX e XX, concentrava-se nos estados de Minas Gerais e Espírito
        Santo, com a introdução de novas variedades altamente produtivas e resistentes ao clima frio dessas
        regiões.
    E:
      texto: Expandindo-se na direção oeste do território paulista, a produção cafeeira impulsionou, nos
        séculos XIX e XX, a estruturação econômica do estado de São Paulo, impactando o desenvolvimento
        da malha ferroviária e portuária.
