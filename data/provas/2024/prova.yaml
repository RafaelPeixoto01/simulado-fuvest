      O Pico da Neblina, o mais alto do Brasil, com 2.995 m, faz parte da Serra do Imeri, mas integra
      maciço rochoso diferente, fisicamente separado da área da expedição. Do ponto de vista ecológico,
      são como dois arquipélagos distintos, separados por um grande mar de floresta verde.”'
