      de onda bem definido. O diagrama representa uma imagem digitalizada dos grãos de areia depositados
      na base da canaleta em um certo instante. Utilize a régua da figura, graduada em centímetros, para
      assinalar a alternativa que apresenta a melhor aproximação para o valor do comprimento de onda da
      vibração em questão.
