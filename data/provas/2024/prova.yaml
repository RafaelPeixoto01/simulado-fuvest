  - texto: |-
      Apesar de a África ser considerada o berço das civilizações e existirem indícios de conhecimentos elementares de Química no sul do continente cerca de 100.000 anos atrás, os conhecimentos químicos ensinados são eurocentristas. Entretanto, uma das grandes contribuições para o estudo de reatividade química é atribuída ao químico egípcio Ahmed Hassan Zewail, agraciado com o prêmio Nobel em 1999 por seus estudos de reações químicas usando uma técnica conhecida como espectroscopia de femtossegundos. Essa técnica possibilita identificar espécies com tempo de vida curto utilizando pulsos de laser com duração de 10⁻¹⁵ s.
      Essa contribuição é relevante para o estudo de reações químicas, pois
  alternativas:
    A:
      texto: todos os processos químicos são extremamente rápidos e não podem ser estudados por técnicas
        que não sejam em femtossegundos.
    B:
      texto: as reações químicas podem passar por espécies instáveis e com pouco tempo de vida.
    C:
      texto: o tempo existente para analisar os produtos de uma reação depende apenas da quantidade de
        produtos formada.
    D:
      texto: permite entender como reagentes específicos se comportam frente a processos reacionais que
        são extremamente lentos.
    E:
      texto: apenas com uma técnica tão rápida é possível analisar o grau de pureza dos reagentes isolados.
  resposta: B
  anulada: false
