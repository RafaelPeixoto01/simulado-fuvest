    B:
      texto: os trovadores ainda inspiram os enamorados.
    C:
      texto: a sabedoria controla o poder das máquinas.
    D:
      texto: os heróis sempre ressuscitam neste mundo.
    E:
      texto: a poesia resiste à negatividade do seu tempo.
  resposta: E
