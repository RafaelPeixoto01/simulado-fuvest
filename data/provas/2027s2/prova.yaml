  - texto: |-
      “A vida não me corre mal. Já lá vão os tempos em que vivi de miséria e morte, mas hoje existe em mim bem demarcada a realidade e o sonho. Mas para quê, recordar isso agora? Passaram já dezesseis anos que o Mwando me abandonou e talvez já tenha morrido. Tudo fiz para que ele regressasse. Os melhores curandeiros fizeram tudo ao seu alcance tentando produzir o milagre do regresso e nada. Acredito que foi tudo obra dos maus espíritos, que é o sangue da Phati que clamava por vingança. Todos os curandeiros foram unânimes em afirmar que os meus espíritos e os do Mwando estão em pé de guerra lá no fundo da terra e por essa razão recusaram sempre a nossa união. O Mwando era um homem majestoso, mas tinha aquela cortina de mistério que nunca consegui desvendar. Não quero mais saber dele, mas guardo doces recordações do tempo dos sonhos.”
      Paulina Chiziane. Balada de amor ao vento .
      No excerto, a reflexão de Sarnau articula experiência e memória, contribuindo para o sentido do texto ao
  alternativas:
    A:
      texto: estabelecer uma cisão entre o vivido e o lembrado, por meio do distanciamento do sofrimento
        amoroso evocado como sonho que ficou no passado.
    B:
      texto: reconhecer nas crenças espirituais um valor explicativo que encerra em definitivo o conflito
        amoroso, convertendo-o em justificativa simbólica.
    C:
      texto: afirmar uma hierarquia temporal em que passado e presente se opõem pela lógica da passagem
        da esperança à aridez emocional.
    D:
      texto: tensionar a afirmação de estabilidade no presente com a permanência de marcas subjetivas
        do passado, evidenciadas pela oscilação entre negação e evocação da lembrança.
    E:
      texto: deslocar o abandono amoroso para o plano simbólico, eliminando seus efeitos no tempo presente
        e na constituição da identidade da narradora.
