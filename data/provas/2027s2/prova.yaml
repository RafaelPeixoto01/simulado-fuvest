  enunciado:
  - texto: |-
      O LiDAR ( Light Detection and Ranging ) é uma tecnologia de sensoriamento remoto que utiliza pulsos de laser infravermelho para medir distâncias e movimentos em tempo real. O sistema calcula o “tempo de voo” do laser , que é o intervalo entre a emissão do pulso e o seu retorno ao sensor após atingir um objeto. Ao processar bilhões dessas medições, o LiDAR gera uma nuvem de pontos, permitindo a criação de mapas 3D dinâmicos essenciais para a navegação de veículos autônomos e o monitoramento de desastres naturais.
      Considere um sistema LiDAR de alta precisão operando em um veículo autônomo. Qual das seguintes afirmações descreve corretamente um aspecto físico ou uma limitação operacional dessa tecnologia?
  alternativas:
    A:
      texto: A precisão do LiDAR é superior à de radares convencionais porque a onda de luz infravermelha
        viaja no ar a uma velocidade dez vezes maior que a das microondas do radar, permitindo que o sensor
        receba os dados antes mesmo de o objeto se mover.
    B:
      texto: O sistema é imune a condições climáticas como neblina ou chuva densa, pois o laser infravermelho
        atravessa as moléculas de água sem sofrer qualquer tipo de dispersão ou interferência física.
    C:
      texto: O LiDAR apresenta dificuldades críticas em detectar superfícies perfeitamente espelhadas
        ou de vidro transparente, pois o feixe de laser pode ser desviado para longe do receptor ou atravessar
        o material sem sofrer a reflexão necessária para o cálculo do tempo de voo.
    D:
      texto: A “nuvem de pontos” gerada pelo sensor é, na verdade, um mapa de calor que utiliza a temperatura
        dos objetos para deduzir a que distância eles estão, independentemente do tempo que a luz leva
        para retornar.
    E:
      texto: O sensor LiDAR funciona emitindo ondas sonoras de alta frequência que, ao atingirem objetos
        estáticos, mudam de cor devido ao efeito Doppler, permitindo que o computador calcule a posição
        exata do objeto.
  resposta: C
  anulada: false
  pendencias: []
