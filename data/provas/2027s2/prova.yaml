  enunciado:
  - texto: |-
      Até hoje admitia-se que o nosso conhecimento se devia regular pelos objetos; porém, todas as tentativas para descobrir a priori , mediante conceitos, algo que ampliasse o nosso conhecimento, malogravam-se com este pressuposto. Tentemos, pois, uma vez, experimentar se não se resolverão melhor as tarefas da metafísica, admitindo que os objetos se deveriam regular pelo nosso conhecimento. Trata-se aqui de uma semelhança com a primeira ideia de Copérnico; não podendo prosseguir na explicação dos movimentos celestes enquanto admitia que toda a multidão de estrelas se movia em torno do espectador, tentou se não daria melhor resultado fazer antes girar o espectador e deixar os astros imóveis. Ora, na metafísica, pode-se tentar o mesmo, no que diz respeito à intuição dos objetos. Se a intuição tivesse de se guiar pela natureza dos objetos, não vejo como deles se poderia conhecer algo a priori ; se, pelo contrário, o objeto (enquanto objeto dos sentidos) se guiar pela natureza da nossa faculdade de intuição, posso perfeitamente representar essa possibilidade.
      Immanuel Kant. Crítica da razão pura . Edição B, p. XVI-XVII. Adaptado.
      A revolução copernicana de Kant oferece o modelo completo das explicações modernizadoras, ao fazer com que o objeto gire em torno de um novo foro. Mas nada nos obriga a tomar esta revolução como um acontecimento decisivo que nos teria colocado para sempre no caminho seguro da ciência, da moral e da teologia. Dou o nome de contrarrevolução copernicana a essa inversão da inversão. Não precisamos apoiar nossas explicações nestas duas formas puras, o objeto ou o sujeito-sociedade, já que elas são, ao contrário, resultados parciais e purificados da prática central, a única que nos interessa. A natureza gira, de fato, mas não ao redor do sujeito-sociedade. Ela gira em torno do coletivo produtor de coisas e de homens. O sujeito gira, de fato, mas não em torno da natureza. Ele é obtido a partir do coletivo produtor de homens e de coisas. O Império do Meio se encontra, enfim, representado. Natureza e sociedade são os seus satélites.
      Bruno Latour. Jamais fomos modernos . São Paulo: Editora 34, 2019. Adaptado.
      Com base na leitura dos textos, a “contrarrevolução” proposta por Bruno Latour, em relação à “revolução” de Kant, consiste em
  alternativas:
    A:
      texto: reafirmar que o conhecimento humano deve voltar a se regular pela natureza estática dos objetos.
    B:
      texto: substituir o foco no sujeito individual por um foco na sociedade, mantendo o sujeito em seu
        papel de regulador do conhecimento.
    C:
      texto: deslocar o centro do sistema explicativo, que deixaria de ser ora o objeto ora o sujeito
        para situar-se em um plano comum de produção mútua.
    D:
      texto: criticar a analogia de Kant com a astronomia de Copérnico, argumentando que a metafísica
        não pode ser comparada às ciências da natureza.
    E:
      texto: defender que tanto a natureza quanto a sociedade são categorias a priori , independentes
        da produção coletiva de coisas.
  resposta: C
  anulada: false
  pendencias: []
