      texto: simpátrica, no qual a diferenciação entre linhagens ocorre sem redução do fluxo gênico entre
        elas.
    B:
      texto: simpátrica, no qual diferenças no comportamento de acasalamento reduzem os cruzamentos entre
        linhagens.
    C:
      texto: alopátrica, no qual a formação de novas espécies ocorre sem fatores que limitem os cruzamentos.
    D:
      texto: alopátrica, no qual a ocupação de uma mesma área impede a diferenciação entre populações.
    E:
      texto: alopátrica, no qual as linhagens se diferenciam por apresentarem períodos reprodutivos distintos
        ao longo do ano.
  resposta: B
  anulada: false
