      Alguns estudos indicam que as grandes obras de arquitetura e engenharia do Império Romano se devem às propriedades de autorreparação do concreto utilizado. A receita para esse concreto consistia, de forma simplificada, na adição de óxido de cálcio (CaO), silicatos e aluminatos vindos de cinzas vulcânicas, além de pedras e pequenas rochas que eram misturadas a seco para depois ocorrer a adição de água. Era encorajado que o óxido de cálcio não fosse totalmente incorporado à mistura seca, ficando como fragmentos sólidos chamados de clastos. Dessa forma, quando o concreto sofresse uma fissura, a rachadura iria expor parte desses clastos de óxido de cálcio que, em contato com a água do ambiente, geraria uma solução de íons Ca (reação I). Esses íons poderiam, então, reagir com o CO dissolvido na água, produzindo CaCO (reação II) como um sólido que preencheria as rachaduras por ter uma baixa solubilidade muito baixa.
      I. CaO(s) + H O( ) ⇌ Ca (aq) + 2OH (aq)
      II. Ca (aq) +2OH (aq) + CO (aq) ⇌ CaCO (s) + H O( )
      O CaO é fundamental para esse processo e não poderia ser trocado por um sal de cálcio como o nitrato de cálcio (Ca(NO ) ), pois o CaO
