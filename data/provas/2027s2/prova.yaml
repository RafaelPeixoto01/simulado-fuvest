  - texto: 'Examine as duas imagens:'
  - figura: q047-1.webp
  - texto: Assassinato na casa , Jakub Schikaneder, 1890, pintura a óleo sobre tela, Galeria Nacional
      de Praga.
  - figura: q047-2.webp
  - texto: |-
      El Tendedero , Mónica Mayer, instalação, 1978/2023, Fundação Ecarta.
      A pintura Assassinato na Casa (1890) de Jakub Schikaneder retrata de maneira realista o cadáver de uma mulher de bruços no chão de um pátio e a reação dos moradores à cena. A segunda imagem registra fotograficamente a instalação participativa de Mónica Mayer, que coleta depoimentos anônimos de mulheres sobre experiências de violência e assédio.
      Em relação à interpretação da permanência do fenômeno e da mudança de perspectiva histórica no enquadramento da violência contra a mulher, é correto afirmar:
  alternativas:
    A:
      texto: Na primeira imagem, aparece como um caso localizado e privado, enquanto, na segunda, o anonimato
        reforça a individualização das vítimas.
    B:
      texto: Na primeira imagem, reside no acontecimento e em sua repercussão social, enquanto, na segunda,
        o sentido organiza-se pela curadoria autoral centralizada e seletiva.
    C:
      texto: Na primeira imagem, mobiliza a atenção e indignação das testemunhas, enquanto, na segunda,
        os relatos tendem a isolar experiências obstruindo um entendimento comum.
    D:
      texto: Na primeira imagem, é figurada como acontecimento singular que provoca comoção, enquanto,
        na segunda, os relatos compõem um conjunto de experiências atravessado pela dispersão temática.
    E:
      texto: Na primeira imagem, é mediada pelo olhar coletivo e consternado, enquanto, na segunda, a
        acumulação de relatos evidencia sua recorrência no cotidiano e seu caráter estrutural.
  resposta: E
  anulada: false
  pendencias: []
