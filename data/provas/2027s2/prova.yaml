      “O Partido Comunista, armado com o poder, já representa uma outra relação entre a vanguarda e a classe; nesta relação existe um elemento de coação. A luta de Lenin contra o burocratismo do partido e dos soviets significava, no fundo, uma luta não contra o mau funcionamento das secretarias, a inércia, a sujeira etc., mas contra a submissão da classe ao aparelho, contra a transformação da burocracia em uma nova camada dirigente. (...) A degeneração burocrática do partido atingiu o auge nestes últimos anos. O aparelho stalinista não sabe fazer outra coisa senão mandar. A linguagem do comando é a linguagem do ultimatismo. Todo operário tem de reconhecer antecipadamente que todas as decisões precedentes, atuais e futuras do Comitê Central, são infalíveis. As pretensões de infalibilidade aumentam à medida que a política se vai tornando cada vez mais errática.”
      TROTSKY, Leon. Como esmagar o fascismo . São Paulo: Autonomia Literária, 2018.
