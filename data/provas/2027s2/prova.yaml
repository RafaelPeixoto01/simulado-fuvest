      You may have never
      heard of “The Comedian” or
      Maurizio Cattelan, the artist
      of the work. But unless you
      avoid the Internet, you have
  - figura: tb03-1.webp
  - texto: |-
      probably seen at least one
      of its hundreds of parodies.
      “The Comedian” is the
      banana duct-taped to the
      wall at Miami’s Art Basel that
      was sold for $120,000 and caused a massive reaction amongst art lovers. It is one example in a line of Cattelan’s art pranks. His past “joke works” include statues of giant middle fingers and his most famous work is a golden toilet titled “America”. However offensive his previous works may be, none have rocked the mainstream more than “The Comedian”. Going off the implication that “The Comedian” is not simply the banana one sees but rather an abstract concept, what is the idea? I believe the more interesting explanation is the recognition of the interactive nature of the piece.
      As opposed to simply observing the art, Art Basel says on Instagram that the visitors that wait in line to take pictures with the work are “participating”. This leads me to conclude that the concept behind the piece has nothing to do with bananas and duct tape but instead the outrage. The reactions, both positive and negative, the parodies and memes referencing the work, and all serious discussions of the piece are the true spectacle of Cattelan’s work. All of us are the butt of the joke, for our swiftness to react has caused us all to waste time caring about a fruit signifying nothing.
      The Spectator. February 2026 . Adaptado.
