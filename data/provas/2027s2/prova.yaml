      “Comovia ‑ se ao observar o arranjo das pétalas picotadas — por um anjo? — dos cravos. Via olhos na corola dos malmequeres e carrancas sisudas ou brincalhonas nas nervuras da casca dos limões. Se Celestino tivesse tido tempo e paciência para um último desejo, teria tropeçado nos canteiros, caído sobre as flores e aí pereceria, engrinaldado. Vinda a chuva, a chuva o regaria. Chegado o vento, o vento sopraria sobre o seu cadáver. As mãos e as pernas ganhariam raiz até as suas plantas o cobrirem e dominarem o seu corpo, abraçando ‑ o como a um pai. Ter ‑ se ‑ ia tornado domínio delas, num caixão a céu aberto. Mas não foi assim que aconteceu.”
      Djaimilia Pereira de Almeida. A visão das plantas .
      Em A visão das plantas , a narrativa de Djaimilia Pereira de Almeida opera uma inversão de perspectiva ao situar Celestino, um antigo traficante de escravizados, em um jardim que “observa” a sua própria decadência física e mental. Considerando o excerto apresentado, depreende-se:
  alternativas:
    A:
      texto: O jardim atuou como um agente de dissolução da subjetividade imperial, onde a vitalidade
        autônoma das plantas evidenciou a decadência física e a obsolescência histórica de Celestino.
    B:
      texto: As plantas representavam uma alegoria das vítimas do tráfico, cultivadas por Celestino como
        um monumento à memória daqueles que pereceram em seus navios.
    C:
      texto: O jardim era uma extensão da lógica colonial de posse e domínio, em que o controle sobre
        as espécies vegetais reafirmava a autoridade inabalável de Celestino.
    D:
      texto: No fim de sua vida, o jardim devolveria a Celestino o cuidado que ele lhe dispensara, como
        reconhecimento por sua dedicação e perdão pela violência praticada.
    E:
      texto: Ao ser visto pelas plantas, Celestino tornou-se “parte do jardim”, perdendo o privilégio
        de ser o único observador e controlador do mundo, uma das características centrais da mentalidade
        colonial.
  resposta: E
  anulada: false
