      Eu tenho um sonho de que um dia, lá na Geórgia, no Mississippi e no Alabama, os filhos dos antigos escravos e os filhos dos antigos senhores viverão como irmãos. Eu tenho um sonho esta tarde de que, um dia, crianças brancas e negras caminharão de mãos dadas como irmãos e irmãs. Eu tenho um sonho esta tarde de que, um dia, casas e igrejas não mais arderão em chamas simplesmente porque um povo quer se libertar. (...) Eu tenho um sonho esta tarde, que meus quatro filhos pequenos não terão a infância que eu tive, nem serão julgados pela cor da pele, mas pelo conteúdo de seu caráter.
      Martin Luther King. “Discurso no comício pela liberdade no Cobo Hall (Detroit, 23/06/1963)”. In: Clayborne Carson e Kris Shepard. Um apelo à consciência. Os melhores discursos de Martin Luther King . Rio de Janeiro: Zahar, 2006. Adaptado.
