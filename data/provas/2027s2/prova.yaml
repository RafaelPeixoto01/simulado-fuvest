  - texto: 'Um domínio morfoclimático e fitogeográfico é um conjunto espacial de certa ordem de grandeza
      territorial que apresenta um esquema coerente de feições de relevo, tipos de solo, formas de vegetação
      e condições climático-hidrológicas. Tais domínios espaciais, de características paisagísticas e
      ecológicas integradas, ocorrem em uma espécie de área principal em que as condições fisiográficas
      e biogeográficas formam um complexo relativamente homogêneo e extensivo. Observe o mapa a seguir:'
