      O experimento idealizado pelo cientista Richard Lenski, em 1988, monitora a evolução de 12 populações de bactérias por mais de 75 mil gerações. O estudo demonstra o surgimento contínuo e esporádico de mutações, as quais podem se fixar por garantirem vantagem à população, ou levarem à extinção de determinada população.
      Em determinado momento, depois de muitas gerações, surgiu uma mutação que conferiu às bactérias, denominadas Cit , a capacidade de metabolizar um componente do meio de cultura (citrato), e isso proporcionou maior velocidade de crescimento.
