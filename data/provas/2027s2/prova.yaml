  - texto: 'Materiais poliméricos utilizados como revestimentos protetores podem apresentar diferentes
      comportamentos frente à combustão. O fluoreto de polivinilideno (PVDF) é um exemplo de polímero
      que, além de atuar como agente impermeabilizante, apresenta propriedades retardantes de chama. Essas
      propriedades estão relacionadas à presença de átomos de flúor em sua estrutura, o que resulta em
      alta temperatura de ignição e baixa liberação de calor durante a combustão. A estrutura do PVDF
      está representada na figura a seguir:'
  - figura: q007-1.webp
  - texto: Sobre este processo, é correto afirmar que
  alternativas:
    A:
      texto: a elevada quantidade de ligações C−F aumenta o calor liberado na combustão devido à alta
        energia dessas ligações.
    B:
      texto: a alta temperatura de ignição é necessária porque essa combustão é endotérmica por conta
        da alta energia de ligação C−F e, portanto, favorecida quando aquecida.
    C:
      texto: a ligação C−H tem maior diferença de eletronegatividade e, portanto, é quebrada primeiro
        no processo de queima.
    D:
      texto: a energia absorvida para a quebra da ligação C−F é maior do que para a quebra de ligações
        C−H, o que está associado a uma maior energia de ativação dessa combustão.
    E:
      texto: |-
        a presença de flúor diminui a polaridade da cadeia carbônica, tornando o polímero menos reativo ao oxigênio e, portanto, menos inflamável.
        Note e adote:
        Energias de ligação em kJ · mol :
        C−H = 415;
        C−F = 500.
  resposta: D
  anulada: false
