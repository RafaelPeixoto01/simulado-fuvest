  - texto: Considerando as relações ecológicas entre organismos marinhos descritas a seguir, assinale
      a alternativa que define corretamente a relação interespecífica apresentada.
  alternativas:
    A:
      texto: Rêmoras aderem ao corpo de tubarões, deslocando-se com eles e alimentando-se de restos de
        comida, sem afetar significativamente o tubarão. Essa interação caracteriza protocooperação.
    B:
      texto: Camarões limpadores removem parasitas da superfície de peixes, utilizando os parasitas como
        alimento, enquanto os peixes apresentam redução na carga parasitária. A interação entre camarões
        e peixes caracteriza predação.
    C:
      texto: Peixes vivem entre os tentáculos de anêmonas-do-mar, obtendo proteção contra predadores e
        contribuindo com nutrientes para a anêmona. Essa interação caracteriza mutualismo.
    D:
      texto: Zooxantelas vivem nos tecidos de corais, realizando fotossíntese e fornecendo compostos orgânicos
        ao coral, que oferece abrigo e nutrientes às algas. Essa interação caracteriza parasitismo.
    E:
      texto: Peixes-pescadores abrigam bactérias bioluminescentes que produzem luz utilizada para atrair
        presas, enquanto as bactérias recebem abrigo e nutrientes do peixe. Essa interação caracteriza
        comensalismo.
  resposta: C
