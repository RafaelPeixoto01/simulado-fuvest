      Exergames ampliam engajamento e melhoram habilidades motoras de crianças com TEA
      Crianças com Transtorno do Espectro Autista (TEA) costumam enfrentar desafios motores, sensoriais e comportamentais que dificultam a prática regular de atividade física. Nesse cenário, os exergames – jogos eletrônicos que dependem de movimentos corporais – surgem como uma alternativa a essas necessidades individuais.
      Foi a partir dessa realidade que o fisioterapeuta Natã Rafael Grola, doutorando da Escola de Educação Física e Esporte de Ribeirão Preto (EEFERP) da USP, decidiu investigar como crianças com TEA respondem fisiológica e comportamentalmente a esse tipo de atividade. Segundo ele, “dentre os recursos terapêuticos atualmente oferecidos no mercado, os consoles de exergames são opções mais acessíveis financeiramente”. Como parte das crianças atendidas apresenta longos períodos de exposição às telas, “achei que seria uma boa oportunidade unir atividade física e realidade virtual e avaliar se isso seria interessante para as pessoas com TEA, suas famílias e a comunidade”, afirma o pesquisador.
      No estudo, nove crianças de 7 a 10 anos diagnosticadas com TEA foram acompanhadas pela equipe, após uma “seleção desafiadora”. A estrutura da intervenção foi planejada com base em protocolos já descritos na literatura e adaptada à rotina das crianças atendidas. Os jogos selecionados exigiam movimentos amplos, como saltos, deslocamentos e ações coordenadas dos membros superiores e inferiores.
      As crianças participantes demonstraram afinidade com os jogos, conseguiram permanecer interessadas e se divertiram ao longo das sessões. “As crianças tinham limites diferentes quanto à execução e tempo de engajamento, mas em geral conseguiam se divertir e realizar o que era proposto durante o período que estavam em sala jogando.”
      Após a intervenção, o estudo encontrou melhora significativa nas habilidades de locomoção, no controle de objetos e no quociente de motricidade grossa. O pesquisador relata ainda que variáveis como alfabetização, compreensão das instruções e frequência de comparecimento no protocolo tiveram impacto direto nos resultados. “Os participantes que eram alfabetizados tinham melhor compreensão do que era exigido nos jogos.” Mesmo assim, afirma que crianças com maior nível de comprometimento também participaram ativamente, reforçando o potencial inclusivo da proposta.
      Apesar das respostas positivas, Grola afirma que os exergames não substituem terapias convencionais, mas adicionam um recurso valioso ao repertório de profissionais que atendem a crianças com TEA.
      Disponível em https://jornal.usp.br/. Adaptado.
