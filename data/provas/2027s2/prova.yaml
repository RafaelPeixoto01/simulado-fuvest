      Leia os excertos sobre o Sistema Agrícola Tradicional de Apanhadoras(es) de Flores Sempre-Vivas da Serra do Espinhaço em Minas Gerais:
      “Em termos de sazonalidade, na época das chuvas, as famílias concentram suas atividades nas terras baixas, onde se encontram as ‘roças’. Já na época da estiagem, concentram suas atividades nas terras altas, local em que coletam plantas ornamentais [as sempre-vivas] a serem comercializadas, assim como utilizam os campos nativos também para pastagem do gado.”
      Disponível em: http://dx.doi.org/10.5752/P.2595-7716.2022v4n1p58-80.
      “Panhava flor, pois é. Eu lembro desse dia assim, porque isso foi o nome que se deu para essa atividade. Então quando a gente estava lá reunido e a gente falando ‘o que é que cada uma faz?’, tinha uma coisa que era comum pra todos. Roça cada um faz de um jeito, gado uns têm outros não, mais todo mundo panhava flor. Então assim, eles tavam pensando o nome, então assim era coletor, era extrativista, até essas palavras saíram. Aí eu falei assim 'gente, eu nunca tinha ouvido falar em coleta, nunca tinha ouvido falar em extrativismo, o que a gente faz lá é panhar flor. Então a partir disso nós vamos formar um grupo de apanhador de flores, que aí entendendo que panhar flor é fazer esse modo de ser, de fazer, de viver. Assim, é muito mais amplo do que ir pra campo, até pra ir pra campo panhar tem toda uma história, um modo de ser.”
      Maria de Fátima Alves, a Tatinha, apanhadora de flores . Disponível em: https://www.iepha.mg.gov.br/
      Sobre a dinâmica de “panhar” flor, assinale a alternativa correta sobre o bioma, tipo de migração e o Sistema Agrícola Tradicional, respectivamente.
  alternativas:
    A:
      texto: Campos cerrados; interna; aspectos econômicos pautados na obtenção de lucros da comercialização
        de flores ornamentais e uso manual na colheita.
    B:
      texto: Caatinga; pendular; uso de técnicas rudimentares, com pouca ou nenhuma mecanização, predominante
        em pequenas propriedades, com produtividade reduzida.
    C:
      texto: |-
        Cerrado;
        transumância;
        envolvem
        espaços
        e agroecossistemas, transformação dos produtos agrícolas e cultura material e imaterial.
    D:
      texto: Pradarias; temporária; envolve sistemas alimentares locais com base em agrossistemas manejados
        para produção sustentável e herança imaterial.
    E:
      texto: Mata atlântica; sazonal; extrativismo sustentável em florestas nativas com base na cultura
        imaterial e na produção de alimentos seguros e nutritivos.
  resposta: C
