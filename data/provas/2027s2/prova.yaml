  - texto: |-
      Pesquisas recentes mostram avanços promissores em vacinas de RNAm contra o melanoma, um tipo de câncer de pele. O diferencial dessa tecnologia é sua individualização, uma vez que, após o sequenciamento do genoma do tumor, identificam-se mutações específicas do paciente, que não estejam presentes em suas células saudáveis. Essas sequências mutadas originam os chamados neoantígenos (proteínas anormais), que são codificados no RNAm da vacina. Desse modo, o sistema imunológico aprende a atacar somente as células daquele tumor.
      A necessidade de a vacina ser individualizada para cada paciente justifica-se, biologicamente, porque
  alternativas:
    A:
      texto: o sistema imunológico humano é capaz de reconhecer apenas proteínas produzidas por microrganismos
        externos, exigindo que o RNAm "disfarce" as células tumorais como bactérias.
    B:
      texto: a variabilidade genética entre tumores de diferentes indivíduos é alta, e uma vacina genérica
        poderia atacar proteínas comuns a células saudáveis, resultando em graves doenças autoimunes.
    C:
      texto: as células tumorais, ao contrário das células somáticas normais, não realizam a tradução
        de moléculas de RNAm próprio, de modo a expressar somente proteínas normais.
    D:
      texto: a individualização permite que o RNAm se integre seletivamente ao genoma das células T citotóxicas,
        garantindo que a memória imunológica seja passada para as próximas gerações do indivíduo.
    E:
      texto: o código genético de um melanoma é diferente do código genético das células somáticas normais
        do mesmo paciente, o que faz com que o RNAm da vacina seja traduzido de forma aleatória.
  resposta: B
  anulada: false
  pendencias: []
