  - texto: |-
      Este poeta está
      Do outro lado do mar
      Mas reconheço a sua voz há muitos anos
      E digo ao silêncio os seus versos devagar
      Relembrando
      O antigo jovem tempo tempo quando
      Pelos sombrios corredores da casa antiga
      Nas solenes penumbras do silêncio
      Eu recitava
      “As três mulheres do sabonete Araxá”
      E minha avó se espantava
      Manuel Bandeira era o maior espanto da minha avó
      Quando em manhãs intactas e perdidas
      No quarto já então pleno de futura
      Saudade
      Eu lia
      A canção do “Trem de ferro”
      E o “Poema do beco”
      Tempo antigo lembrança demorada
      Quando deixei uma tesoura esquecida nos ramos da cerejeira Quando
      Me sentava nos bancos pintados de fresco
      E no Junho inquieto e transparente
      As três mulheres do sabonete Araxá
      Me acompanhavam
      Tão visíveis
      (...)
      Estes poemas caminharam comigo e com a brisa
      (...)
      E foram parte do tempo respirado
      Sophia de Mello Breyner Andresen. Geografia .
      No poema “Manuel Bandeira”, de Sophia de Mello Breyner Andresen, a voz lírica revisita memórias da juventude associadas à leitura da obra do poeta modernista brasileiro. A partir da construção temporal, da dimensão metapoética e do diálogo intertextual presentes no poema, é correto afirmar:
  alternativas:
    A:
      texto: A evocação da infância e da juventude funciona como recurso nostálgico, sem interferir na
        constituição estética da voz poética, que privilegia a descrição objetiva das lembranças.
    B:
      texto: O poema contrapõe a poesia portuguesa à brasileira, sugerindo que a obra de Manuel Bandeira
        se insere em uma realidade cultural distinta da experiência do eu lírico e, portanto, intangível.
    C:
      texto: A referência reiterada a poemas de Manuel Bandeira transforma a memória individual em experiência
        literária compartilhada, reverenciando o poeta e revelando como sua poesia engendra a constituição
        subjetiva e afetiva da voz lírica ao longo do tempo.
    D:
      texto: A presença de imagens fragmentadas e cotidianas, como “a tesoura esquecida” e “os bancos
        pintados de fresco”, denota a intenção de negar a idealização do passado, aproximando o poema
        da estética realista.
    E:
      texto: O uso predominante de verbos no pretérito imperfeito indica a impraticabilidade da recuperação
        memorialística, razão pela qual o poema sinaliza ser a poesia incapaz de preservar experiências
        humanas.
  resposta: C
