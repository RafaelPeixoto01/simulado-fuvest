  - texto: |-
      O Agente Secreto parece ter dificuldades em conter a força transbordante de uma pulsão criativa que se descobriu liberada. Camadas se multiplicam em citações fílmicas e ações cristalizadas se adensam para condensar, como num mergulho em espelhos enfileirados. A própria sala de cinema (já onipresente no longa anterior Retratos Fantasmas e que agora surge pela ficção no Cinema São Luiz) faz novos sedimentos de filme dentro do filme dentro do cinema, figurando, através das mãos do projecionista protagonista, a exibição e manipulação inclusive da matéria coisa-película. Algumas críticas se dedicaram a este horizonte que deglute sem dó, como um moedor de carne, tudo o que se cristaliza em gênero cinematográfico em torno de 1977, época em que a trama ficcional se passa. Podemos começar (e talvez findar) por Tubarão /1975 de Steven Spielberg, o grande filme de ação que afirma a nova geração da Hollywood nos anos 1970, ao qual Mendonça rende homenagem pelo fio que remete à sua Recife, assolada na realidade pela presença muito concreta do peixe em suas praias e os fantasmas imaginários que produz.
      Fernão Pessoa Ramos. O Agente Secreto . Disponível em https://aterraeredonda.com.br/. Adaptado.
      O excerto destaca que o filme O Agente Secreto , de Kleber Mendonça Filho, mobiliza “camadas”, “citações fílmicas” e incorpora gêneros cinematográficos dos anos 1970. Considerando o conceito de intertextualidade, esse procedimento
  alternativas:
    A:
      texto: caracteriza-se pela retomada de obras anteriores como forma de estabilizar sentidos já consagrados,
        reforçando convenções narrativas reconhecíveis.
    B:
      texto: manifesta-se na articulação crítica de referências e gêneros anteriores, que são incorporados
        à obra de modo transformador, produzindo novos sentidos.
    C:
      texto: restringe-se à presença explícita de citações e homenagens, fortalecendo os sentidos originais
        das obras referenciadas.
    D:
      texto: filia-se a uma estética predominante nos modelos estrangeiros, cujas convenções servem de
        parâmetro e comparação para o desenvolvimento da narrativa local.
    E:
      texto: orienta-se por referenciar um imaginário cinematográfico específico, com ênfase na ambientação
        da reconstituição histórica.
  resposta: B
  anulada: false
  pendencias: []
