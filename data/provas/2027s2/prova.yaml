  enunciado:
  - texto: |-
      “A acessibilidade trata dos problemas e das soluções relacionados às diversas possíveis barreiras entre o público e a comunicação do museu, sejam elas físicas, sensoriais ou de atitude, a partir da compreensão de que a sociedade é composta de pessoas em diferentes condições e com diferentes necessidades. O tema ganha ainda mais relevância quando se tem em perspectiva as pessoas com deficiência, que possuem algum tipo de limitação em diferentes gradações, podendo variar de comprometimentos leves, médios e graves até a perda total da capacidade física, intelectual ou sensorial.
      Presentes em todas as esferas sociais, as pessoas com deficiência integram os diferentes públicos que frequentam museus e espaços culturais, tais como público familiar, público escolar, grupos de empresas ou de órgãos públicos, público regular e espontâneo e visitantes especializados. Assim, a adequação dessas instituições visando à acessibilidade universal é uma importante demanda para garantir o direito de todos ao acesso a ambientes mais acolhedores e inclusivos, livres de barreiras de acesso físico, comunicacional, intelectual e de atitudes.”
      Instituto Brasileiro de Museus. Acessibilidade . Adaptado.
      Uma exposição idealmente acessível deve garantir:
  alternativas:
    A:
      texto: A circulação horizontal/vertical sem obstáculos e com sinalização adequada, informação em
        formatos acessíveis, oferta de réplicas, maquetes e materiais táteis e equipe capacitada para
        apoio quando solicitado.
    B:
      texto: Cadeira de rodas para quem tem mobilidade reduzida, sinalização voltada para pessoas com
        deficiência, alturas variáveis dos objetos em exposição e uma equipe multidisciplinar para orientar
        a leitura das obras.
    C:
      texto: Rampas e elevadores em todos os percursos, mapas táteis na entrada, visitas mediadas em horários
        fixos para pessoas com deficiência e oferta de material explicativo digital por QR code , priorizando
        a autonomia do visitante.
    D:
      texto: Recursos de inclusão comunicacional, textos em linguagem simples, maquetes táteis de obras
        principais e um balcão de atendimento para encaminhar visitantes com deficiência a um circuito
        adaptado.
    E:
      texto: Sinalização visual com pictogramas universais, iluminação adequada e contraste nas salas,
        disponibilização de fones com amplificação de som e a possibilidade de agendamento prévio para
        atendimento personalizado conforme a necessidade do público.
  resposta: A
  anulada: false
