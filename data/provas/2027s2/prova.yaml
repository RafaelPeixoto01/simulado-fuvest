        social será conquistada por meio da educação formal, mas restrita ao espaço familiar, sem ambições
        externas.
    B:
      texto: distribuem-se em vários ensaios críticos, nos quais ela defende a importância da educação
        formal para as mulheres de classe alta, como forma de garantir sua superioridade social e intelectual
        sobre os homens.
    C:
      texto: chamam a atenção dos líderes do governo em favor da educação dos desvalidos, do abolicionismo
        e dos projetos republicanos.
    D:
      texto: convocam a atenção do governo por maiores e melhores condições para a educação da população,
        por meio da defesa de um projeto pedagógico alinhado com os padrões abolicionistas vigentes no
        século XIX.
    E:
      texto: defendem a educação das mulheres como um meio fundamental para a conquista da igualdade de
        direitos, liberdade e autonomia, combatendo a subordinação e o silêncio impostos pela sociedade
        patriarcal.
