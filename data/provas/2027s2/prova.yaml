      Work has begun on a controversial project to create the building blocks of human life from scratch. The research has been taboo until now because of concerns it could lead to designer babies or unforeseen changes for future generations. But now the World's largest medical charity, the Wellcome Trust, has financed the project and says it has the potential to do more good than harm by accelerating treatments for many diseases.
      A doctor who is part of the project says the research was the next giant leap in biology. “We are looking at therapies that will improve people's lives as they age, that will lead to healthier aging with less disease. We are looking to use this approach to generate disease-resistant cells we can use to repopulate damaged organs, even the immune system”, he said.
      But critics fear the research opens the way for unscrupulous researchers seeking to create enhanced or modified humans. And although the project is hunting for medical benefits, there is nothing to stop scientists misusing the technology. They could create biological weapons, enhanced humans or even creatures that have human DNA. Given the potential misuse of the technology, the question for Wellcome is why they chose to fund it. The decision was not made lightly, says Dr Tom Collins. “This technology is going to be developed one day, so by doing it now, we are at least trying to do it in as responsible a way as possible and to confront the ethical and moral questions in as upfront way as possible”.
      BBC News . June 2025. Adaptado.
