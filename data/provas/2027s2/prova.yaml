  - texto: |-
      Folha de São Paulo, 05 de fevereiro de 2026. Adaptado.
      Em fevereiro de 2026, incêndios de grandes proporções ocorreram em diversas partes da Patagônia Argentina, causando destruição e colocando em risco a sobrevivência de diferentes espécies animais e vegetais.
      Assinale a alternativa que indica, corretamente, as razões para o alastramento de incêndios na região.
  alternativas:
    A:
      texto: A região andino-patagônica é marcada por planícies e terrenos com pouca variação altimétrica,
        o que facilita o deslocamento das chamas e dificulta a atuação de brigadistas.
    B:
      texto: A presença de florestas ombrófilas, misturada com espécies exóticas de pinheiros e álamos,
        forma um combustível seco, facilitando a combustão.
    C:
      texto: Ventos pouco intensos, característicos da Patagônia, dificultam a contenção das chamas, bem
        como atuam no aquecimento da superfície, facilitando a rápida propagação das chamas.
    D:
      texto: A Patagônia enfrenta uma seca crônica, com registros de níveis de precipitação abaixo da
        média nos últimos anos, o que reduz a umidade do solo e da vegetação, tornandoa altamente inflamável.
    E:
      texto: Incêndios são frequentes nas áreas de transição entre a floresta equatorial e a estepe patagônica,
        onde a vegetação é densa e mais seca devido ao gradiente de temperatura e precipitação.
  resposta: D
