  - texto: |-
      Considere a seguinte passagem adaptada de um artigo acadêmico:
      “O território é um espaço social produzido como uma representação que incorpora recursos específicos para conformar um patrimônio sociocultural respaldado na tradição (história local). Essa representação possibilita apontar alternativas inovadoras para o desenvolvimento.”
      Adaptado de GEHLEN & RIELLA, 2004.
      Em agosto de 2025, o Governo Federal publicou o Decreto nº 12.600, que incluía as hidrovias dos rios Madeira, Tocantins e Tapajós no Programa Nacional de Desestatização (PND). O plano previa obras de dragagem para aprofundar os rios e facilitar o transporte de grãos do agronegócio em grandes barcaças. No entanto, o decreto causou forte controvérsia porque foi publicado sem a consulta prévia às populações ribeirinhas e indígenas, como determina a Convenção 169 da OIT, além de desconsiderar riscos ambientais associados à dragagem. A reação foi rápida: indígenas de mais de 15 etnias, quilombolas e ativistas ambientais organizaram protestos e chegaram a ocupar por mais de 30 dias a sede da empresa Cargill, em Santarém, no Pará. Diante da pressão popular e das críticas sobre possíveis danos ambientais e sociais na Amazônia, o governo revogou o decreto em fevereiro de 2026.
      Considerando a passagem citada, o histórico do Decreto nº 12.600, bem como os conceitos sociológicos de território e desenvolvimento sustentável, a mobilização social que levou à revogação da medida pode ser interpretada como uma
  alternativas:
    A:
      texto: resistência à visão do rio como infraestrutura logística, afirmando o território como um
        espaço de reprodução de vida, cultura e valores simbólicos singulares das populações tradicionais.
    B:
      texto: demanda econômica que visava a garantir que as populações indígenas recebessem indenizações
        monetárias diretas pela exploração das hidrovias pelo capital privado e pelos danos que ela causaria.
    C:
      texto: demonstração da oposição dos povos indígenas à perda de controle sobre recursos valiosos
        do território, em especial dos minérios de alto valor comercial que seriam extraídos durante a
        dragagem.
    D:
      texto: tentativa de impedir a subordinação do território indígena aos interesses de mercado, medida
        necessária para promover o desenvolvimento da região e a plena integração da Amazônia à economia
        global.
    E:
      texto: disputa técnica sobre a engenharia da dragagem, no qual indígenas e ambientalistas buscavam
        substituir o projeto de dragagem e a empresa vencedora da licitação por outra de sua preferência
        regional.
  resposta: A
  anulada: false
  pendencias: []
