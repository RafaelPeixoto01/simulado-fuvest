  - texto: |-
      As mitocôndrias são organelas responsáveis pela produção de ATP via respiração celular aeróbica. Essas organelas possuem DNA próprio (mtDNA), uma molécula circular com cerca de 16.500 pares de bases que codifica 37 genes, a maioria relacionados à cadeia transportadora de elétrons.
      O heredograma a seguir representa três gerações de uma família. Na geração P, a mãe é portadora de uma mutação no mtDNA e o pai possui mtDNA normal.
  - figura: q031-1.webp
  - texto: 'Com base nos conhecimentos sobre herança mitocondrial, é correto afirmar:'
  alternativas:
    A:
      texto: Todos os quatro indivíduos da geração F herdaram a mutação no mtDNA materno, porém apenas
        a filha 1 e a filha 2 poderão transmiti-la à geração seguinte. O neto, pertencente à geração F
        , não porta a mutação, pois recebeu seu mtDNA exclusivamente da mãe, cujo mtDNA é normal.
    B:
      texto: Apenas a filha 1 e a filha 2, na geração F , herdaram a mutação no mtDNA, pois esse material
        genético é transmitido junto com o cromossomo X. Os indivíduos filho 1 e filho 2, por receberem
        o cromossomo Y do pai, não possuem mitocôndrias de origem materna e, portanto, não carregam a
        mutação.
    C:
      texto: A neta, na geração F , não apresentará a mutação porque receberá o DNA mitocondrial de seu
        pai, de modo que a quantidade de mitocôndrias com a mutação se torna insuficiente para causar
        qualquer efeito.
    D:
      texto: O neto, na geração F , poderá herdar a mutação mitocondrial de seu pai, filho 1, uma vez
        que o espermatozoide também contribui igualmente com mitocôndrias para o zigoto, as quais se incorporam
        ao embrião e participam normalmente do metabolismo celular do novo indivíduo.
    E:
      texto: A mutação no mtDNA da mãe, na geração P, será transmitida apenas às filhas da geração F ,
        em padrão semelhante ao da herança ligada ao cromossomo X dominante, já que tanto o mtDNA quanto
        o cromossomo X são de origem materna.
  resposta: A
  anulada: false
