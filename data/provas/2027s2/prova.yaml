  enunciado:
  - texto: Em Canção para ninar menino grande , de Conceição Evaristo, as diversas mulheres que atravessam
      a vida de Fio Jasmim são marcadas pela pluralidade de experiências. Dadas as diferenças sociais
      e de classe entre personagens, como Juventina e Pérola Maria, assinale a alternativa que descreve
      a articulação dessas distinções na narrativa.
  alternativas:
    A:
      texto: A autora opta por uma representação idílica da solidariedade entre mulheres negras, na qual
        as diferenças de renda e educação são anuladas por um sentimento místico de união que transcende
        as barreiras do capitalismo.
    B:
      texto: O foco da obra é demonstrar que, para a mulher negra, a ascensão social é um mito meritocrático,
        pois todas as personagens, independentemente de sua profissão, terminam a narrativa na mesma condição
        de precariedade absoluta.
    C:
      texto: A obra demonstra, sobretudo por meio das disparidades sociais, que a vivência do abandono
        afetivo é moldada pelas condições materiais, em que a luta pela subsistência de certas personagens
        femininas contrasta com a busca por autonomia intelectual e estabilidade econômica de outras.
    D:
      texto: As personagens que alcançam maior estabilidade financeira são retratadas como tendo “embranquecido”
        seus costumes, perdendo a conexão com a cultura popular, em oposição às personagens que permanecem
        na pobreza.
    E:
      texto: As diferenças de classe são apresentadas como obstáculos intransponíveis que impedem qualquer
        traço de ancestralidade comum, caracterizando a experiência de cada mulher como um isolamento
        absoluto em sua própria casta.
  resposta: C
  anulada: false
