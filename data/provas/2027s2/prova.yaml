  - texto: 'Logo após escovar os dentes, é comum ocorrer alteração na percepção do sabor de alimentos
      e bebidas. Por um breve período, esse efeito está associado à presença de surfactantes na pasta
      de dente, que interagem com receptores de sabor localizados na língua. Tais receptores são proteínas
      cujas estruturas tridimensionais são mantidas por interações entre regiões polares e apolares da
      molécula. Por sua vez, os surfactantes possuem uma região hidrofóbica, o que lhes permite interagir
      com regiões específicas dessas proteínas. A representação a seguir mostra a estrutura esquemática
      de um surfactante presente em pastas de dente:'
  - figura: q010-1.webp
  - texto: Com base nessas informações, o efeito descrito ocorre principalmente porque o surfactante
  alternativas:
    A:
      texto: interage preferencialmente com regiões hidrofílicas das proteínas, promovendo sua solubilização
        completa em meio aquoso.
    B:
      texto: promove a desnaturação irreversível das proteínas receptoras, impedindo a percepção de sabores.
    C:
      texto: interage com regiões apolares das proteínas receptoras, alterando de maneira reversível sua
        conformação espacial e, consequentemente, sua função.
    D:
      texto: rompe ligações covalentes da estrutura primária das proteínas receptoras, modificando irreversivelmente
        sua composição química.
    E:
      texto: estabelece interações com as proteínas que promovem a dissociação de seus aminoácidos constituintes.
  resposta: C
  anulada: false
