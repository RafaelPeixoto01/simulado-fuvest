      Nos últimos anos, a região de São Paulo tem registrado eventos climáticos extremos, caracterizados pela alternância entre curtos períodos de chuvas intensas e longos períodos de estiagem, conforme o gráfico a seguir:
      Número de dias com precipitação acima de 80 mm e
      100 mm no Instituto de Astronomia, Geofísica e Ciências
      Atmosféricas da Universidade de São Paulo
  - figura: q005-1.webp
  - texto: |-
      Marengo e colaboradores (2020). Annals of the New York Academy of Sciences .
      Essa variabilidade extrema favorece a erosão do solo, especialmente em áreas com desmatamento e solo exposto. O material erodido é transportado para rios e reservatórios junto com sedimentos e nutrientes, influenciando a atividade de microrganismos aquáticos, assim como a turbidez, temperatura e a disponibilidade de oxigênio dissolvido na água.
      A partir da leitura do texto e da análise do gráfico apresentado, é correto afirmar:
  alternativas:
    A:
      texto: O enriquecimento por nutrientes e o aumento de matéria orgânica decorrentes da erosão tendem
        a ampliar a diversidade, ao favorecer organismos autotróficos e heterotróficos e manter a proporção
        funcional da comunidade.
    B:
      texto: O aumento da temperatura da água eleva sua capacidade de dissolver oxigênio, compensando
        o consumo pela decomposição e favorecendo espécies sensíveis à disponibilidade de O .
    C:
      texto: A alternância entre estiagens e chuvas intensas tende a manter a qualidade da água, pois
        eventos extremos de precipitação não alteram significativamente a dinâmica física e química dos
        ecossistemas aquáticos.
    D:
      texto: O aumento de sedimentos após eventos erosivos reduz a decomposição aeróbia, pois partículas
        em suspensão impedem a atividade de organismos decompositores.
    E:
      texto: O aumento da temperatura da água e do aporte de matéria orgânica pode elevar a demanda bioquímica
        de oxigênio e favorecer organismos tolerantes a baixas concentrações de O .
  resposta: E
