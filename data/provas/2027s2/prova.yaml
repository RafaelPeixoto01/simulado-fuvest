  - texto: |-
      A balada é um gênero narrativo de origem medieval, tradicionalmente ligado à dança, à música e ao canto. Sua composição tem um ritmo mais lento, quer de índole romântica, quer como registro de um quotidiano alienador ou hostil. A oralidade tem grande importância na composição, execução e transmissão da balada, o que leva a repetições de fórmulas no interior de uma mesma estrofe ou entre estrofes. Esse gênero tem também a característica geral de não ter um autor identificável, mas coletivo e anônimo, o que o faz representativo de uma comunidade ou um povo.
      Miguel Alarcão. E-Dicionário de Termos Literários , “Balada”. Disponível em https://edtl.fcsh.unl.pt/encyclopedia/balada. Adaptado.
      A partir do que se afirma no texto, a escolha do título Balada de amor ao vento se justifica porque o romance
  alternativas:
    A:
      texto: inaugura na literatura moçambicana do século XX uma vertente que busca resgatar e repropor
        a tradição lírica de língua portuguesa em sua forma poética e temática amorosa após a independência
        de Moçambique.
    B:
      texto: ressignifica elementos da tradição portuguesa e da sociedade moçambicana, por meio de uma
        narradora que abandona a posição resignada da expectativa e da submissão e reinterpreta os papéis
        sociais da mulher ligados ao amor e à família.
    C:
      texto: adota o título de “balada” com intenção irônica, já que se trata de um livro escrito sob
        o gênero “romance”. Além disso, é narrado em primeira pessoa por Sarnau, personagem que não apresenta
        semelhanças com a voz coletiva da balada tradicional.
    D:
      texto: procura atualizar os traços típicos da balada, como a voz feminina que se manifesta predominantemente
        na espera e na dor, mas frustra esse objetivo, uma vez que Sarnau se submete à dominação masculina
        no desfecho do romance.
    E:
      texto: busca marcar a derrocada da tradição lírica portuguesa em Moçambique, assinalando a perda
        da inocência, o malogro das ilusões amorosas e a substituição da ordem da honra pela lógica do
        capital.
  resposta: B
  anulada: false
