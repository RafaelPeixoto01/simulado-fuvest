  - texto: O LIGO é um observatório projetado para detectar ondas gravitacionais — distorções no espaço-tempo
      previstas por Einstein e causadas por eventos cósmicos massivos, como a colisão de buracos negros.
      Ao contrário dos telescópios ópticos, ele utiliza a interferometria de laser em braços perpendiculares
      de 4 km para medir variações subatômicas na distância entre espelhos; quando uma onda atravessa
      o detector, ela altera essas distâncias, gerando sinais de luz que permitem aos cientistas mapear
      fenômenos invisíveis a bilhões de anos-luz. O LIGO é tão preciso que consegue medir variações equivalentes
      a um milésimo do diâmetro de um próton, sendo o diâmetro do próton da ordem de 10 m.
  - figura: q020-1.webp
  - texto: |-
      LIGO Hanford. O Laboratório LIGO opera dois locais de detectores, um próximo a Hanford, no leste de Washington, e outro próximo a Livingston, na Louisiana. Esta foto mostra o local do detector de Hanford. Disponível em https://www.ligo.caltech.edu/image/.
      Sabendo que o laser utilizado possui comprimento de onda da ordem de 10 m (infravermelho) e que a velocidade da luz no vácuo é 3×10 m/s, é correto afirmar:
  alternativas:
    A:
      texto: A variação de distância que o detector consegue medir é da ordem de grandeza de 10 m.
    B:
      texto: A razão entre o comprimento de um braço do detector e a variação mínima de distância que
        ele mede é da ordem de grandeza de10 .
    C:
      texto: O tempo necessário para que a luz do laser complete uma “ida e volta” em um dos braços do
        interferômetro é da ordem de grandeza de10 s.
    D:
      texto: O diâmetro do próton é cerca de um milhão de vezes maior do que o comprimento de onda do
        laser utilizado no experimento.
