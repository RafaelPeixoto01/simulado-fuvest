      Atualmente, com o fácil acesso à internet e a grande quantidade de ferramentas que auxiliam a produção de vídeos, é fácil gerar vídeos com notícias falsas, as conhecidas fake news . Alguns desses vídeos apresentam geradores caseiros de energia infinita e incluem propagandas de venda de kits para construir esses geradores em casa. Qualquer vídeo que prometa geração infinita de energia está usando truques para enganar o espectador.
      Dentre as alternativas a seguir, qual delas apresenta argumentos físicos corretos para rebater essas fake news ?
  alternativas:
    A:
      texto: Um gerador transforma energia mecânica em energia elétrica. O motor transforma energia elétrica
        em energia mecânica. Dependendo do material escolhido para construir um motor e um gerador, é
        possível gerar um sistema de movimento perpétuo, no qual a energia inicial colocada neles nunca
        é dissipada.
    B:
      texto: É possível colocar ímãs naturais em posições específicas para fazer um motor girar para sempre
        sem precisar ligálo na tomada, considerando que os campos magnéticos dos ímãs naturais são perpétuos.
    C:
      texto: A tensão típica gerada por eletricidade estática é extremamente alta. Por exemplo, o atrito
        do pente no cabelo seco pode gerar uma tensão de 1500 V a 5000 V, e essa eletricidade estática
        pode ser acumulada para ligar uma lâmpada comum por vários minutos.
    D:
      texto: Fios supercondutores em temperatura ambiente podem ser usados para construir um gerador caseiro
        que terá perda zero de energia e funcionará para sempre. Dessa forma, com o desenvolvimento dos
        materiais supercondutores, será possível construir geradores caseiros de energia infinita.
    E:
      texto: O atrito entre superfícies, a resistência do ar, a resistência elétrica dos fios e a troca
        de calor entre partes com diferentes temperaturas sempre consomem parte da energia, independentemente
        dos materiais utilizados.
