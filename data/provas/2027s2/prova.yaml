      Most of us have no trouble accepting that “violence is bad”. But what makes it “bad”? Moral philosophers have grappled with this for millennia. One of the most well-known moral systems deals with rules. The basis for a rule-based morality derives from “universality”. Some examples: “Treat others as we want to be treated”, “don’t harm others unnecessarily”. It’s hard to imagine a good reason to oppose these.
      When a rule is worth following, it becomes “good”. This is why many agree “violence is bad” is a moral rule: it can be applied universally. Where rule-based morality runs into problems is when two moral rules conflict. In this case, a rule we support is: “stopping Nazism is good”. Another is: “violence is bad”. This returns us to a dilemma instead of solving it. Many might say this rule only requires amendments: “Violence is bad, except when it can stop Nazism.” If “stopping Nazism” meant extreme violence, then extreme violence is justified. We could keep making amendments but doing so could continue forever.
      Another way philosophers deliberate morality is through consequences. If an action brings more happiness into the world, then that action is good. If punching a Nazi means preventing Nazism, then punching Nazis is justified. The ends justify the means. Yet this gives a blank cheque to any action if we can justify more good.
      If killing one innocent means saving hundreds, then murder is justified. But if a moral system justifies awful acts consistently, it can’t be a basis for moral deliberation.
      The Guardian . January 2017. Adaptado.
