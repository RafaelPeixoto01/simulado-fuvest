  - texto: |-
      Pode-se afirmar a existência de uma divisão racial do espaço em nosso país, uma espécie de segregação, com acentuada polarização, extremamente desvantajosa para a população negra: quase dois terços da população branca (64%) se concentram na região mais desenvolvida do país, enquanto a população negra, quase na mesma proporção (69%), concentra-se no resto do país, sobretudo em regiões mais pobres como é o caso do Nordeste e Minas Gerais. (...) Acontece que o modelo de desenvolvimento econômico brasileiro marcou, nas duas últimas décadas, a consolidação da sociedade capitalista em nosso país. Altas taxas de crescimento da economia e acelerada urbanização, estimuladas pela intervenção direta do estado, resultaram num tipo de “integração” das regiões subdesenvolvidas às exigências da industrialização do Sudeste.
      Lélia Gonzalez. Por um feminismo afro-latino-americano: ensaios, intervenções e diálogos . Rio de Janeiro: Zahar, 2020.
      O excerto foi extraído do ensaio “Mulher negra”, publicado originalmente em 1985, e sustenta que
  alternativas:
