[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Regras padrao do ruff + ordenacao de imports (02-ARCHITECTURE §5)
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# A pasta backend/alembic/ (migrations) faria o ruff tratar o pacote como first-party
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
